openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VoiceOrch - AI Voice Agent Orchestration Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agents
    description: Voice agent management
  - name: calls
    description: Call management
  - name: providers
    description: Provider key management
  - name: analytics
    description: Dashboard analytics
  - name: knowledge-base
    description: Knowledge base and RAG document management
  - name: wallet
    description: Wallet balance, top-up, and billing
  - name: account
    description: API keys, org key, and concurrent call limits
  - name: activity-logs
    description: Audit log of all platform events
  - name: phone-numbers
    description: Managed phone number provisioning (platform Vobiz account)
  - name: webhook-endpoints
    description: User-configured webhook endpoints for call event delivery
  - name: monitor
    description: Real-time active call monitoring
  - name: onboarding
    description: User onboarding flow
  - name: campaigns
    description: Auto-call campaign management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Agents ──────────────────────────────────────────────────────────────────
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: Validation error

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get a single agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /agents/{id}/toggle:
    patch:
      operationId: toggleAgent
      tags: [agents]
      summary: Toggle agent active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found

  # ── Calls ───────────────────────────────────────────────────────────────────
  /calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: List calls with optional agent filter
      parameters:
        - name: agentId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
    post:
      operationId: initiateCall
      tags: [calls]
      summary: Initiate a new call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallInput"
      responses:
        "201":
          description: Call initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Validation error

  /calls/{id}:
    get:
      operationId: getCall
      tags: [calls]
      summary: Get call details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Call details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found
    patch:
      operationId: updateCall
      tags: [calls]
      summary: Update call record (status, transcript, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallUpdate"
      responses:
        "200":
          description: Updated call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  /calls/outbound:
    post:
      operationId: initiateOutboundCall
      tags: [calls]
      summary: Initiate an outbound phone call via the agent's telephony provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundCallBody"
      responses:
        "201":
          description: Outbound call initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Validation error or provider misconfiguration
        "404":
          description: Agent or telephony provider not found

  /calls/{id}/transfer:
    post:
      operationId: transferCall
      tags: [calls]
      summary: Transfer an active call to another number or SIP URI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCallBody"
      responses:
        "200":
          description: Transfer initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Validation error or provider misconfiguration
        "404":
          description: Call not found
        "409":
          description: Call is not active or already transferred

  /calls/{id}/end:
    patch:
      operationId: endCall
      tags: [calls]
      summary: End an active call
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallEndPayload"
      responses:
        "200":
          description: Call ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  /calls/{id}/disposition:
    patch:
      operationId: updateCallDisposition
      tags: [calls]
      summary: Manually set or override disposition fields for a call
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dispositionResult:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
      responses:
        "200":
          description: Disposition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  # ── Provider Keys ────────────────────────────────────────────────────────────
  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List configured provider keys
      responses:
        "200":
          description: List of provider configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderConfig"
    post:
      operationId: createProvider
      tags: [providers]
      summary: Add a provider key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Provider config created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
        "400":
          description: Validation error

  /providers/{id}:
    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
        "404":
          description: Not found
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Analytics (wow endpoints) ────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getDashboardStats
      tags: [analytics]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /analytics/calls/recent:
    get:
      operationId: getRecentCalls
      tags: [analytics]
      summary: Get recent call activity feed (last 20)
      responses:
        "200":
          description: Recent calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"

  /analytics/calls/by-status:
    get:
      operationId: getCallsByStatus
      tags: [analytics]
      summary: Get call counts grouped by status
      responses:
        "200":
          description: Calls by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallStatusCount"

  /analytics/calls/daily:
    get:
      operationId: getDailyCallVolume
      tags: [analytics]
      summary: Get daily call volume for the last 7 days
      responses:
        "200":
          description: Daily call volume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyCallVolume"

  # ── Knowledge Bases ─────────────────────────────────────────────────────────
  /knowledge-bases:
    get:
      operationId: listKnowledgeBases
      tags: [knowledge-base]
      summary: List all knowledge bases
      responses:
        "200":
          description: List of knowledge bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
    post:
      operationId: createKnowledgeBase
      tags: [knowledge-base]
      summary: Create a new knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseInput"
      responses:
        "201":
          description: Created knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          description: Validation error

  /knowledge-bases/{id}:
    get:
      operationId: getKnowledgeBase
      tags: [knowledge-base]
      summary: Get a knowledge base with its documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Knowledge base with documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDetail"
        "404":
          description: Not found
    patch:
      operationId: updateKnowledgeBase
      tags: [knowledge-base]
      summary: Update a knowledge base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseUpdate"
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "404":
          description: Not found
    delete:
      operationId: deleteKnowledgeBase
      tags: [knowledge-base]
      summary: Delete a knowledge base and all its data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /knowledge-bases/{id}/documents:
    get:
      operationId: listKbDocuments
      tags: [knowledge-base]
      summary: List documents in a knowledge base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KbDocument"
    post:
      operationId: addKbDocument
      tags: [knowledge-base]
      summary: Add a document (text paste or URL) and start ingestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KbDocumentInput"
      responses:
        "202":
          description: Document accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KbDocument"
        "400":
          description: Validation error
        "404":
          description: Knowledge base not found

  /knowledge-bases/{id}/documents/{docId}:
    delete:
      operationId: deleteKbDocument
      tags: [knowledge-base]
      summary: Delete a document and its chunks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /knowledge-bases/{id}/query:
    post:
      operationId: queryKnowledgeBase
      tags: [knowledge-base]
      summary: Test retrieval — returns top-K chunks for a query
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KbQueryInput"
      responses:
        "200":
          description: Ranked chunks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KbChunkResult"
        "400":
          description: Validation error
        "404":
          description: Not found

  # ── Wallet ──────────────────────────────────────────────────────────────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get current user wallet balance and settings
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "401":
          description: Unauthorized

  /wallet/topup:
    post:
      operationId: createTopup
      tags: [wallet]
      summary: Create a Razorpay order for wallet top-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupInput"
      responses:
        "200":
          description: Razorpay order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupOrder"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /wallet/verify-payment:
    post:
      operationId: verifyPayment
      tags: [wallet]
      summary: Verify Razorpay payment and credit wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentInput"
      responses:
        "200":
          description: Payment verified and wallet credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "400":
          description: Payment verification failed
        "401":
          description: Unauthorized

  /wallet/transactions:
    get:
      operationId: listTransactions
      tags: [wallet]
      summary: List wallet transactions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletTransaction"
        "401":
          description: Unauthorized

  /wallet/autopay:
    patch:
      operationId: updateAutopay
      tags: [wallet]
      summary: Update auto-pay settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoPaySettings"
      responses:
        "200":
          description: Updated wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "401":
          description: Unauthorized

  # ── Account ──────────────────────────────────────────────────────────────────
  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: Get account keys, org key, and concurrency settings
      responses:
        "200":
          description: Account info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"
        "401":
          description: Unauthorized

  /account/regenerate-api-key:
    post:
      operationId: regenerateApiKey
      tags: [account]
      summary: Regenerate the user's API key
      responses:
        "200":
          description: New account info with fresh API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"
        "401":
          description: Unauthorized

  /account/add-concurrent:
    post:
      operationId: addConcurrentSlot
      tags: [account]
      summary: Purchase one additional concurrent call slot ($5 deducted from wallet)
      responses:
        "200":
          description: Updated account info with incremented concurrent limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"
        "402":
          description: Insufficient wallet balance
        "401":
          description: Unauthorized

  # ── Activity Logs ─────────────────────────────────────────────────────────────
  /activity-logs:
    get:
      operationId: listActivityLogs
      tags: [activity-logs]
      summary: List audit log events for the authenticated user
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of activity log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"
        "401":
          description: Unauthorized

  # ── Phone Numbers ────────────────────────────────────────────────────────────
  /phone-numbers:
    get:
      operationId: listPhoneNumbers
      tags: [phone-numbers]
      summary: List all phone numbers owned by the authenticated user
      responses:
        "200":
          description: List of owned phone numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhoneNumber"
        "401":
          description: Unauthorized

  /phone-numbers/available:
    get:
      operationId: listAvailablePhoneNumbers
      tags: [phone-numbers]
      summary: Search available phone numbers from Vobiz
      parameters:
        - name: countryCode
          in: query
          required: true
          schema:
            type: string
            description: ISO 3166-1 alpha-2 country code (e.g. US, IN, GB)
        - name: numberType
          in: query
          schema:
            type: string
            enum: [local, toll_free, mobile]
            default: local
        - name: pattern
          in: query
          schema:
            type: string
            description: Optional digit pattern to search for
      responses:
        "200":
          description: List of available numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailablePhoneNumber"
        "401":
          description: Unauthorized

  /phone-numbers/purchase:
    post:
      operationId: purchasePhoneNumber
      tags: [phone-numbers]
      summary: Purchase a phone number ($5 deducted from wallet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasePhoneNumberInput"
      responses:
        "201":
          description: Phone number purchased and assigned to user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneNumber"
        "402":
          description: Insufficient balance
        "401":
          description: Unauthorized

  /phone-numbers/{id}/assign:
    patch:
      operationId: assignPhoneNumber
      tags: [phone-numbers]
      summary: Assign a phone number to an agent (or clear assignment)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPhoneNumberInput"
      responses:
        "200":
          description: Number assignment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneNumber"
        "401":
          description: Unauthorized
        "404":
          description: Phone number not found

  /phone-numbers/{id}:
    delete:
      operationId: releasePhoneNumber
      tags: [phone-numbers]
      summary: Release a phone number back to Vobiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Number released
        "401":
          description: Unauthorized
        "404":
          description: Phone number not found

  # ── Active Call Monitor ───────────────────────────────────────────────────
  /calls/active:
    get:
      operationId: listActiveCalls
      tags: [monitor]
      summary: List currently active (in-progress) calls for the authenticated user
      responses:
        "200":
          description: Active calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveCall"
        "401":
          description: Unauthorized

  # ── Per-Agent Analytics ───────────────────────────────────────────────────
  /analytics/agents/{id}:
    get:
      operationId: getAgentStats
      tags: [analytics]
      summary: Get detailed analytics for a single agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStats"
        "401":
          description: Unauthorized
        "404":
          description: Agent not found

  # ── Agent Templates ───────────────────────────────────────────────────────
  /agents/templates:
    get:
      operationId: listAgentTemplates
      tags: [agents]
      summary: List pre-built agent templates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTemplate"

  # ── Webhook Endpoints ─────────────────────────────────────────────────────
  /webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      tags: [webhook-endpoints]
      summary: List all webhook endpoints for the authenticated user
      responses:
        "200":
          description: List of webhook endpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          description: Unauthorized
    post:
      operationId: createWebhookEndpoint
      tags: [webhook-endpoints]
      summary: Create a new webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /webhook-endpoints/{id}:
    patch:
      operationId: updateWebhookEndpoint
      tags: [webhook-endpoints]
      summary: Update a webhook endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteWebhookEndpoint
      tags: [webhook-endpoints]
      summary: Delete a webhook endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ── Onboarding ───────────────────────────────────────────────────────────────
  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      tags: [onboarding]
      summary: Get the current user's onboarding status
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "401":
          description: Unauthorized

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Save onboarding answers and mark onboarding as completed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingData"
      responses:
        "200":
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "400":
          description: Invalid data
        "401":
          description: Unauthorized

  # ── Campaigns ────────────────────────────────────────────────────────────────
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List all campaigns for the current user
      responses:
        "200":
          description: Campaign list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        "401":
          description: Unauthorized
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a new campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a single campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /campaigns/{id}/leads:
    get:
      operationId: listCampaignLeads
      tags: [campaigns]
      summary: List leads for a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Lead list
          content:
            application/json:
              schema:
                type: object
                required: [leads, total]
                properties:
                  leads:
                    type: array
                    items:
                      $ref: "#/components/schemas/CampaignLead"
                  total:
                    type: integer
        "401":
          description: Unauthorized

  /campaigns/{id}/leads/{leadId}/retry:
    post:
      operationId: retryCampaignLead
      tags: [campaigns]
      summary: Retry a failed or skipped lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Retry queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignLead"
        "401":
          description: Unauthorized
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Agent Tool ──────────────────────────────────────────────────────────────
    DispositionField:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Snake-case field key (e.g. outcome, lead_score)
        label:
          type: string
          description: Human-readable label shown in the UI (e.g. "Call Outcome")
        type:
          type: string
          enum: [text, number, choice, boolean]
          description: Data type of the field
        options:
          type: array
          items:
            type: string
          description: Allowed values for choice fields (e.g. ["Interested","Not Interested"])
        required:
          type: boolean
          description: Whether this field must always be filled

    AgentTool:
      type: object
      required: [type, name, description, transferTo]
      properties:
        type:
          type: string
          enum: [call_transfer]
          description: Tool type — currently only call_transfer is supported
        name:
          type: string
          description: LLM-facing function name (snake_case, no spaces, e.g. transfer_to_human)
        description:
          type: string
          description: Explains to the LLM when and why to invoke this tool
        transferTo:
          type: string
          description: E.164 phone number to transfer the call to (e.g. +12125551234)
        warmHandoffMessage:
          type: string
          description: Optional message the agent speaks to the caller before transferring

    # ── Agent ──────────────────────────────────────────────────────────────────
    Agent:
      type: object
      required: [id, name, status, asrProvider, llmProvider, ttsProvider, telephonyProvider, systemPrompt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        agentType:
          type: ["string", "null"]
          enum: [general, lead_qualification, customer_support, appointment_booking, survey, null]
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, draft]
        asrProvider:
          type: string
          description: "ASR provider: deepgram, azure, whisper"
        asrModel:
          type: ["string", "null"]
        asrLanguage:
          type: ["string", "null"]
          description: Language code for the ASR provider (e.g. en, es, hi-IN)
        asrBackgroundDenoising:
          type: ["boolean", "null"]
          description: Filter background noise while the user is talking
        asrConfidenceThreshold:
          type: ["number", "null"]
          description: Transcripts below this confidence score (0–1) will be filtered out
        asrEndOfTurnConfidence:
          type: ["number", "null"]
          description: Confidence threshold (0.5–0.9) required to finish a turn (Deepgram)
        asrEndOfTurnTimeout:
          type: ["integer", "null"]
          description: Maximum time to wait (ms) after speech before finishing a turn
        asrKeyterms:
          type: ["string", "null"]
          description: Comma-separated keywords to boost transcription accuracy
        asrSmartEndpointing:
          type: ["string", "null"]
          enum: [off, vapi, livekit, null]
          description: Smart endpointing mode for more accurate speech endpoint detection
        asrAutoFallback:
          type: ["boolean", "null"]
          description: Automatically pick a backup STT provider if the primary fails
        llmProvider:
          type: string
          description: "LLM provider: openai, deepseek, anthropic, mistral, cohere"
        llmModel:
          type: ["string", "null"]
        ttsProvider:
          type: string
          description: "TTS provider: elevenlabs, openai, aws_polly, azure, cartesia, deepgram"
        ttsVoice:
          type: ["string", "null"]
        ttsModel:
          type: ["string", "null"]
        telephonyProvider:
          type: string
          description: "Telephony: twilio, plivo, vonage"
        systemPrompt:
          type: string
        temperature:
          type: ["number", "null"]
        maxDuration:
          type: ["integer", "null"]
          description: Max call duration in seconds
        greetingMessage:
          type: ["string", "null"]
          description: First thing the agent says when a call connects. If blank the LLM generates an opener.
        endCallPhrases:
          type: ["string", "null"]
          description: Comma-separated phrases that trigger hangup (e.g. "goodbye,bye,thanks for calling")
        silenceTimeoutSeconds:
          type: ["integer", "null"]
          description: Hang up automatically after this many seconds of caller silence
        language:
          type: ["string", "null"]
          description: Primary language code passed to ASR / TTS (e.g. en-US, es, fr, hi)
        backchannelingEnabled:
          type: ["boolean", "null"]
          description: Inject short acknowledgement phrases while the LLM is thinking
        backchannelingFrequency:
          type: ["number", "null"]
          description: Probability (0–1) of backchanneling on each turn
        webhookUrl:
          type: ["string", "null"]
          description: URL to POST a call summary JSON to when the call ends
        noiseCancellationEnabled:
          type: ["boolean", "null"]
          description: Request noise reduction from the ASR provider on every transcription call
        inactivityMessage:
          type: ["string", "null"]
          description: Message spoken to the caller before hanging up due to silence timeout
        knowledgeBaseId:
          type: ["integer", "null"]
          description: ID of an attached knowledge base for RAG context injection
        tools:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/AgentTool"
          description: List of tools (functions) the LLM can invoke during a call
        maxConcurrentCalls:
          type: ["integer", "null"]
          description: Per-agent concurrent call cap (null = use account limit)
        monthlySpendLimitCents:
          type: ["integer", "null"]
          description: Monthly spend cap in cents (null = no limit)
        dispositionSchema:
          type: ["array", "null"]
          description: User-defined fields to extract from each call via LLM
          items:
            $ref: "#/components/schemas/DispositionField"
        agentConfig:
          type: ["object", "null"]
          description: Advanced per-tab configuration (LLM params, engine, call, inbound, WhatsApp, analytics)
          additionalProperties: true
        totalCalls:
          type: integer
        successfulCalls:
          type: integer
        avgDurationSeconds:
          type: ["integer", "null"]
        avgSttLatencyMs:
          type: ["integer", "null"]
          description: Rolling average STT latency across all completed calls (ms)
        avgLlmLatencyMs:
          type: ["integer", "null"]
          description: Rolling average LLM first-token latency across all completed calls (ms)
        avgTtsFirstChunkMs:
          type: ["integer", "null"]
          description: Rolling average TTS first-audio-chunk latency across all completed calls (ms)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentInput:
      type: object
      required: [name, asrProvider, llmProvider, ttsProvider, telephonyProvider, systemPrompt]
      properties:
        name:
          type: string
          minLength: 1
        agentType:
          type: string
        description:
          type: string
        asrProvider:
          type: string
        asrModel:
          type: string
        asrLanguage:
          type: string
        asrBackgroundDenoising:
          type: boolean
        asrConfidenceThreshold:
          type: number
        asrEndOfTurnConfidence:
          type: number
        asrEndOfTurnTimeout:
          type: integer
        asrKeyterms:
          type: string
        asrSmartEndpointing:
          type: string
        asrAutoFallback:
          type: boolean
        llmProvider:
          type: string
        llmModel:
          type: string
        ttsProvider:
          type: string
        ttsVoice:
          type: string
        ttsModel:
          type: string
        telephonyProvider:
          type: string
        systemPrompt:
          type: string
        temperature:
          type: number
        maxDuration:
          type: integer
        greetingMessage:
          type: string
        endCallPhrases:
          type: string
        silenceTimeoutSeconds:
          type: integer
        language:
          type: string
        backchannelingEnabled:
          type: boolean
        backchannelingFrequency:
          type: number
        webhookUrl:
          type: string
        noiseCancellationEnabled:
          type: boolean
        inactivityMessage:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentTool"
          description: List of tools (functions) the LLM can invoke during a call
        agentConfig:
          type: object
          description: Advanced per-tab configuration
          additionalProperties: true

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
        agentType:
          type: string
        description:
          type: string
        asrProvider:
          type: string
        asrModel:
          type: string
        asrLanguage:
          type: string
        asrBackgroundDenoising:
          type: boolean
        asrConfidenceThreshold:
          type: number
        asrEndOfTurnConfidence:
          type: number
        asrEndOfTurnTimeout:
          type: integer
        asrKeyterms:
          type: string
        asrSmartEndpointing:
          type: string
        asrAutoFallback:
          type: boolean
        llmProvider:
          type: string
        llmModel:
          type: string
        ttsProvider:
          type: string
        ttsVoice:
          type: string
        ttsModel:
          type: string
        telephonyProvider:
          type: string
        systemPrompt:
          type: string
        temperature:
          type: number
        maxDuration:
          type: integer
        greetingMessage:
          type: string
        endCallPhrases:
          type: string
        silenceTimeoutSeconds:
          type: integer
        language:
          type: string
        backchannelingEnabled:
          type: boolean
        backchannelingFrequency:
          type: number
        webhookUrl:
          type: string
        noiseCancellationEnabled:
          type: boolean
        inactivityMessage:
          type: string
        knowledgeBaseId:
          type: integer
          description: ID of an attached knowledge base for RAG context injection
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentTool"
          description: List of tools (functions) the LLM can invoke during a call
        status:
          type: string
        maxConcurrentCalls:
          type: integer
        monthlySpendLimitCents:
          type: integer
        dispositionSchema:
          type: array
          items:
            $ref: "#/components/schemas/DispositionField"
        agentConfig:
          type: object
          description: Advanced per-tab configuration
          additionalProperties: true

    # ── Call ───────────────────────────────────────────────────────────────────
    Call:
      type: object
      required: [id, agentId, agentName, status, toNumber, fromNumber, createdAt]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        agentName:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed, cancelled, transferred]
        toNumber:
          type: string
        fromNumber:
          type: string
        durationSeconds:
          type: ["integer", "null"]
        transcript:
          type: ["string", "null"]
        recordingUrl:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        metadata:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        sttLatencyMs:
          type: ["integer", "null"]
          description: Average STT round-trip latency across all turns (ms)
        llmLatencyMs:
          type: ["integer", "null"]
          description: Average LLM time-to-first-token across all turns (ms)
        ttsFirstChunkMs:
          type: ["integer", "null"]
          description: Average TTS time-to-first-audio-chunk across all turns (ms)
        executionId:
          type: ["string", "null"]
          description: Unique execution identifier for this call (exec_xxxxxxxx)
        costCents:
          type: ["integer", "null"]
          description: Platform orchestration fee charged for this call in cents
        callSummary:
          type: ["string", "null"]
          description: AI-generated 3-line post-call summary
        dispositionResult:
          type: ["object", "null"]
          description: Extracted disposition values keyed by field name
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean

    CallEndPayload:
      type: object
      properties:
        sttLatencyMs:
          type: integer
          description: Average STT latency measured for this call (ms)
        llmLatencyMs:
          type: integer
          description: Average LLM first-token latency measured for this call (ms)
        ttsFirstChunkMs:
          type: integer
          description: Average TTS first-audio-chunk latency measured for this call (ms)

    CallInput:
      type: object
      required: [agentId, toNumber, fromNumber]
      properties:
        agentId:
          type: integer
        toNumber:
          type: string
        fromNumber:
          type: string
        metadata:
          type: string

    OutboundCallBody:
      type: object
      required: [agentId, toNumber]
      properties:
        agentId:
          type: integer
        toNumber:
          type: string
          description: "E.164 destination number (e.g. +1234567890)"
        webhookBaseUrl:
          type: string
          description: "Override public base URL for webhooks (auto-detected if omitted)"

    TransferCallBody:
      type: object
      required: [type, target]
      properties:
        type:
          type: string
          enum: [warm, cold]
          description: "warm = agent announces handoff before bridging; cold = immediate blind transfer"
        target:
          type: string
          description: "E.164 phone number (e.g. +15551234567) or SIP URI to transfer to"
        warmMessage:
          type: string
          description: "Optional message spoken to caller before the transfer (warm only)"
        webhookBaseUrl:
          type: string
          description: "Override public base URL for the transfer XML callback (auto-detected if omitted)"

    CallUpdate:
      type: object
      properties:
        status:
          type: string
        durationSeconds:
          type: integer
        transcript:
          type: string
        recordingUrl:
          type: string
        errorMessage:
          type: string
        endedAt:
          type: string
          format: date-time

    # ── Provider ───────────────────────────────────────────────────────────────
    ProviderConfig:
      type: object
      required: [id, providerType, providerName, isActive, createdAt]
      properties:
        id:
          type: integer
        providerType:
          type: string
          enum: [asr, llm, tts, telephony]
        providerName:
          type: string
        apiKeyHint:
          type: ["string", "null"]
          description: Last 4 chars of the API key (masked)
        isActive:
          type: boolean
        extraConfig:
          type: ["string", "null"]
          description: JSON string of extra config fields
        createdAt:
          type: string
          format: date-time

    ProviderInput:
      type: object
      required: [providerType, providerName, apiKey]
      properties:
        providerType:
          type: string
          enum: [asr, llm, tts, telephony]
        providerName:
          type: string
        apiKey:
          type: string
        extraConfig:
          type: string

    ProviderUpdate:
      type: object
      properties:
        apiKey:
          type: string
        isActive:
          type: boolean
        extraConfig:
          type: string

    # ── Account ────────────────────────────────────────────────────────────────
    AccountInfo:
      type: object
      required: [apiKey, orgKey, concurrentLimit, walletId]
      properties:
        apiKey:
          type: ["string", "null"]
          description: Secret API key for programmatic platform access (vok_ prefix)
        orgKey:
          type: ["string", "null"]
          description: Organisation-level key for webhook verification (voo_ prefix)
        concurrentLimit:
          type: integer
          description: Maximum simultaneous active calls allowed
        walletId:
          type: integer
          description: Internal wallet / user ID

    # ── Activity Log ───────────────────────────────────────────────────────────
    ActivityLog:
      type: object
      required: [id, eventType, description, createdAt]
      properties:
        id:
          type: integer
        eventType:
          type: string
          description: "e.g. agent.created, call.started, provider.added"
        resourceType:
          type: ["string", "null"]
        resourceId:
          type: ["string", "null"]
        description:
          type: string
        metadata:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── Analytics ──────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalAgents, activeAgents, totalCalls, callsToday, successRate, avgDurationSeconds]
      properties:
        totalAgents:
          type: integer
        activeAgents:
          type: integer
        totalCalls:
          type: integer
        callsToday:
          type: integer
        successRate:
          type: number
          description: Percentage of successful calls (0-100)
        avgDurationSeconds:
          type: integer
        callsThisWeek:
          type: integer
        totalProviders:
          type: integer

    CallStatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    DailyCallVolume:
      type: object
      required: [date, total, completed, failed]
      properties:
        date:
          type: string
        total:
          type: integer
        completed:
          type: integer
        failed:
          type: integer

    # ── Knowledge Base ──────────────────────────────────────────────────────────
    KnowledgeBase:
      type: object
      required: [id, name, embeddingModel, chunkSize, chunkOverlap, documentCount, chunkCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        embeddingModel:
          type: string
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
        documentCount:
          type: integer
        chunkCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KnowledgeBaseDetail:
      type: object
      required: [id, name, embeddingModel, chunkSize, chunkOverlap, documentCount, chunkCount, createdAt, updatedAt, documents]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        embeddingModel:
          type: string
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
        documentCount:
          type: integer
        chunkCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        documents:
          type: array
          items:
            $ref: "#/components/schemas/KbDocument"

    KnowledgeBaseInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        embeddingModel:
          type: string
          default: text-embedding-3-small
        chunkSize:
          type: integer
          default: 512
        chunkOverlap:
          type: integer
          default: 64

    KnowledgeBaseUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    KbDocument:
      type: object
      required: [id, knowledgeBaseId, name, sourceType, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        knowledgeBaseId:
          type: integer
        name:
          type: string
        sourceType:
          type: string
          enum: [text, url]
        sourceUrl:
          type: ["string", "null"]
        charCount:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, processing, ready, error]
        processingError:
          type: ["string", "null"]
        chunkCount:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KbDocumentInput:
      type: object
      required: [name, sourceType]
      properties:
        name:
          type: string
          minLength: 1
        sourceType:
          type: string
          enum: [text, url]
        content:
          type: string
          description: Raw text content (required when sourceType=text)
        sourceUrl:
          type: string
          description: URL to fetch and ingest (required when sourceType=url)

    KbQueryInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        topK:
          type: integer
          default: 5
          description: Number of chunks to return

    KbChunkResult:
      type: object
      required: [content, score, documentId, documentName, chunkIndex]
      properties:
        content:
          type: string
        score:
          type: number
          description: Relevance score (higher = more relevant)
        documentId:
          type: integer
        documentName:
          type: string
        chunkIndex:
          type: integer

    # ── Wallet ─────────────────────────────────────────────────────────────────
    WalletInfo:
      type: object
      required: [balanceCents, balanceUsd, freeCreditsGranted, autoPayEnabled, autoPayThresholdCents, autoPayAmountCents]
      properties:
        balanceCents:
          type: integer
          description: Current balance in cents
        balanceUsd:
          type: number
          description: Current balance in USD
        freeCreditsGranted:
          type: boolean
        autoPayEnabled:
          type: boolean
        autoPayThresholdCents:
          type: integer
        autoPayAmountCents:
          type: integer

    WalletTransaction:
      type: object
      required: [id, type, amountCents, amountUsd, description, status, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [free_credit, topup, call_debit, auto_topup]
        amountCents:
          type: integer
        amountUsd:
          type: number
        description:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        razorpayOrderId:
          type: ["string", "null"]
        razorpayPaymentId:
          type: ["string", "null"]
        callId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    TopupInput:
      type: object
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          minimum: 1000
          description: Amount in cents (minimum 1000 = $10)

    TopupOrder:
      type: object
      required: [orderId, amountCents, currency, keyId]
      properties:
        orderId:
          type: string
        amountCents:
          type: integer
        currency:
          type: string
        keyId:
          type: string

    VerifyPaymentInput:
      type: object
      required: [razorpayOrderId, razorpayPaymentId, razorpaySignature]
      properties:
        razorpayOrderId:
          type: string
        razorpayPaymentId:
          type: string
        razorpaySignature:
          type: string

    AutoPaySettings:
      type: object
      properties:
        autoPayEnabled:
          type: boolean
        autoPayThresholdCents:
          type: integer
          description: Trigger auto-pay when balance drops below this (cents)
        autoPayAmountCents:
          type: integer
          minimum: 1000
          description: Amount to auto-charge (cents, minimum 1000 = $10)

    # ── Phone Numbers ───────────────────────────────────────────────────────────
    PhoneNumber:
      type: object
      required: [id, userId, number, countryCode, numberType, status, purchasedAt, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        number:
          type: string
          description: E.164 phone number (e.g. +12125551234)
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 (e.g. US, IN)
        region:
          type: ["string", "null"]
        numberType:
          type: string
          enum: [local, toll_free, mobile]
        vobizNumberId:
          type: ["string", "null"]
        agentId:
          type: ["integer", "null"]
        agentName:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, released]
        purchasedAt:
          type: string
          format: date-time
        releasedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    AvailablePhoneNumber:
      type: object
      required: [number, countryCode, numberType]
      properties:
        number:
          type: string
          description: E.164 phone number
        countryCode:
          type: string
        region:
          type: ["string", "null"]
        numberType:
          type: string
          enum: [local, toll_free, mobile]
        monthlyRateCents:
          type: integer
          description: Monthly cost in cents (0 = one-time purchase only)

    PurchasePhoneNumberInput:
      type: object
      required: [number, countryCode]
      properties:
        number:
          type: string
          description: E.164 number to purchase (from the available list)
        countryCode:
          type: string
        region:
          type: string
        numberType:
          type: string
          enum: [local, toll_free, mobile]
          default: local

    AssignPhoneNumberInput:
      type: object
      properties:
        agentId:
          type: ["integer", "null"]
          description: Agent to route inbound calls to. Null to clear assignment.

    # ── Active Call Monitor ──────────────────────────────────────────────────
    ActiveCall:
      type: object
      required: [id, agentId, agentName, toNumber, fromNumber, status, createdAt, runningSeconds]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        agentName:
          type: string
        toNumber:
          type: string
        fromNumber:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        runningSeconds:
          type: integer
          description: Elapsed seconds since call started
        executionId:
          type: ["string", "null"]
        metadata:
          type: ["string", "null"]

    # ── Agent Stats ──────────────────────────────────────────────────────────
    AgentStats:
      type: object
      required: [agentId, name, totalCalls, successfulCalls, successRate, avgDurationSeconds, callsThisWeek, callsThisMonth, totalSpendCents]
      properties:
        agentId:
          type: integer
        name:
          type: string
        totalCalls:
          type: integer
        successfulCalls:
          type: integer
        failedCalls:
          type: integer
        successRate:
          type: number
          description: Percentage 0-100
        avgDurationSeconds:
          type: ["integer", "null"]
        avgSttLatencyMs:
          type: ["integer", "null"]
        avgLlmLatencyMs:
          type: ["integer", "null"]
        avgTtsFirstChunkMs:
          type: ["integer", "null"]
        callsThisWeek:
          type: integer
        callsThisMonth:
          type: integer
        totalSpendCents:
          type: integer
          description: Total platform fees charged for this agent's calls
        dailyVolume:
          type: array
          items:
            $ref: "#/components/schemas/DailyCallVolume"

    # ── Agent Template ───────────────────────────────────────────────────────
    AgentTemplate:
      type: object
      required: [id, name, description, category]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [support, sales, booking, survey, general]
        asrProvider:
          type: string
        llmProvider:
          type: string
        ttsProvider:
          type: string
        telephonyProvider:
          type: string
        systemPrompt:
          type: string
        greetingMessage:
          type: ["string", "null"]
        temperature:
          type: ["number", "null"]

    # ── Webhook Endpoints ────────────────────────────────────────────────────
    WebhookEndpoint:
      type: object
      required: [id, url, events, enabled, createdAt]
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [call.started, call.ended, call.failed]
          description: Event types that trigger this webhook
        secretHint:
          type: ["string", "null"]
          description: Last 6 chars of the signing secret (masked)
        enabled:
          type: boolean
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    WebhookEndpointInput:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [call.started, call.ended, call.failed]
          minItems: 1
        secret:
          type: string
          description: HMAC signing secret (auto-generated if omitted)
        description:
          type: string
        enabled:
          type: boolean
          default: true

    WebhookEndpointUpdate:
      type: object
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        secret:
          type: string
        description:
          type: string
        enabled:
          type: boolean

    OnboardingStatus:
      type: object
      required: [completed]
      properties:
        completed:
          type: boolean
        data:
          $ref: "#/components/schemas/OnboardingData"

    OnboardingData:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [student, professional]
        referralSource:
          type: string
          enum: [instagram, youtube, reference, google, ai_search]
        usedVoiceAgents:
          type: boolean
        priorPlatforms:
          type: array
          items:
            type: string
            enum: [vapi, retell, bolna, other]

    Campaign:
      type: object
      required: [id, name, status, webhookToken, fieldMappings, callDelaySeconds, maxAttempts, retryDelayMinutes, totalLeads, calledLeads, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        agentId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [draft, active, paused]
        webhookToken:
          type: string
        fieldMappings:
          type: object
          description: "Maps lead source field names to roles: phone (required), name, email, and any custom fields passed as prompt variables"
          additionalProperties:
            type: string
        fromNumber:
          type: string
          nullable: true
        callDelaySeconds:
          type: integer
        maxAttempts:
          type: integer
        retryDelayMinutes:
          type: integer
        totalLeads:
          type: integer
        calledLeads:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CampaignCreate:
      type: object
      required: [name, agentId, fieldMappings]
      properties:
        name:
          type: string
        description:
          type: string
        agentId:
          type: integer
        fieldMappings:
          type: object
          description: "Maps lead source field names to roles. Must include 'phone' key."
          additionalProperties:
            type: string
        fromNumber:
          type: string
        callDelaySeconds:
          type: integer
          default: 5
        maxAttempts:
          type: integer
          default: 1
        retryDelayMinutes:
          type: integer
          default: 60

    CampaignUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        agentId:
          type: integer
        status:
          type: string
          enum: [draft, active, paused]
        fieldMappings:
          type: object
          additionalProperties:
            type: string
          description: "Maps lead source field names to roles."
        fromNumber:
          type: string
        callDelaySeconds:
          type: integer
        maxAttempts:
          type: integer
        retryDelayMinutes:
          type: integer
        isActive:
          type: boolean

    CampaignLead:
      type: object
      required: [id, campaignId, phone, callStatus, callAttempts, source, createdAt]
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        phone:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        leadData:
          type: object
          additionalProperties:
            type: string
        callStatus:
          type: string
          enum: [pending, calling, completed, failed, skipped]
        callId:
          type: integer
          nullable: true
        callAttempts:
          type: integer
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
        externalLeadId:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
