        data:
          type: array
          items:
            $ref: "#/components/schemas/SnapServeExecution"

    # ── Call ───────────────────────────────────────────────────────────────────
    Call:
      type: object
      required: [id, agentId, agentName, status, toNumber, fromNumber, createdAt]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        agentName:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed, cancelled, transferred]
        toNumber:
          type: string
        fromNumber:
          type: string
        durationSeconds:
          type: ["integer", "null"]
        transcript:
          type: ["string", "null"]
        recordingUrl:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        metadata:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        sttLatencyMs:
          type: ["integer", "null"]
          description: Average STT round-trip latency across all turns (ms)
        llmLatencyMs:
          type: ["integer", "null"]
          description: Average LLM time-to-first-token across all turns (ms)
        ttsFirstChunkMs:
          type: ["integer", "null"]
          description: Average TTS time-to-first-audio-chunk across all turns (ms)
        executionId:
          type: ["string", "null"]
          description: Unique execution identifier for this call (exec_xxxxxxxx)
        costCents:
          type: ["integer", "null"]
          description: Platform orchestration fee charged for this call in cents
        callSummary:
          type: ["string", "null"]
          description: AI-generated 3-line post-call summary
        successEvaluation:
          type: ["string", "null"]
          description: "Post-call LLM evaluation — PASS or FAIL on first line, one-sentence reason on the second line"
        dispositionResult:
          type: ["object", "null"]
          description: Extracted disposition values keyed by field name
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        tokensSaved:
          type: ["integer", "null"]
          description: Estimated number of input tokens saved by token optimization (sliding window + summarization)

    CallEndPayload:
      type: object
      properties:
        sttLatencyMs:
          type: integer
          description: Average STT latency measured for this call (ms)
        llmLatencyMs:
          type: integer
          description: Average LLM first-token latency measured for this call (ms)
        ttsFirstChunkMs:
          type: integer
          description: Average TTS first-audio-chunk latency measured for this call (ms)
        tokensSaved:
          type: integer
          description: Estimated input tokens saved via context optimization this call

    CallInput:
      type: object
      required: [agentId, toNumber, fromNumber]
      properties:
        agentId:
          type: integer
        toNumber:
          type: string
        fromNumber:
          type: string
        metadata:
          type: string

    OutboundCallBody:
      type: object
      required: [agentId, toNumber]
      properties:
        agentId:
          type: integer
        toNumber:
          type: string
          description: "E.164 destination number (e.g. +1234567890)"
        webhookBaseUrl:
          type: string
          description: "Override public base URL for webhooks (auto-detected if omitted)"

    TransferCallBody:
      type: object
      required: [type, target]
      properties:
        type:
          type: string
          enum: [warm, cold]
          description: "warm = agent announces handoff before bridging; cold = immediate blind transfer"
        target:
          type: string
          description: "E.164 phone number (e.g. +15551234567) or SIP URI to transfer to"
        warmMessage:
          type: string
          description: "Optional message spoken to caller before the transfer (warm only)"
        webhookBaseUrl:
          type: string
          description: "Override public base URL for the transfer XML callback (auto-detected if omitted)"

    CallUpdate:
      type: object
      properties:
        status:
          type: string
        durationSeconds:
          type: integer
        transcript:
          type: string
        recordingUrl:
          type: string
        errorMessage:
          type: string
        endedAt:
          type: string
          format: date-time

    # ── Provider ───────────────────────────────────────────────────────────────
    ProviderConfig:
      type: object
      required: [id, providerType, providerName, isActive, createdAt]
      properties:
        id:
          type: integer
        providerType:
          type: string
          enum: [orchestration, asr, llm, tts, telephony]
        providerName:
          type: string
        apiKeyHint:
          type: ["string", "null"]
          description: Last 4 chars of the API key (masked)
        isActive:
          type: boolean
        extraConfig:
          type: ["string", "null"]
          description: JSON string of extra config fields
        createdAt:
          type: string
          format: date-time

    ProviderInput:
      type: object
      required: [providerType, providerName, apiKey]
      properties:
        providerType:
          type: string
          enum: [orchestration, asr, llm, tts, telephony]
        providerName:
          type: string
          minLength: 1
          pattern: '\S'
        apiKey:
          type: string
        extraConfig:
          type: string

    ProviderUpdate:
      type: object
      properties:
        apiKey:
          type: string
        isActive:
          type: boolean
        extraConfig:
          type: string

    # ── Account ────────────────────────────────────────────────────────────────
    AccountInfo:
      type: object
      required: [apiKey, orgKey, concurrentLimit, walletId]
      properties:
        apiKey:
          type: ["string", "null"]
          description: Secret API key for programmatic platform access (vok_ prefix)
        orgKey:
          type: ["string", "null"]
          description: Organisation-level key for webhook verification (voo_ prefix)
        concurrentLimit:
          type: integer
          description: Maximum simultaneous active calls allowed
        walletId:
          type: integer
          description: Internal wallet / user ID

    UserPreferences:
      type: object
      required: [theme]
      properties:
        theme:
          type: ["string", "null"]
          enum: ["light", "dark", "system", null]
          description: Dashboard colour scheme preference

    UserPreferencesUpdate:
      type: object
      properties:
        theme:
          type: string
          enum: ["light", "dark", "system"]
          description: Dashboard colour scheme preference

    # ── Activity Log ───────────────────────────────────────────────────────────
    ActivityLog:
      type: object
      required: [id, eventType, description, createdAt]
      properties:
        id:
          type: integer
        eventType:
          type: string
          description: "e.g. agent.created, call.started, provider.added"
        resourceType:
          type: ["string", "null"]
        resourceId:
          type: ["string", "null"]
        description:
          type: string
        metadata:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── Analytics ──────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalAgents, activeAgents, totalCalls, callsToday, successRate, avgDurationSeconds]
      properties:
        totalAgents:
          type: integer
        activeAgents:
          type: integer
        totalCalls:
          type: integer
        callsToday:
          type: integer
        successRate:
          type: number
          description: Percentage of successful calls (0-100)
        avgDurationSeconds:
          type: integer
        callsThisWeek:
          type: integer
        totalProviders:
          type: integer

    CallStatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    DailyCallVolume:
      type: object
      required: [date, total, completed, failed]
      properties:
        date:
          type: string
        total:
          type: integer
        completed:
          type: integer
        failed:
          type: integer

    # ── Knowledge Base ──────────────────────────────────────────────────────────
    KnowledgeSource:
      type: object
      required: [id, name, type, status, entryCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [faq, text, website, file]
        status:
          type: string
          enum: [active, processing, error]
        entryCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KnowledgeSourceDetail:
      type: object
      required: [id, name, type, status, entryCount, createdAt, updatedAt, entries]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [faq, text, website, file]
        status:
          type: string
          enum: [active, processing, error]
        entryCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeEntry"

    KnowledgeSourceInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [faq, text, website, file]
        url:
          type: string
          description: URL to crawl (required when type=website)
        entries:
          type: array
          description: Initial entries to create
          items:
            $ref: "#/components/schemas/KnowledgeEntryInput"

    KnowledgeSourceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1

    KnowledgeEntry:
      type: object
      required: [id, sourceId, content, createdAt]
      properties:
        id:
          type: integer
        sourceId:
          type: integer
        title:
          type: ["string", "null"]
        content:
          type: string
        keywords:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    KnowledgeEntryInput:
      type: object
      required: [content]
      properties:
        title:
          type: string
        content:
          type: string
          minLength: 1
        keywords:
          type: string

    KnowledgeSearchInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          default: 5

    KnowledgeSearchResponse:
      type: object
      required: [answer, matchedEntries]
      properties:
        answer:
          type: string
          description: LLM-generated answer based on matched entries
        matchedEntries:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSearchResult"

    KnowledgeSearchResult:
      type: object
      required: [entry, rank]
      properties:
        entry:
          $ref: "#/components/schemas/KnowledgeEntry"
        rank:
          type: number
          description: FTS relevance rank (higher = more relevant)
        snippet:
          type: ["string", "null"]

    # ── Wallet ─────────────────────────────────────────────────────────────────
    WalletInfo:
      type: object
      required: [balanceCents, balanceUsd, freeCreditsGranted, autoPayEnabled, autoPayThresholdCents, autoPayAmountCents, mandateActive]
      properties:
        balanceCents:
          type: integer
          description: Current balance in cents
        balanceUsd:
          type: number
          description: Current balance in USD
        freeCreditsGranted:
          type: boolean
        autoPayEnabled:
          type: boolean
        autoPayThresholdCents:
          type: integer
        autoPayAmountCents:
          type: integer
        mandateActive:
          type: boolean
          description: Whether a Razorpay recurring mandate token is saved for auto-pay

    WalletTransaction:
      type: object
      required: [id, type, amountCents, amountUsd, description, status, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [free_credit, topup, call_debit, auto_topup]
        amountCents:
          type: integer
        amountUsd:
          type: number
        description:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        razorpayOrderId:
          type: ["string", "null"]
        razorpayPaymentId:
          type: ["string", "null"]
        callId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    TopupInput:
      type: object
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          minimum: 1000
          description: Amount in cents (minimum 1000 = $10)
        setupMandate:
          type: boolean
          description: When true, creates a recurring mandate order (user authorizes auto-pay once)

    TopupOrder:
      type: object
      required: [orderId, amountCents, amountPaise, currency, keyId]
      properties:
        orderId:
          type: string
        amountCents:
          type: integer
          description: Amount in USD cents (used for wallet credit)
        amountPaise:
          type: integer
          description: Amount in INR paise (used for Razorpay checkout)
        currency:
          type: string
          description: Always INR
        keyId:
          type: string
        customerId:
          type: ["string", "null"]
          description: Razorpay customer ID (present when setupMandate=true)

    VerifyPaymentInput:
      type: object
      required: [razorpayOrderId, razorpayPaymentId, razorpaySignature]
      properties:
        razorpayOrderId:
          type: string
        razorpayPaymentId:
          type: string
        razorpaySignature:
          type: string

    AutoPaySettings:
      type: object
      properties:
        autoPayEnabled:
          type: boolean
        autoPayThresholdCents:
          type: integer
          description: Trigger auto-pay when balance drops below this (cents)
        autoPayAmountCents:
          type: integer
          minimum: 1000
          description: Amount to auto-charge (cents, minimum 1000 = $10)

    # ── Phone Numbers ───────────────────────────────────────────────────────────
    PhoneNumber:
      type: object
      required: [id, userId, number, countryCode, numberType, status, purchasedAt, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        number:
          type: string
          description: E.164 phone number (e.g. +12125551234)
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 (e.g. US, IN)
        region:
          type: ["string", "null"]
        numberType:
          type: string
          enum: [local, toll_free, mobile]
        vobizNumberId:
          type: ["string", "null"]
        agentId:
          type: ["integer", "null"]
        agentName:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, released]
        purchasedAt:
          type: string
          format: date-time
        monthlyRateCents:
          type: integer
          description: Monthly cost in cents (from Vobiz, 0 = no recurring fee)
        releasedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    AvailablePhoneNumber:
      type: object
      required: [number, countryCode, numberType]
      properties:
        number:
          type: string
          description: E.164 phone number
        countryCode:
          type: string
        region:
          type: ["string", "null"]
        numberType:
          type: string
          enum: [local, toll_free, mobile]
        monthlyRateCents:
          type: integer
          description: Monthly cost in cents (0 = one-time purchase only)

    PurchasePhoneNumberInput:
      type: object
      required: [number, countryCode]
      properties:
        number:
          type: string
          description: E.164 number to purchase (from the available list)
        countryCode:
          type: string
