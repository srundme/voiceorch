                $ref: '#/components/schemas/GlobalSearchResponse'

  # ── Pendrive ─────────────────────────────────────────────────────────────────
  /pendrive/api-keys:
    get:
      operationId: listPendriveApiKeys
      tags: [pendrive]
      summary: List all Pendrive API keys for the current user
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendriveApiKey' }
    post:
      operationId: createPendriveApiKey
      tags: [pendrive]
      summary: Create a new Pendrive API key
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PendriveApiKeyInput' }
      responses:
        "201":
          description: Created API key (plaintext shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendriveApiKeyCreated' }

  /pendrive/api-keys/{id}:
    delete:
      operationId: deletePendriveApiKey
      tags: [pendrive]
      summary: Revoke a Pendrive API key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Revoked

  /pendrive/stats:
    get:
      operationId: getPendriveStats
      tags: [pendrive]
      summary: Usage stats for Pendrive dashboard
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendriveStats' }

  /pendrive/callers:
    get:
      operationId: listPendriveCallers
      tags: [pendrive]
      summary: List all callers with memory stored for this user
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paged caller list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendriveCallerList' }

  /pendrive/context:
    get:
      operationId: getPendriveContext
      tags: [pendrive]
      summary: Retrieve full caller memory context (for injection into LLM prompts)
      parameters:
        - name: agentId
          in: query
          required: true
          schema: { type: integer }
        - name: phoneNumber
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Caller context with memory block
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendriveContextResult' }

  /pendrive/archive:
    post:
      operationId: pendriveArchive
      tags: [pendrive]
      summary: Archive a call transcript and extract structured facts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PendriveArchiveInput' }
      responses:
        "200":
          description: Archive result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendriveArchiveResult' }

  # ── Simulation ─────────────────────────────────────────────────────────────────
  /simulation/runs/chat:
    post:
      operationId: startSimulationChat
      tags: [simulation]
      summary: Start or continue a manual chat turn (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, message]
              properties:
                agent_id: { type: integer }
                run_id: { type: ["integer", "null"] }
                message: { type: string }
      responses:
        "200":
          description: SSE stream of agent_token, debug_info, done events
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          description: Validation error
        "404":
          description: Agent not found

  /simulation/runs/stream:
    post:
      operationId: startScenarioStream
      tags: [simulation]
      summary: Start a scenario simulation run and stream progress via SSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [test_case_id]
              properties:
                test_case_id: { type: integer }
                max_turns: { type: integer, default: 20 }
      responses:
        "200":
          description: SSE stream of scenario events
          content:
            text/event-stream:
              schema: { type: string }

  /simulation/test-cases:
    get:
      operationId: listSimulationTestCases
      tags: [simulation]
      summary: List test cases for an agent
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of test cases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SimulationTestCase" }
    post:
      operationId: createSimulationTestCase
      tags: [simulation]
      summary: Create a test case
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationTestCaseInput" }
      responses:
        "201":
          description: Created test case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationTestCase" }

  /simulation/test-cases/{id}:
    delete:
      operationId: deleteSimulationTestCase
      tags: [simulation]
      summary: Delete a test case
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /simulation/runs:
    get:
      operationId: listSimulationRuns
      tags: [simulation]
      summary: List simulation runs for an agent
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SimulationRun" }
    post:
      operationId: createSimulationRun
      tags: [simulation]
      summary: Start a scenario simulation run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [test_case_id]
              properties:
                test_case_id: { type: integer }
                max_turns: { type: integer, default: 20 }
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationRun" }

  /simulation/runs/{id}:
    get:
      operationId: getSimulationRun
      tags: [simulation]
      summary: Get run status and messages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Run details with messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationRunDetail" }
        "404":
          description: Not found

  /simulation/runs/{id}/report:
    get:
      operationId: downloadSimulationReport
      tags: [simulation]
      summary: Download run report as JSON
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: JSON report
          content:
            application/json:
              schema: { type: object }

  /simulation/templates:
    get:
      operationId: listSimulationTemplates
      tags: [simulation]
      summary: List built-in persona templates
      responses:
        "200":
          description: List of persona templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SimulationTemplate" }

  # ── Webcall ticket ────────────────────────────────────────────────────────
  /webcall/ticket:
    post:
      operationId: createWebcallTicket
      tags: [webcall]
      summary: Issue a short-lived single-use ticket for a webcall WebSocket upgrade
      description: >
        Returns a 64-hex-char token valid for 60 seconds and usable exactly once.
        The frontend passes it as ?ticket= on the WS URL so the session JWT never
        appears in server access logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId:
                  type: integer
      responses:
        "200":
          description: Short-lived ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket:
                    type: string
                    description: 64-hex-char single-use token, valid for 60 s
        "401":
          description: No valid session
        "403":
          description: Agent not found or not owned by the authenticated user

components:
  parameters:
    AdminToken:
      name: X-Admin-Token
      in: header
      required: true
      schema: { type: string }
      description: Platform admin token (matches ADMIN_TOKEN env var).
  schemas:
    PromptTemplate:
      type: object
      required: [id, version, isActive, filename, mimeType, sizeBytes, createdAt]
      properties:
        id: { type: integer }
        version: { type: integer }
        isActive: { type: boolean }
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        text:
          type: string
          description: Extracted template text (omitted from list responses)
        uploadedBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    AdminAgentSummary:
      type: object
      required: [id, name, status, hasGeneratedPrompt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        userId: { type: ["integer", "null"] }
        name: { type: string }
        status: { type: string }
        agentMode: { type: ["string", "null"] }
        agentType: { type: ["string", "null"] }
        hasGeneratedPrompt: { type: boolean }
        promptTemplateVersion: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminAgentPrompt:
      type: object
      required: [agentId, generatedPrompt, promptTemplateVersion]
      properties:
        agentId: { type: integer }
        generatedPrompt: { type: ["string", "null"] }
        promptTemplateVersion: { type: ["integer", "null"] }
        wizardInputs:
          type: ["object", "null"]
          additionalProperties: true

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Agent Tool ──────────────────────────────────────────────────────────────
    DispositionField:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Snake-case field key (e.g. outcome, lead_score)
        label:
          type: string
          description: Human-readable label shown in the UI (e.g. "Call Outcome")
        type:
          type: string
          enum: [text, number, choice, boolean]
          description: Data type of the field
        options:
          type: array
          items:
            type: string
          description: Allowed values for choice fields (e.g. ["Interested","Not Interested"])
        required:
          type: boolean
          description: Whether this field must always be filled

    AgentTool:
      type: object
      required: [type, name, description]
      properties:
        type:
          type: string
          enum: [call_transfer, webhook, send_sms, end_call, cal_com, native_booking, native_reschedule, native_cancel, native_check_availability, native_list_bookings, transfer_cold, transfer_warm, transfer_agent]
          description: "Tool type: call_transfer, webhook, send_sms, end_call, cal_com, native_booking, native_reschedule, native_cancel, native_check_availability, native_list_bookings, transfer_cold, transfer_warm, or transfer_agent"
        name:
          type: string
          description: LLM-facing function name (snake_case, no spaces, e.g. transfer_to_human)
        description:
          type: string
          description: Explains to the LLM when and why to invoke this tool
        transferTo:
          type: string
          description: (call_transfer) E.164 phone number to transfer the call to (e.g. +12125551234)
        warmHandoffMessage:
          type: string
          description: (call_transfer) Optional message the agent speaks to the caller before transferring
        transferMode:
          type: string
          enum: [cold, warm_summary]
          description: "(call_transfer) cold = immediate blind transfer (default); warm_summary = dials operator, speaks AI-generated summary when they answer, then bridges customer"
        summaryPrompt:
          type: string
          description: (call_transfer) LLM prompt used to generate the operator briefing in warm_summary mode; a sensible default is used if omitted
        url:
          type: string
          description: (webhook) HTTP endpoint URL to POST/GET when this tool is invoked
        method:
          type: string
          enum: [GET, POST]
          description: (webhook) HTTP method
        headers:
          type: object
          additionalProperties:
            type: string
          description: (webhook) Optional extra HTTP headers
        secret:
          type: string
          description: (webhook) Optional secret sent as X-Webhook-Secret header
        messageTemplate:
          type: string
          description: (send_sms) SMS body to send to the caller — supports plain text
        goodbyeMessage:
          type: string
          description: (end_call) Optional message spoken to the caller before hanging up
        apiKey:
          type: string
          description: (cal_com) Cal.com API key
        eventTypeId:
          type: integer
          description: (cal_com / native_booking / native_reschedule / native_check_availability / native_cancel / native_list_bookings) Event type ID; for native_reschedule this is the target event type the rescheduled booking will be placed into
        calendarId:
          type: integer
          description: (native_booking / native_reschedule / native_check_availability / native_cancel / native_list_bookings) Calendar the event type belongs to — UI hint for cascading selects; for native_reschedule this is the target calendar
        timezone:
          type: string
          description: (cal_com / send_sms / native_booking / native_reschedule / native_check_availability / native_cancel / native_list_bookings) Default timezone for bookings (e.g. America/New_York)
        taskName:
          type: string
          description: (native_booking) Friendly task name shown in the agent UI; mirrors `name` by default
        preToolMessage:
          type: string
          description: (native_booking) Optional sentence the agent should say just before invoking the booking tool
        targetNumber:
          type: string
          description: (transfer_cold / transfer_warm) E.164 phone number to transfer the call to (e.g. +12125551234)
        holdMessage:
          type: string
          description: (transfer_cold / transfer_warm) Optional message spoken to the caller before the transfer is initiated
        targetAgentId:
          type: integer
          description: (transfer_agent) ID of the specialist agent to transfer the call to

    # ── Agent ──────────────────────────────────────────────────────────────────
    TestToolBody:
      type: object
      required: [agentId, toolName, args]
      properties:
        agentId:
          type: integer
        toolName:
          type: string
        args:
          type: object
          additionalProperties: true

    TestToolResponse:
      type: object
      required: [result]
      properties:
        result:
          type: string

    AmbientSoundRecord:
      type: object
      required: [id, name, mimeType, fileSize, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        mimeType: { type: string }
        fileSize: { type: integer }
        durationSeconds: { type: ["number", "null"] }
        createdAt: { type: string, format: date-time }

    AmbientSoundOption:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    AgentVersionsListResponse:
      type: object
      required: [versions, publishedCount, limit]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/AgentVersion"
        publishedCount:
          type: integer
          description: "Number of non-archived published/production versions"
        limit:
          type: integer
          description: "Maximum allowed published versions (hardcoded to 10)"

    AgentVersion:
      type: object
      required: [id, agentId, userId, versionNumber, versionName, commitDescription, status, snapshot, createdAt, updatedAt]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        userId:
          type: string
        versionNumber:
          type: string
          description: "Auto-assigned version label, e.g. v1, v2, v3"
        versionName:
          type: string
        commitDescription:
          type: string
        releaseNotes:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, published, production, archived, restored, deprecated]
        snapshot:
          type: object
          description: "Full copy of all agent columns at publish time"
          additionalProperties: true
        changedFields:
          type: ["array", "null"]
          items:
            type: string
          description: "Auto-detected list of changed field labels vs. previous production snapshot"
        publishedBy:
          type: ["string", "null"]
        restoredFromVersionId:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    PublishAgentVersionBody:
      type: object
      required: [versionName, commitDescription]
      properties:
        versionName:
          type: string
          minLength: 1
          maxLength: 120
        commitDescription:
          type: string
          minLength: 1
          maxLength: 500
        releaseNotes:
          type: string
          maxLength: 2000

    Agent:
      type: object
      required: [id, name, status, asrProvider, llmProvider, ttsProvider, telephonyProvider, systemPrompt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        agentMode:
          type: ["string", "null"]
          enum: [managed, byop, null]
          description: "managed = platform master keys; byop = user-supplied keys"
        agentType:
          type: ["string", "null"]
          enum: [general, lead_qualification, customer_support, appointment_booking, survey, null]
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, draft]
        asrProvider:
          type: string
          description: "ASR provider: deepgram, azure, whisper"
        asrModel:
          type: ["string", "null"]
        asrLanguage:
          type: ["string", "null"]
          description: Language code for the ASR provider (e.g. en, es, hi-IN)
        asrBackgroundDenoising:
          type: ["boolean", "null"]
          description: Filter background noise while the user is talking
        asrConfidenceThreshold:
          type: ["number", "null"]
          description: Transcripts below this confidence score (0–1) will be filtered out
        asrEndOfTurnConfidence:
          type: ["number", "null"]
          description: Confidence threshold (0.5–0.9) required to finish a turn (Deepgram)
        asrEndOfTurnTimeout:
          type: ["integer", "null"]
          description: Maximum time to wait (ms) after speech before finishing a turn
        asrKeyterms:
          type: ["string", "null"]
          description: Comma-separated keywords to boost transcription accuracy
        asrSmartEndpointing:
          type: ["string", "null"]
          enum: [off, vapi, livekit, null]
          description: Smart endpointing mode for more accurate speech endpoint detection
        asrAutoFallback:
          type: ["boolean", "null"]
          description: Automatically pick a backup STT provider if the primary fails
        asrFallbackProviders:
          type: ["array", "null"]
          description: Ordered list of backup STT providers tried when the primary fails
          items:
            type: object
            properties:
              provider:
                type: string
              model:
                type: ["string", "null"]
        llmProvider:
          type: string
          description: "LLM provider: openai, deepseek, anthropic, mistral, cohere, qwen"
        llmModel:
          type: ["string", "null"]
        ttsProvider:
          type: string
          description: "TTS provider: elevenlabs, openai, aws_polly, azure, cartesia, deepgram"
        ttsVoice:
          type: ["string", "null"]
        ttsModel:
          type: ["string", "null"]
        telephonyProvider:
          type: string
          description: "Telephony: twilio, plivo, vonage"
        systemPrompt:
          type: string
        temperature:
          type: ["number", "null"]
        maxDuration:
          type: ["integer", "null"]
          description: Max call duration in seconds
        greetingMessage:
          type: ["string", "null"]
          description: First thing the agent says when a call connects. If blank the LLM generates an opener.
        firstSpeaker:
          type: ["string", "null"]
          enum: [assistant, user, null]
          description: Who speaks first when a call connects. "assistant" plays the greeting (or LLM opener); "user" keeps the agent silent until the caller speaks.
        endCallPhrases:
          type: ["string", "null"]
          description: Comma-separated phrases that trigger hangup (e.g. "goodbye,bye,thanks for calling")
        silenceTimeoutSeconds:
          type: ["integer", "null"]
          description: Hang up automatically after this many seconds of caller silence
        language:
          type: ["string", "null"]
          description: Primary language code passed to ASR / TTS (e.g. en-US, es, fr, hi)
        backchannelingEnabled:
          type: ["boolean", "null"]
          description: Inject short acknowledgement phrases while the LLM is thinking
        backchannelingFrequency:
          type: ["number", "null"]
          description: Probability (0–1) of backchanneling on each turn
        backchannelPhrases:
          type: ["string", "null"]
          description: Comma-separated custom backchannel phrases (e.g. "சரி,ஆமாம்,புரிகிறது"). Leave blank to use the built-in English defaults.
        webhookUrl:
          type: ["string", "null"]
          description: URL to POST a call summary JSON to when the call ends
        noiseCancellationEnabled:
          type: ["boolean", "null"]
          description: Request noise reduction from the ASR provider on every transcription call
        inactivityMessage:
          type: ["string", "null"]
          description: Message spoken to the caller before hanging up due to silence timeout
        knowledgeBaseId:
          type: ["integer", "null"]
          description: ID of an attached knowledge base for RAG context injection
        knowledgeSourceIds:
          type: array
          items:
            type: integer
          description: IDs of all attached knowledge sources (many-to-many)
        tools:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/AgentTool"
          description: List of tools (functions) the LLM can invoke during a call
        maxConcurrentCalls:
          type: ["integer", "null"]
          description: Per-agent concurrent call cap (null = use account limit)
        monthlySpendLimitCents:
          type: ["integer", "null"]
          description: Monthly spend cap in cents (null = no limit)
        dispositionSchema:
          type: ["array", "null"]
          description: User-defined fields to extract from each call via LLM
          items:
            $ref: "#/components/schemas/DispositionField"
        agentConfig:
          type: ["object", "null"]
          description: Advanced per-tab configuration (LLM params, engine, call, inbound, WhatsApp, analytics)
          additionalProperties: true
        leadSourceType:
          type: ["string", "null"]
          description: "Lead source platform (e.g. instagram)"
        leadSourceToken:
          type: ["string", "null"]
          description: "Masked hint of the lead source access token (last 4 chars)"
        leadFields:
          type: ["array", "null"]
          description: "Lead fields to capture per incoming lead (name, email, message)"
          items:
            type: string
        productDetails:
          type: ["string", "null"]
          description: "Product or service details the agent should know when calling leads"
        snapserveAgentId:
          type: ["string", "null"]
          description: "SnapServe platform agent ID used to fetch executions from the SnapServe API"
        contextWindowTurns:
          type: ["integer", "null"]
          description: "Sliding-window context: only the last N turns are sent to the LLM (null = unlimited)"
        tokenSummarizationEnabled:
          type: ["boolean", "null"]
          description: "Auto-compress old turns into a summary block when history exceeds threshold"
        tokenSummarizationThresholdTurns:
          type: ["integer", "null"]
          description: "Number of turns after which summarization is triggered"
        stagedPromptEnabled:
          type: ["boolean", "null"]
          description: "Send only the active stage block + core identity instead of the full system prompt"
        stagedPromptStages:
          type: ["array", "null"]
          description: "Named prompt stages (each with name + content)"
          items:
            type: object
            properties:
              name:
                type: string
              content:
                type: string
        stagedPromptCoreIdentity:
          type: ["string", "null"]
          description: "Core identity block always included in staged-prompt mode"
        inboundPhoneNumberId:
          type: ["integer", "null"]
          description: "Phone number ID assigned for inbound routing to this agent"
        outboundPhoneNumberId:
          type: ["integer", "null"]
          description: "Phone number ID used as caller ID for outbound calls from this agent"
        totalCalls:
          type: integer
        successfulCalls:
          type: integer
        avgDurationSeconds:
          type: ["integer", "null"]
        avgSttLatencyMs:
          type: ["integer", "null"]
          description: Rolling average STT latency across all completed calls (ms)
        avgLlmLatencyMs:
          type: ["integer", "null"]
          description: Rolling average LLM first-token latency across all completed calls (ms)
        avgTtsFirstChunkMs:
          type: ["integer", "null"]
          description: Rolling average TTS first-audio-chunk latency across all completed calls (ms)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentInput:
      type: object
      required: [name, asrProvider, llmProvider, ttsProvider, telephonyProvider, systemPrompt]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
        agentMode:
          type: string
          enum: [managed, byop]
          description: "managed = use platform master keys; byop = user supplies their own provider keys"
        agentType:
          type: string
        description:
          type: string
        asrProvider:
