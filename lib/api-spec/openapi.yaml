openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VoiceOrch - AI Voice Agent Orchestration Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agents
    description: Voice agent management
  - name: calls
    description: Call management
  - name: providers
    description: Provider key management
  - name: analytics
    description: Dashboard analytics
  - name: knowledge-base
    description: Knowledge base and RAG document management
  - name: wallet
    description: Wallet balance, top-up, and billing
  - name: account
    description: API keys, org key, and concurrent call limits
  - name: activity-logs
    description: Audit log of all platform events
  - name: phone-numbers
    description: Managed phone number provisioning (platform Vobiz account)
  - name: kyc
    description: KYC (Know Your Customer) identity verification via Vobiz
  - name: webhook-endpoints
    description: User-configured webhook endpoints for call event delivery
  - name: monitor
    description: Real-time active call monitoring
  - name: onboarding
    description: User onboarding flow
  - name: campaigns
    description: Auto-call campaign management
  - name: scheduling
    description: Native appointment scheduling engine
  - name: admin-usage
    description: Admin platform-wide STT/LLM/TTS usage monitoring

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Agents ──────────────────────────────────────────────────────────────────
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: Validation error

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get a single agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /agents/{id}/toggle:
    patch:
      operationId: toggleAgent
      tags: [agents]
      summary: Toggle agent active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found

  # ── Calls ───────────────────────────────────────────────────────────────────
  /calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: List calls with optional agent filter
      parameters:
        - name: agentId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
    post:
      operationId: initiateCall
      tags: [calls]
      summary: Initiate a new call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallInput"
      responses:
        "201":
          description: Call initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Validation error

  /calls/{id}:
    get:
      operationId: getCall
      tags: [calls]
      summary: Get call details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Call details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found
    patch:
      operationId: updateCall
      tags: [calls]
      summary: Update call record (status, transcript, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallUpdate"
      responses:
        "200":
          description: Updated call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  /calls/outbound:
    post:
      operationId: initiateOutboundCall
      tags: [calls]
      summary: Initiate an outbound phone call via the agent's telephony provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundCallBody"
      responses:
        "201":
          description: Outbound call initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Validation error or provider misconfiguration
        "404":
          description: Agent or telephony provider not found

  /calls/{id}/transfer:
    post:
      operationId: transferCall
      tags: [calls]
      summary: Transfer an active call to another number or SIP URI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCallBody"
      responses:
        "200":
          description: Transfer initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Validation error or provider misconfiguration
        "404":
          description: Call not found
        "409":
          description: Call is not active or already transferred

  /calls/{id}/end:
    patch:
      operationId: endCall
      tags: [calls]
      summary: End an active call
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallEndPayload"
      responses:
        "200":
          description: Call ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  /calls/{id}/disposition:
    patch:
      operationId: updateCallDisposition
      tags: [calls]
      summary: Manually set or override disposition fields for a call
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dispositionResult:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
      responses:
        "200":
          description: Disposition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  # ── Provider Keys ────────────────────────────────────────────────────────────
  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List configured provider keys
      responses:
        "200":
          description: List of provider configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderConfig"
    post:
      operationId: createProvider
      tags: [providers]
      summary: Add a provider key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Provider config created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
        "400":
          description: Validation error

  /providers/{id}:
    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
        "404":
          description: Not found
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Analytics (wow endpoints) ────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getDashboardStats
      tags: [analytics]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /analytics/calls/recent:
    get:
      operationId: getRecentCalls
      tags: [analytics]
      summary: Get recent call activity feed (last 20)
      responses:
        "200":
          description: Recent calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"

  /analytics/calls/by-status:
    get:
      operationId: getCallsByStatus
      tags: [analytics]
      summary: Get call counts grouped by status
      responses:
        "200":
          description: Calls by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallStatusCount"

  /analytics/calls/daily:
    get:
      operationId: getDailyCallVolume
      tags: [analytics]
      summary: Get daily call volume for the last 7 days
      responses:
        "200":
          description: Daily call volume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyCallVolume"

  # ── Knowledge Bases ─────────────────────────────────────────────────────────
  /knowledge-bases:
    get:
      operationId: listKnowledgeBases
      tags: [knowledge-base]
      summary: List all knowledge bases
      responses:
        "200":
          description: List of knowledge bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
    post:
      operationId: createKnowledgeBase
      tags: [knowledge-base]
      summary: Create a new knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseInput"
      responses:
        "201":
          description: Created knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          description: Validation error

  /knowledge-bases/{id}:
    get:
      operationId: getKnowledgeBase
      tags: [knowledge-base]
      summary: Get a knowledge base with its documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Knowledge base with documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDetail"
        "404":
          description: Not found
    patch:
      operationId: updateKnowledgeBase
      tags: [knowledge-base]
      summary: Update a knowledge base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseUpdate"
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "404":
          description: Not found
    delete:
      operationId: deleteKnowledgeBase
      tags: [knowledge-base]
      summary: Delete a knowledge base and all its data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /knowledge-bases/{id}/documents:
    get:
      operationId: listKbDocuments
      tags: [knowledge-base]
      summary: List documents in a knowledge base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KbDocument"
    post:
      operationId: addKbDocument
      tags: [knowledge-base]
      summary: Add a document (text paste or URL) and start ingestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KbDocumentInput"
      responses:
        "202":
          description: Document accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KbDocument"
        "400":
          description: Validation error
        "404":
          description: Knowledge base not found

  /knowledge-bases/{id}/documents/{docId}:
    delete:
      operationId: deleteKbDocument
      tags: [knowledge-base]
      summary: Delete a document and its chunks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /knowledge-bases/{id}/query:
    post:
      operationId: queryKnowledgeBase
      tags: [knowledge-base]
      summary: Test retrieval — returns top-K chunks for a query
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KbQueryInput"
      responses:
        "200":
          description: Ranked chunks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KbChunkResult"
        "400":
          description: Validation error
        "404":
          description: Not found

  # ── Wallet ──────────────────────────────────────────────────────────────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get current user wallet balance and settings
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "401":
          description: Unauthorized

  /wallet/topup:
    post:
      operationId: createTopup
      tags: [wallet]
      summary: Create a Razorpay order for wallet top-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupInput"
      responses:
        "200":
          description: Razorpay order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupOrder"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /wallet/verify-payment:
    post:
      operationId: verifyPayment
      tags: [wallet]
      summary: Verify Razorpay payment and credit wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentInput"
      responses:
        "200":
          description: Payment verified and wallet credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "400":
          description: Payment verification failed
        "401":
          description: Unauthorized

  /wallet/transactions:
    get:
      operationId: listTransactions
      tags: [wallet]
      summary: List wallet transactions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletTransaction"
        "401":
          description: Unauthorized

  /wallet/autopay:
    patch:
      operationId: updateAutopay
      tags: [wallet]
      summary: Update auto-pay settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoPaySettings"
      responses:
        "200":
          description: Updated wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "401":
          description: Unauthorized

  # ── Account ──────────────────────────────────────────────────────────────────
  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: Get account keys, org key, and concurrency settings
      responses:
        "200":
          description: Account info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"
        "401":
          description: Unauthorized

  /account/regenerate-api-key:
    post:
      operationId: regenerateApiKey
      tags: [account]
      summary: Regenerate the user's API key
      responses:
        "200":
          description: New account info with fresh API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"
        "401":
          description: Unauthorized

  /account/add-concurrent:
    post:
      operationId: addConcurrentSlot
      tags: [account]
      summary: Purchase one additional concurrent call slot ($5 deducted from wallet)
      responses:
        "200":
          description: Updated account info with incremented concurrent limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"
        "402":
          description: Insufficient wallet balance
        "401":
          description: Unauthorized

  # ── Activity Logs ─────────────────────────────────────────────────────────────
  /activity-logs:
    get:
      operationId: listActivityLogs
      tags: [activity-logs]
      summary: List audit log events for the authenticated user
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of activity log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"
        "401":
          description: Unauthorized

  # ── Phone Numbers ────────────────────────────────────────────────────────────
  /phone-numbers:
    get:
      operationId: listPhoneNumbers
      tags: [phone-numbers]
      summary: List all phone numbers owned by the authenticated user
      responses:
        "200":
          description: List of owned phone numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhoneNumber"
        "401":
          description: Unauthorized

  /phone-numbers/available:
    get:
      operationId: listAvailablePhoneNumbers
      tags: [phone-numbers]
      summary: Search available phone numbers from Vobiz
      parameters:
        - name: countryCode
          in: query
          required: true
          schema:
            type: string
            description: ISO 3166-1 alpha-2 country code (e.g. US, IN, GB)
        - name: numberType
          in: query
          schema:
            type: string
            enum: [local, toll_free, mobile]
            default: local
        - name: pattern
          in: query
          schema:
            type: string
            description: Optional digit pattern to search for
      responses:
        "200":
          description: List of available numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailablePhoneNumber"
        "401":
          description: Unauthorized

  /phone-numbers/purchase:
    post:
      operationId: purchasePhoneNumber
      tags: [phone-numbers]
      summary: Purchase a phone number ($5 deducted from wallet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasePhoneNumberInput"
      responses:
        "201":
          description: Phone number purchased and assigned to user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneNumber"
        "402":
          description: Insufficient balance
        "401":
          description: Unauthorized

  /phone-numbers/{id}/assign:
    patch:
      operationId: assignPhoneNumber
      tags: [phone-numbers]
      summary: Assign a phone number to an agent (or clear assignment)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPhoneNumberInput"
      responses:
        "200":
          description: Number assignment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneNumber"
        "401":
          description: Unauthorized
        "404":
          description: Phone number not found

  /phone-numbers/{id}:
    delete:
      operationId: releasePhoneNumber
      tags: [phone-numbers]
      summary: Release a phone number back to Vobiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Number released
        "401":
          description: Unauthorized
        "404":
          description: Phone number not found

  # ── KYC ───────────────────────────────────────────────────────────────────
  /kyc/status:
    get:
      operationId: getKycStatus
      tags: [kyc]
      summary: Get the authenticated user's KYC status and active session
      responses:
        "200":
          description: KYC status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatusResponse"
        "401":
          description: Unauthorized

  /kyc/start:
    post:
      operationId: startKyc
      tags: [kyc]
      summary: Create a Vobiz sub-account (if needed) and start a redirect-flow KYC session
      responses:
        "201":
          description: KYC session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStartResponse"
        "401":
          description: Unauthorized
        "503":
          description: Vobiz not configured

  # ── Active Call Monitor ───────────────────────────────────────────────────
  /calls/active:
    get:
      operationId: listActiveCalls
      tags: [monitor]
      summary: List currently active (in-progress) calls for the authenticated user
      responses:
        "200":
          description: Active calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveCall"
        "401":
          description: Unauthorized

  # ── Per-Agent Analytics ───────────────────────────────────────────────────
  /analytics/agents/{id}:
    get:
      operationId: getAgentStats
      tags: [analytics]
      summary: Get detailed analytics for a single agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStats"
        "401":
          description: Unauthorized
        "404":
          description: Agent not found

  # ── Agent Templates ───────────────────────────────────────────────────────
