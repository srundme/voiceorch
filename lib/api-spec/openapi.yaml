          type: ["string", "null"]
        from_number:
          type: ["string", "null"]
        recording_url:
          type: ["string", "null"]
        hosted_telephony:
          type: ["boolean", "null"]
        provider_call_id:
          type: ["string", "null"]
        hangup_by:
          type: ["string", "null"]
        hangup_reason:
          type: ["string", "null"]
