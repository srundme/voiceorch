openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VoiceOrch - AI Voice Agent Orchestration Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agents
    description: Voice agent management
  - name: calls
    description: Call management
  - name: providers
    description: Provider key management
  - name: analytics
    description: Dashboard analytics
  - name: knowledge-base
    description: Knowledge base and RAG document management
  - name: wallet
    description: Wallet balance, top-up, and billing
  - name: account
    description: API keys, org key, and concurrent call limits
  - name: activity-logs
    description: Audit log of all platform events
  - name: phone-numbers
    description: Managed phone number provisioning (platform Vobiz account)
  - name: kyc
    description: KYC (Know Your Customer) identity verification via Vobiz
  - name: webhook-endpoints
    description: User-configured webhook endpoints for call event delivery
  - name: monitor
    description: Real-time active call monitoring
  - name: onboarding
    description: User onboarding flow
  - name: campaigns
    description: Auto-call campaign management
  - name: scheduling
    description: Native appointment scheduling engine
  - name: admin-usage
    description: Admin platform-wide STT/LLM/TTS usage monitoring
  - name: usage
    description: User-facing usage summary and budget
  - name: ambient-sounds
    description: Admin-managed ambient sound library and user-facing ambient track listing
  - name: command-center
    description: Real-time operational dashboard — KPIs, live ops feed, activity stream, batch health snapshots
  - name: platform-analytics
    description: Cross-campaign platform analytics — outcomes, funnel, sources, agents, queue
  - name: search
    description: Global search across leads, campaigns, batches, bookings, callbacks
  - name: pendrive
    description: Pendrive — caller memory API keys, archive, and context retrieval
  - name: simulation
    description: Agent simulation testing — manual chat and scenario persona testing
  - name: webcall
    description: Browser-based test call management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Agents ──────────────────────────────────────────────────────────────────
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: Validation error

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get a single agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /agents/{id}/toggle:
    patch:
      operationId: toggleAgent
      tags: [agents]
      summary: Toggle agent active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found

  /agents/{id}/snapserve-executions:
    get:
      operationId: getAgentSnapserveExecutions
      tags: [agents]
      summary: Fetch SnapServe executions for an agent (proxied from SnapServe API)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: page_number
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: SnapServe executions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapServeExecutionsResponse"
        "400":
          description: Invalid agent ID
        "401":
          description: SnapServe API key rejected (passed through from SnapServe)
        "403":
          description: SnapServe access forbidden (passed through from SnapServe)
        "404":
          description: Agent not found or SnapServe Agent ID / API key not configured
        "429":
          description: SnapServe rate limit exceeded (passed through from SnapServe)
        "502":
          description: Network error reaching SnapServe API

  # ── Agent Versions ──────────────────────────────────────────────────────────
  /agents/{id}/versions:
    get:
      operationId: listAgentVersions
      tags: [agents]
      summary: List all versions for an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of agent versions with usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersionsListResponse"
        "404":
          description: Agent not found
    post:
      operationId: publishAgentVersion
      tags: [agents]
      summary: Publish a new version snapshot of the agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishAgentVersionBody"
      responses:
        "201":
          description: Version published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "400":
          description: Validation error
        "404":
          description: Agent not found

  /agents/{id}/versions/{versionId}:
    get:
      operationId: getAgentVersion
      tags: [agents]
      summary: Fetch a single agent version snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent version with full snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "404":
          description: Not found

  /agents/{id}/versions/{versionId}/restore:
    post:
      operationId: restoreAgentVersion
      tags: [agents]
      summary: Create a new draft by restoring a previous version snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Restored draft version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "404":
          description: Not found

  /agents/{id}/versions/{versionId}/archive:
    patch:
      operationId: archiveAgentVersion
      tags: [agents]
      summary: Archive a published/production version (removes it from the active count)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Version archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "400":
          description: Version is already archived
        "404":
          description: Not found

  # ── Calls ───────────────────────────────────────────────────────────────────
  /calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: List calls with optional agent filter
      parameters:
        - name: agentId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
    post:
      operationId: initiateCall
      tags: [calls]
      summary: Initiate a new call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallInput"
      responses:
        "201":
          description: Call initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Validation error

  /calls/{id}:
    get:
      operationId: getCall
      tags: [calls]
      summary: Get call details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Call details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found
    patch:
      operationId: updateCall
      tags: [calls]
      summary: Update call record (status, transcript, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallUpdate"
      responses:
        "200":
          description: Updated call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  /calls/outbound:
    post:
      operationId: initiateOutboundCall
      tags: [calls]
      summary: Initiate an outbound phone call via the agent's telephony provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundCallBody"
      responses:
        "201":
          description: Outbound call initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Validation error or provider misconfiguration
        "404":
          description: Agent or telephony provider not found

  /calls/{id}/transfer:
    post:
      operationId: transferCall
      tags: [calls]
      summary: Transfer an active call to another number or SIP URI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCallBody"
      responses:
        "200":
          description: Transfer initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Validation error or provider misconfiguration
        "404":
          description: Call not found
        "409":
          description: Call is not active or already transferred

  /calls/{id}/end:
    patch:
      operationId: endCall
      tags: [calls]
      summary: End an active call
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallEndPayload"
      responses:
        "200":
          description: Call ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  /calls/{id}/disposition:
    patch:
      operationId: updateCallDisposition
      tags: [calls]
      summary: Manually set or override disposition fields for a call
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dispositionResult:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
      responses:
        "200":
          description: Disposition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  # ── Provider Keys ────────────────────────────────────────────────────────────
  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List configured provider keys
      responses:
        "200":
          description: List of provider configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderConfig"
    post:
      operationId: createProvider
      tags: [providers]
      summary: Add a provider key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Provider config created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
        "400":
          description: Validation error

  /providers/{id}:
    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
        "404":
          description: Not found
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Analytics (wow endpoints) ────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getDashboardStats
      tags: [analytics]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /analytics/calls/recent:
    get:
      operationId: getRecentCalls
      tags: [analytics]
      summary: Get recent call activity feed (last 20)
      responses:
        "200":
          description: Recent calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"

  /analytics/calls/by-status:
    get:
      operationId: getCallsByStatus
      tags: [analytics]
      summary: Get call counts grouped by status
      responses:
        "200":
          description: Calls by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallStatusCount"

  /analytics/calls/daily:
    get:
      operationId: getDailyCallVolume
      tags: [analytics]
      summary: Get daily call volume for the last 7 days
      responses:
        "200":
          description: Daily call volume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyCallVolume"

  # ── Knowledge Sources (FTS-based) ────────────────────────────────────────────
  /knowledge-sources:
    get:
      operationId: listKnowledgeSources
      tags: [knowledge]
      summary: List all knowledge sources for the current user
      responses:
        "200":
          description: List of knowledge sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeSource"
    post:
      operationId: createKnowledgeSource
      tags: [knowledge]
      summary: Create a knowledge source with optional initial entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSourceInput"
      responses:
        "201":
          description: Created knowledge source with entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSourceDetail"
        "400":
          description: Validation error

  /knowledge-sources/upload:
    post:
      operationId: uploadKnowledgeSource
      tags: [knowledge]
      summary: Create a knowledge source from an uploaded document (PDF/DOCX/TXT/CSV/Markdown)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created knowledge source with extracted entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSourceDetail"
        "400":
          description: Validation error

  /knowledge-sources/{id}:
    get:
      operationId: getKnowledgeSource
      tags: [knowledge]
      summary: Get a knowledge source with all its entries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Knowledge source with entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSourceDetail"
        "404":
          description: Not found
    patch:
      operationId: updateKnowledgeSource
      tags: [knowledge]
      summary: Update knowledge source name
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSourceUpdate"
      responses:
        "200":
          description: Updated knowledge source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSource"
        "404":
          description: Not found
    delete:
      operationId: deleteKnowledgeSource
      tags: [knowledge]
      summary: Delete a knowledge source and all its entries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /knowledge-sources/{id}/entries:
    post:
      operationId: addKnowledgeEntry
      tags: [knowledge]
      summary: Add an entry to a knowledge source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeEntryInput"
      responses:
        "201":
          description: Entry added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "400":
          description: Validation error
        "404":
          description: Source not found

  /knowledge-sources/{id}/entries/{entryId}:
    patch:
      operationId: updateKnowledgeEntry
      tags: [knowledge]
      summary: Update a knowledge entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeEntryInput"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "404":
          description: Not found
    delete:
      operationId: deleteKnowledgeEntry
      tags: [knowledge]
      summary: Delete a knowledge entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /knowledge-sources/{id}/search:
    post:
      operationId: searchKnowledge
      tags: [knowledge]
      summary: Full-text search within a knowledge source (test AI knowledge)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSearchInput"
      responses:
        "200":
          description: Search results with matched entries and scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResponse"
        "400":
          description: Validation error
        "404":
          description: Not found

  # ── Wallet ──────────────────────────────────────────────────────────────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get current user wallet balance and settings
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "401":
          description: Unauthorized

  /wallet/topup:
    post:
      operationId: createTopup
      tags: [wallet]
      summary: Create a Razorpay order for wallet top-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupInput"
      responses:
        "200":
          description: Razorpay order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupOrder"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /wallet/verify-payment:
    post:
      operationId: verifyPayment
      tags: [wallet]
      summary: Verify Razorpay payment and credit wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentInput"
      responses:
        "200":
          description: Payment verified and wallet credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "400":
          description: Payment verification failed
        "401":
          description: Unauthorized

  /wallet/transactions:
    get:
      operationId: listTransactions
      tags: [wallet]
      summary: List wallet transactions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletTransaction"
        "401":
          description: Unauthorized

  /wallet/autopay:
    patch:
      operationId: updateAutopay
      tags: [wallet]
      summary: Update auto-pay settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoPaySettings"
      responses:
        "200":
          description: Updated wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "401":
          description: Unauthorized

  # ── Account ──────────────────────────────────────────────────────────────────
  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: Get account keys, org key, and concurrency settings
      responses:
        "200":
          description: Account info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"
        "401":
          description: Unauthorized

  /account/regenerate-api-key:
    post:
      operationId: regenerateApiKey
      tags: [account]
      summary: Regenerate the user's API key
      responses:
        "200":
          description: New account info with fresh API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"
        "401":
          description: Unauthorized

  /account/add-concurrent:
    post:
      operationId: addConcurrentSlot
      tags: [account]
      summary: Purchase one additional concurrent call slot ($5 deducted from wallet)
      responses:
        "200":
          description: Updated account info with incremented concurrent limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"
