        called:             { type: integer }
        connected:          { type: integer }
        booked:             { type: integer }
        transferred:        { type: integer }
        connectionRate:     { type: number }
        bookingRate:        { type: number }
        transferRate:       { type: number }
        avgDurationSeconds: { type: number, nullable: true }
        sentimentBreakdown:
          type: object
          additionalProperties: { type: integer }

    PlatformAnalyticsCallbackQueue:
      type: object
      required: [total, pending, completed, cancelled, missed, overdue]
      properties:
        total:     { type: integer }
        pending:   { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        missed:    { type: integer }
        overdue:   { type: integer }

    PlatformAnalyticsBookingQueue:
      type: object
      required: [total, scheduled, completed, cancelled]
      properties:
        total:     { type: integer }
        scheduled: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }

    PlatformAnalyticsTransferQueue:
      type: object
      required: [total, initiated, connected, completed, failed]
      properties:
        total:     { type: integer }
        initiated: { type: integer }
        connected: { type: integer }
        completed: { type: integer }
        failed:    { type: integer }

    PlatformAnalyticsQueue:
      type: object
      required: [callbacks, bookings, transfers]
      properties:
        callbacks:
          $ref: '#/components/schemas/PlatformAnalyticsCallbackQueue'
        bookings:
          $ref: '#/components/schemas/PlatformAnalyticsBookingQueue'
        transfers:
          $ref: '#/components/schemas/PlatformAnalyticsTransferQueue'

    PlatformAnalyticsBatch:
      type: object
      required: [batchId, batchName, campaignName, totalLeads, called, connected,
                 booked, transferred, failed, connectionRate, bookingRate]
      properties:
        batchId:        { type: integer }
        batchName:      { type: string }
        campaignName:   { type: string }
        totalLeads:     { type: integer }
        called:         { type: integer }
        connected:      { type: integer }
        booked:         { type: integer }
        transferred:    { type: integer }
        failed:         { type: integer }
        connectionRate: { type: number }
        bookingRate:    { type: number }
        dailyTrend:
          type: array
          items:
            $ref: '#/components/schemas/PlatformAnalyticsDailyPoint'

    # ── Global Search ──────────────────────────────────────────────────────────

    GlobalSearchResult:
      type: object
      required: [id, title, subtitle, url, type]
      properties:
        id:       { type: string }
        title:    { type: string }
        subtitle: { type: string }
        badge:    { type: string, nullable: true }
        url:      { type: string }
        type:     { type: string }

    GlobalSearchResponse:
      type: object
      required: [campaigns, leads, batches, bookings, callbacks]
      properties:
        campaigns:
          type: array
          items: { $ref: '#/components/schemas/GlobalSearchResult' }
        leads:
          type: array
          items: { $ref: '#/components/schemas/GlobalSearchResult' }
        batches:
          type: array
          items: { $ref: '#/components/schemas/GlobalSearchResult' }
        bookings:
          type: array
          items: { $ref: '#/components/schemas/GlobalSearchResult' }
        callbacks:
          type: array
          items: { $ref: '#/components/schemas/GlobalSearchResult' }

    # ── Pendrive ────────────────────────────────────────────────────────────────

    PendriveApiKey:
      type: object
      required: [id, name, keyPrefix, createdAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        keyPrefix:   { type: string }
        lastUsedAt:  { type: ["string", "null"] }
        createdAt:   { type: string }

    PendriveApiKeyCreated:
      type: object
      required: [id, name, keyPrefix, plainKey, createdAt]
      properties:
        id:        { type: integer }
        name:      { type: string }
        keyPrefix: { type: string }
        plainKey:  { type: string }
        createdAt: { type: string }

    PendriveApiKeyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }

    PendriveArchiveInput:
      type: object
      required: [agentId, phoneNumber, transcript]
      properties:
        agentId:     { type: integer }
        phoneNumber: { type: string }
        callId:      { type: ["integer", "null"] }
        transcript:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:    { type: string }
              content: { type: string }

    PendriveArchiveResult:
      type: object
      required: [ok, factsExtracted, episodeId]
      properties:
        ok:             { type: boolean }
        factsExtracted: { type: integer }
        episodeId:      { type: integer }

    PendriveCallerFact:
      type: object
      required: [id, key, value, confidence, createdAt]
      properties:
        id:         { type: integer }
        key:        { type: string }
        value:      { type: string }
        confidence: { type: number }
        createdAt:  { type: string }

    PendriveCallerEpisode:
      type: object
      required: [id, createdAt]
      properties:
        id:              { type: integer }
        summary:         { type: ["string", "null"] }
        durationSeconds: { type: ["integer", "null"] }
        createdAt:       { type: string }

    PendriveContextResult:
      type: object
      required: [phoneNumber, callCount, facts, recentCalls, memoryBlock]
      properties:
        phoneNumber: { type: string }
        name:        { type: ["string", "null"] }
        callCount:   { type: integer }
        lastCalledAt: { type: ["string", "null"] }
        facts:
          type: array
          items: { $ref: '#/components/schemas/PendriveCallerFact' }
        recentCalls:
          type: array
          items: { $ref: '#/components/schemas/PendriveCallerEpisode' }
        memoryBlock: { type: string }

    PendriveStats:
      type: object
      required: [totalCallers, totalFacts, totalEpisodes, apiCallsThisMonth]
      properties:
        totalCallers:       { type: integer }
        totalFacts:         { type: integer }
        totalEpisodes:      { type: integer }
        apiCallsThisMonth:  { type: integer }
        topCallers:
          type: array
          items:
            type: object
            required: [phoneNumber, callCount]
            properties:
              phoneNumber: { type: string }
              name:        { type: ["string", "null"] }
              callCount:   { type: integer }
              factCount:   { type: integer }

    PendriveCallerList:
      type: object
      required: [callers, total]
      properties:
        total: { type: integer }
        callers:
          type: array
          items:
            type: object
            required: [phoneNumber, callCount, factCount, lastCalledAt]
            properties:
              phoneNumber: { type: string }
              name:        { type: ["string", "null"] }
              callCount:   { type: integer }
              factCount:   { type: integer }
              lastCalledAt: { type: ["string", "null"] }

    SimulationTestCase:
      type: object
      required: [id, agentId, userId, name, personaPrompt, goal, successCriteria, maxTurns, createdAt]
      properties:
        id:              { type: integer }
        agentId:         { type: integer }
        userId:          { type: string }
        name:            { type: string }
        personaPrompt:   { type: string }
        goal:            { type: string }
        successCriteria:
          type: array
          items: { type: string }
        variables:       { type: ["object", "null"] }
        kbSourceId:      { type: ["integer", "null"] }
        maxTurns:        { type: integer }
        createdAt:       { type: string }
        updatedAt:       { type: string }
        lastRun:
          type: ["object", "null"]
          properties:
            status: { type: string }
            score:  { type: ["integer", "null"] }
            createdAt: { type: string }

    SimulationTestCaseInput:
      type: object
      required: [agent_id, name, persona_prompt, goal]
      properties:
        agent_id:         { type: integer }
        name:             { type: string }
        persona_prompt:   { type: string }
        goal:             { type: string }
        success_criteria:
          type: array
          items: { type: string }
        variables:        { type: object }
        kb_source_id:     { type: ["integer", "null"] }
        max_turns:        { type: integer, default: 20 }

    SimulationRun:
      type: object
      required: [id, agentId, userId, status, createdAt]
      properties:
        id:           { type: integer }
        agentId:      { type: integer }
        testCaseId:   { type: ["integer", "null"] }
        userId:       { type: string }
        status:       { type: string }
        score:        { type: ["integer", "null"] }
        result:       { type: ["object", "null"] }
        startedAt:    { type: ["string", "null"] }
        completedAt:  { type: ["string", "null"] }
        createdAt:    { type: string }

    SimulationMessage:
      type: object
      required: [id, simulationRunId, role, content, createdAt]
      properties:
        id:               { type: integer }
        simulationRunId:  { type: integer }
        role:             { type: string }
        content:          { type: string }
        metadata:         { type: ["object", "null"] }
        createdAt:        { type: string }

    SimulationRunDetail:
      allOf:
        - $ref: "#/components/schemas/SimulationRun"
        - type: object
          properties:
            messages:
              type: array
              items: { $ref: "#/components/schemas/SimulationMessage" }

    SimulationTemplate:
      type: object
      required: [id, name, personaPrompt, goal, successCriteria]
      properties:
        id:             { type: string }
        name:           { type: string }
        personaPrompt:  { type: string }
        goal:           { type: string }
        successCriteria:
          type: array
          items: { type: string }
