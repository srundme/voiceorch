  # ── Admin: prompt templates ────────────────────────────────────────────────
  /admin/prompt-templates:
    get:
      summary: List all prompt template versions (admin)
      tags: [Admin]
      parameters: [{ $ref: '#/components/parameters/AdminToken' }]
      responses:
        '200':
          description: List of template versions
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/PromptTemplate' }
        '403': { description: Forbidden }
    post:
      summary: Upload a new master prompt template (becomes active, PDF or DOCX)
      tags: [Admin]
      parameters: [{ $ref: '#/components/parameters/AdminToken' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF or DOCX file (max 5 MB)
      responses:
        '201':
          description: Uploaded and activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptTemplate' }
        '400': { description: Invalid upload }
        '403': { description: Forbidden }

  /admin/prompt-templates/{id}:
    get:
      summary: Get a specific prompt template version (admin)
      tags: [Admin]
      parameters:
        - { $ref: '#/components/parameters/AdminToken' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptTemplate' }
        '404': { description: Not found }

  /admin/prompt-templates/{id}/activate:
    post:
      summary: Activate a specific prompt template version (admin)
      tags: [Admin]
      parameters:
        - { $ref: '#/components/parameters/AdminToken' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptTemplate' }
        '404': { description: Not found }

  /admin/prompt-templates/preview:
    post:
      summary: Render the active master template against sample wizard inputs (admin)
      tags: [Admin]
      parameters: [{ $ref: '#/components/parameters/AdminToken' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                wizardInputs:
                  type: object
                  additionalProperties: true
                  description: Optional sample inputs; if omitted, the server uses canned dummy inputs
      responses:
        '200':
          description: Rendered prompt
          content:
            application/json:
              schema:
                type: object
                required: [prompt, templateVersion]
                properties:
                  prompt: { type: string }
                  templateVersion: { type: integer }
        '503': { description: No active template }

