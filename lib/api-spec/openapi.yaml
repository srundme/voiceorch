  /admin/usage/allocations:
    get:
      operationId: adminListAllocations
      tags: [admin-usage]
      summary: List provider allocations
      responses:
        "200":
          description: Allocations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminAllocationRow" }
    put:
      operationId: adminUpsertAllocation
      tags: [admin-usage]
      summary: Upsert an allocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAllocationInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAllocationRow" }

  /admin/usage/allocations/{id}:
    delete:
      operationId: adminDeleteAllocation
      tags: [admin-usage]
      summary: Delete an allocation
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /admin/alerts:
    get:
      operationId: adminListAlerts
      tags: [admin-usage]
      summary: List recent admin alerts (acknowledged + unacknowledged)
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
        - { name: onlyUnacknowledged, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAlertsResponse" }

  /admin/alerts/{id}/acknowledge:
    post:
      operationId: adminAcknowledgeAlert
      tags: [admin-usage]
      summary: Acknowledge an alert
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAlert" }

  # ── Admin Voices ─────────────────────────────────────────────────────────────
  /admin/voices/cartesia:
    get:
      operationId: adminGetCartesiaVoices
      tags: [admin-voices]
      summary: Fetch all Cartesia voices (live) with current listed status
      responses:
        "200":
          description: List of Cartesia voices with listed flag
          content:
            application/json:
              schema:
                type: object
                required: [voices]
                properties:
                  voices:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminVoice"
        "503":
          description: Cartesia key not configured

  /admin/voices/listed:
    get:
      operationId: adminGetListedVoices
      tags: [admin-voices]
      summary: Return only the admin-whitelisted voices (used by dashboard)
      responses:
        "200":
          description: Listed voices
          content:
            application/json:
              schema:
                type: object
                required: [voices]
                properties:
                  voices:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminVoice"
    put:
      operationId: adminSaveListedVoices
      tags: [admin-voices]
      summary: Save the whitelisted voice selection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSaveListedVoicesInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved:
                    type: integer

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Agent Tool ──────────────────────────────────────────────────────────────
    DispositionField:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Snake-case field key (e.g. outcome, lead_score)
        label:
          type: string
          description: Human-readable label shown in the UI (e.g. "Call Outcome")
        type:
          type: string
          enum: [text, number, choice, boolean]
          description: Data type of the field
        options:
          type: array
          items:
            type: string
          description: Allowed values for choice fields (e.g. ["Interested","Not Interested"])
        required:
          type: boolean
          description: Whether this field must always be filled

    AgentTool:
      type: object
      required: [type, name, description]
      properties:
        type:
          type: string
          enum: [call_transfer, webhook, send_sms, end_call, cal_com, native_booking, native_reschedule, native_cancel]
          description: "Tool type: call_transfer, webhook, send_sms, end_call, cal_com, native_booking, native_reschedule, or native_cancel"
        name:
          type: string
          description: LLM-facing function name (snake_case, no spaces, e.g. transfer_to_human)
        description:
          type: string
          description: Explains to the LLM when and why to invoke this tool
        transferTo:
          type: string
          description: (call_transfer) E.164 phone number to transfer the call to (e.g. +12125551234)
        warmHandoffMessage:
          type: string
          description: (call_transfer) Optional message the agent speaks to the caller before transferring
        url:
          type: string
          description: (webhook) HTTP endpoint URL to POST/GET when this tool is invoked
        method:
          type: string
          enum: [GET, POST]
          description: (webhook) HTTP method
        headers:
          type: object
          additionalProperties:
            type: string
          description: (webhook) Optional extra HTTP headers
        secret:
          type: string
          description: (webhook) Optional secret sent as X-Webhook-Secret header
        messageTemplate:
          type: string
          description: (send_sms) SMS body to send to the caller — supports plain text
        goodbyeMessage:
          type: string
          description: (end_call) Optional message spoken to the caller before hanging up
        apiKey:
          type: string
          description: (cal_com) Cal.com API key
        eventTypeId:
          type: integer
          description: (cal_com / native_booking) Event type ID
        timezone:
          type: string
          description: (cal_com / send_sms) Default timezone for bookings (e.g. America/New_York)

    # ── Agent ──────────────────────────────────────────────────────────────────
    Agent:
      type: object
      required: [id, name, status, asrProvider, llmProvider, ttsProvider, telephonyProvider, systemPrompt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        agentType:
          type: ["string", "null"]
          enum: [general, lead_qualification, customer_support, appointment_booking, survey, null]
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, draft]
        asrProvider:
          type: string
          description: "ASR provider: deepgram, azure, whisper"
        asrModel:
          type: ["string", "null"]
        asrLanguage:
          type: ["string", "null"]
          description: Language code for the ASR provider (e.g. en, es, hi-IN)
        asrBackgroundDenoising:
          type: ["boolean", "null"]
          description: Filter background noise while the user is talking
        asrConfidenceThreshold:
          type: ["number", "null"]
          description: Transcripts below this confidence score (0–1) will be filtered out
        asrEndOfTurnConfidence:
          type: ["number", "null"]
          description: Confidence threshold (0.5–0.9) required to finish a turn (Deepgram)
        asrEndOfTurnTimeout:
          type: ["integer", "null"]
          description: Maximum time to wait (ms) after speech before finishing a turn
        asrKeyterms:
          type: ["string", "null"]
          description: Comma-separated keywords to boost transcription accuracy
        asrSmartEndpointing:
          type: ["string", "null"]
          enum: [off, vapi, livekit, null]
          description: Smart endpointing mode for more accurate speech endpoint detection
        asrAutoFallback:
          type: ["boolean", "null"]
          description: Automatically pick a backup STT provider if the primary fails
        llmProvider:
          type: string
          description: "LLM provider: openai, deepseek, anthropic, mistral, cohere"
        llmModel:
          type: ["string", "null"]
        ttsProvider:
          type: string
          description: "TTS provider: elevenlabs, openai, aws_polly, azure, cartesia, deepgram"
        ttsVoice:
          type: ["string", "null"]
        ttsModel:
          type: ["string", "null"]
        telephonyProvider:
          type: string
          description: "Telephony: twilio, plivo, vonage"
        systemPrompt:
          type: string
        temperature:
          type: ["number", "null"]
        maxDuration:
          type: ["integer", "null"]
          description: Max call duration in seconds
        greetingMessage:
          type: ["string", "null"]
          description: First thing the agent says when a call connects. If blank the LLM generates an opener.
        endCallPhrases:
          type: ["string", "null"]
          description: Comma-separated phrases that trigger hangup (e.g. "goodbye,bye,thanks for calling")
        silenceTimeoutSeconds:
          type: ["integer", "null"]
          description: Hang up automatically after this many seconds of caller silence
        language:
          type: ["string", "null"]
          description: Primary language code passed to ASR / TTS (e.g. en-US, es, fr, hi)
        backchannelingEnabled:
          type: ["boolean", "null"]
          description: Inject short acknowledgement phrases while the LLM is thinking
        backchannelingFrequency:
          type: ["number", "null"]
          description: Probability (0–1) of backchanneling on each turn
        webhookUrl:
          type: ["string", "null"]
          description: URL to POST a call summary JSON to when the call ends
        noiseCancellationEnabled:
          type: ["boolean", "null"]
          description: Request noise reduction from the ASR provider on every transcription call
        inactivityMessage:
          type: ["string", "null"]
          description: Message spoken to the caller before hanging up due to silence timeout
        knowledgeBaseId:
          type: ["integer", "null"]
          description: ID of an attached knowledge base for RAG context injection
        tools:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/AgentTool"
          description: List of tools (functions) the LLM can invoke during a call
        maxConcurrentCalls:
          type: ["integer", "null"]
          description: Per-agent concurrent call cap (null = use account limit)
        monthlySpendLimitCents:
          type: ["integer", "null"]
          description: Monthly spend cap in cents (null = no limit)
        dispositionSchema:
          type: ["array", "null"]
          description: User-defined fields to extract from each call via LLM
          items:
            $ref: "#/components/schemas/DispositionField"
        agentConfig:
          type: ["object", "null"]
          description: Advanced per-tab configuration (LLM params, engine, call, inbound, WhatsApp, analytics)
          additionalProperties: true
        totalCalls:
          type: integer
        successfulCalls:
          type: integer
        avgDurationSeconds:
          type: ["integer", "null"]
        avgSttLatencyMs:
          type: ["integer", "null"]
          description: Rolling average STT latency across all completed calls (ms)
        avgLlmLatencyMs:
          type: ["integer", "null"]
          description: Rolling average LLM first-token latency across all completed calls (ms)
        avgTtsFirstChunkMs:
          type: ["integer", "null"]
          description: Rolling average TTS first-audio-chunk latency across all completed calls (ms)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentInput:
      type: object
      required: [name, asrProvider, llmProvider, ttsProvider, telephonyProvider, systemPrompt]
      properties:
        name:
          type: string
          minLength: 1
        agentType:
          type: string
        description:
          type: string
        asrProvider:
          type: string
        asrModel:
          type: string
        asrLanguage:
          type: string
        asrBackgroundDenoising:
          type: boolean
        asrConfidenceThreshold:
          type: number
        asrEndOfTurnConfidence:
          type: number
        asrEndOfTurnTimeout:
          type: integer
        asrKeyterms:
          type: string
        asrSmartEndpointing:
          type: string
        asrAutoFallback:
          type: boolean
        llmProvider:
          type: string
        llmModel:
          type: string
        ttsProvider:
          type: string
        ttsVoice:
          type: string
        ttsModel:
          type: string
        telephonyProvider:
          type: string
        systemPrompt:
          type: string
        temperature:
          type: number
        maxDuration:
          type: integer
        greetingMessage:
          type: string
        endCallPhrases:
          type: string
        silenceTimeoutSeconds:
          type: integer
        language:
          type: string
        backchannelingEnabled:
          type: boolean
        backchannelingFrequency:
          type: number
        webhookUrl:
          type: string
        noiseCancellationEnabled:
          type: boolean
        inactivityMessage:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentTool"
          description: List of tools (functions) the LLM can invoke during a call
        agentConfig:
          type: object
          description: Advanced per-tab configuration
          additionalProperties: true

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
        agentType:
          type: string
        description:
          type: string
        asrProvider:
          type: string
        asrModel:
          type: string
        asrLanguage:
          type: string
        asrBackgroundDenoising:
          type: boolean
        asrConfidenceThreshold:
          type: number
        asrEndOfTurnConfidence:
          type: number
        asrEndOfTurnTimeout:
          type: integer
        asrKeyterms:
          type: string
        asrSmartEndpointing:
          type: string
        asrAutoFallback:
          type: boolean
        llmProvider:
          type: string
        llmModel:
          type: string
        ttsProvider:
          type: string
        ttsVoice:
          type: string
        ttsModel:
          type: string
        telephonyProvider:
          type: string
        systemPrompt:
          type: string
        temperature:
          type: number
        maxDuration:
          type: integer
        greetingMessage:
          type: string
        endCallPhrases:
          type: string
        silenceTimeoutSeconds:
          type: integer
        language:
          type: string
        backchannelingEnabled:
          type: boolean
        backchannelingFrequency:
          type: number
        webhookUrl:
          type: string
        noiseCancellationEnabled:
          type: boolean
        inactivityMessage:
          type: string
        knowledgeBaseId:
          type: integer
          description: ID of an attached knowledge base for RAG context injection
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentTool"
          description: List of tools (functions) the LLM can invoke during a call
        status:
          type: string
        maxConcurrentCalls:
          type: integer
        monthlySpendLimitCents:
          type: integer
        dispositionSchema:
          type: array
          items:
            $ref: "#/components/schemas/DispositionField"
        agentConfig:
          type: object
          description: Advanced per-tab configuration
          additionalProperties: true

    # ── Call ───────────────────────────────────────────────────────────────────
    Call:
      type: object
      required: [id, agentId, agentName, status, toNumber, fromNumber, createdAt]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        agentName:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed, cancelled, transferred]
        toNumber:
          type: string
        fromNumber:
          type: string
        durationSeconds:
          type: ["integer", "null"]
        transcript:
          type: ["string", "null"]
        recordingUrl:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        metadata:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        sttLatencyMs:
          type: ["integer", "null"]
          description: Average STT round-trip latency across all turns (ms)
        llmLatencyMs:
          type: ["integer", "null"]
          description: Average LLM time-to-first-token across all turns (ms)
        ttsFirstChunkMs:
          type: ["integer", "null"]
          description: Average TTS time-to-first-audio-chunk across all turns (ms)
        executionId:
          type: ["string", "null"]
          description: Unique execution identifier for this call (exec_xxxxxxxx)
        costCents:
          type: ["integer", "null"]
          description: Platform orchestration fee charged for this call in cents
        callSummary:
          type: ["string", "null"]
          description: AI-generated 3-line post-call summary
        successEvaluation:
          type: ["string", "null"]
          description: "Post-call LLM evaluation — PASS or FAIL on first line, one-sentence reason on the second line"
        dispositionResult:
          type: ["object", "null"]
          description: Extracted disposition values keyed by field name
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean

    CallEndPayload:
      type: object
      properties:
        sttLatencyMs:
          type: integer
          description: Average STT latency measured for this call (ms)
        llmLatencyMs:
          type: integer
          description: Average LLM first-token latency measured for this call (ms)
        ttsFirstChunkMs:
          type: integer
          description: Average TTS first-audio-chunk latency measured for this call (ms)

    CallInput:
      type: object
      required: [agentId, toNumber, fromNumber]
      properties:
        agentId:
          type: integer
        toNumber:
          type: string
        fromNumber:
          type: string
        metadata:
          type: string

    OutboundCallBody:
      type: object
      required: [agentId, toNumber]
      properties:
        agentId:
          type: integer
        toNumber:
          type: string
          description: "E.164 destination number (e.g. +1234567890)"
        webhookBaseUrl:
          type: string
          description: "Override public base URL for webhooks (auto-detected if omitted)"

    TransferCallBody:
      type: object
      required: [type, target]
      properties:
        type:
          type: string
          enum: [warm, cold]
          description: "warm = agent announces handoff before bridging; cold = immediate blind transfer"
        target:
          type: string
          description: "E.164 phone number (e.g. +15551234567) or SIP URI to transfer to"
        warmMessage:
          type: string
          description: "Optional message spoken to caller before the transfer (warm only)"
        webhookBaseUrl:
          type: string
          description: "Override public base URL for the transfer XML callback (auto-detected if omitted)"

    CallUpdate:
      type: object
      properties:
        status:
          type: string
        durationSeconds:
          type: integer
        transcript:
          type: string
        recordingUrl:
          type: string
        errorMessage:
          type: string
        endedAt:
          type: string
          format: date-time

    # ── Provider ───────────────────────────────────────────────────────────────
    ProviderConfig:
      type: object
      required: [id, providerType, providerName, isActive, createdAt]
      properties:
        id:
          type: integer
        providerType:
          type: string
          enum: [asr, llm, tts, telephony]
        providerName:
          type: string
        apiKeyHint:
          type: ["string", "null"]
          description: Last 4 chars of the API key (masked)
        isActive:
          type: boolean
        extraConfig:
          type: ["string", "null"]
          description: JSON string of extra config fields
        createdAt:
          type: string
          format: date-time

    ProviderInput:
      type: object
      required: [providerType, providerName, apiKey]
      properties:
        providerType:
          type: string
          enum: [asr, llm, tts, telephony]
        providerName:
          type: string
        apiKey:
          type: string
        extraConfig:
          type: string

    ProviderUpdate:
      type: object
      properties:
        apiKey:
          type: string
        isActive:
          type: boolean
        extraConfig:
          type: string

    # ── Account ────────────────────────────────────────────────────────────────
    AccountInfo:
      type: object
      required: [apiKey, orgKey, concurrentLimit, walletId]
      properties:
        apiKey:
          type: ["string", "null"]
          description: Secret API key for programmatic platform access (vok_ prefix)
        orgKey:
          type: ["string", "null"]
          description: Organisation-level key for webhook verification (voo_ prefix)
        concurrentLimit:
          type: integer
          description: Maximum simultaneous active calls allowed
        walletId:
          type: integer
          description: Internal wallet / user ID

    # ── Activity Log ───────────────────────────────────────────────────────────
    ActivityLog:
      type: object
      required: [id, eventType, description, createdAt]
      properties:
        id:
          type: integer
        eventType:
          type: string
          description: "e.g. agent.created, call.started, provider.added"
        resourceType:
          type: ["string", "null"]
        resourceId:
          type: ["string", "null"]
        description:
          type: string
        metadata:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── Analytics ──────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalAgents, activeAgents, totalCalls, callsToday, successRate, avgDurationSeconds]
      properties:
        totalAgents:
          type: integer
        activeAgents:
          type: integer
        totalCalls:
          type: integer
        callsToday:
          type: integer
        successRate:
          type: number
          description: Percentage of successful calls (0-100)
        avgDurationSeconds:
          type: integer
        callsThisWeek:
          type: integer
        totalProviders:
          type: integer

    CallStatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    DailyCallVolume:
      type: object
      required: [date, total, completed, failed]
      properties:
        date:
          type: string
        total:
          type: integer
        completed:
          type: integer
        failed:
          type: integer

    # ── Knowledge Base ──────────────────────────────────────────────────────────
    KnowledgeBase:
      type: object
      required: [id, name, embeddingModel, chunkSize, chunkOverlap, documentCount, chunkCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        embeddingModel:
          type: string
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
        documentCount:
          type: integer
        chunkCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KnowledgeBaseDetail:
      type: object
      required: [id, name, embeddingModel, chunkSize, chunkOverlap, documentCount, chunkCount, createdAt, updatedAt, documents]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        embeddingModel:
          type: string
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
        documentCount:
          type: integer
        chunkCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        documents:
          type: array
          items:
            $ref: "#/components/schemas/KbDocument"

    KnowledgeBaseInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        embeddingModel:
          type: string
          default: text-embedding-3-small
        chunkSize:
          type: integer
          default: 512
        chunkOverlap:
          type: integer
          default: 64

    KnowledgeBaseUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    KbDocument:
      type: object
      required: [id, knowledgeBaseId, name, sourceType, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        knowledgeBaseId:
          type: integer
        name:
          type: string
        sourceType:
          type: string
          enum: [text, url]
        sourceUrl:
          type: ["string", "null"]
        charCount:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, processing, ready, error]
        processingError:
          type: ["string", "null"]
        chunkCount:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KbDocumentInput:
      type: object
      required: [name, sourceType]
      properties:
        name:
          type: string
          minLength: 1
        sourceType:
          type: string
          enum: [text, url]
        content:
          type: string
          description: Raw text content (required when sourceType=text)
        sourceUrl:
          type: string
          description: URL to fetch and ingest (required when sourceType=url)

    KbQueryInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        topK:
          type: integer
          default: 5
          description: Number of chunks to return

    KbChunkResult:
      type: object
      required: [content, score, documentId, documentName, chunkIndex]
      properties:
        content:
          type: string
        score:
          type: number
          description: Relevance score (higher = more relevant)
        documentId:
          type: integer
        documentName:
          type: string
        chunkIndex:
          type: integer

    # ── Wallet ─────────────────────────────────────────────────────────────────
    WalletInfo:
      type: object
      required: [balanceCents, balanceUsd, freeCreditsGranted, autoPayEnabled, autoPayThresholdCents, autoPayAmountCents]
      properties:
        balanceCents:
          type: integer
