[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snapserve"
version = "0.1.0"
description = "Official Python SDK for the SnapServe AI voice agent API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "requests>=2.28",
]

[tool.setuptools.packages.find]
include = ["snapserve*"]
