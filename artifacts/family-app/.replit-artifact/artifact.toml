kind = "web"
previewPath = "/family/"
title = "Family — Insurance Agent Portal"
version = "1.0.0"
id = "artifacts/family-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/family/" ]
localPort = 25045

[services.development]
run = "pnpm --filter @workspace/family-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/family-app", "run", "build" ]
publicDir = "artifacts/family-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25045"
BASE_PATH = "/family/"
