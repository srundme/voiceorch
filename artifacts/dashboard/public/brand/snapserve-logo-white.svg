<svg xmlns="http://www.w3.org/2000/svg" width="420" height="100" viewBox="0 0 420 100" fill="none" role="img" aria-label="SnapServe">
  <title>SnapServe</title>

  <!-- Three-bar brand mark (matches snapserve-mark.png) -->
  <g>
    <rect x="0" y="6" width="88" height="88" rx="18" fill="#000000"/>
    <rect x="14" y="24" width="50" height="12" rx="6" fill="#1a1a1a"/>
    <rect x="20" y="44" width="50" height="12" rx="6" fill="#737373"/>
    <rect x="26" y="64" width="50" height="12" rx="6" fill="#a9acb1"/>
  </g>

  <!-- Wordmark: "Snap" bold + "Serve" regular -->
  <text x="108" y="66"
        font-family="'Tex Gyre Heros', Helvetica, Arial, sans-serif"
        font-size="54"
        letter-spacing="-1.5"
        fill="#FFFFFF">
    <tspan font-weight="700">Snap</tspan><tspan font-weight="400">Serve</tspan>
  </text>
</svg>
