    <!-- Ads pixels only on SnapServe's own hosts — never on partner white-label. -->
    <script>
      (function () {
        var h = (location.hostname || "").toLowerCase().split(":")[0];
        var direct = h === "app.snapserve.ai" || h === "www.snapserve.ai" || h === "snapserve.ai"
          || h === "localhost" || h === "127.0.0.1" || /\.localhost$/.test(h)
          || /^\d+\.\d+\.\d+\.\d+$/.test(h);
        window.__SNAPSERVE_DIRECT_HOST__ = direct;
        if (!direct) {
          document.title = "";
          return;
        }
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=AW-18305222030";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", "AW-18305222030");
      })();
    </script>

    <script>
      (function () {
        try {
          var t = localStorage.getItem("snapserve-ui-theme-v3") || "light";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
