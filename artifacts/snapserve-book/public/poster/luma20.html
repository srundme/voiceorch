<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@600;700;800&family=Noto+Sans+Tamil:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#FFF6E8;color:#2E1C10;position:relative;padding:56px 62px;text-align:center}
.burst{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,176,84,.35) 0%,rgba(255,246,232,0) 55%)}
.wrap{position:relative}
.chips{display:flex;gap:36px;align-items:center;justify-content:center}
.chip{display:flex;align-items:center;gap:12px}
.chip span{font-size:12px;font-weight:800;letter-spacing:.13em;color:#9A6A3A;white-space:nowrap}
.chip img{height:40px}
.k{margin-top:30px;font-weight:900;letter-spacing:.3em;font-size:18px;color:#C2481F}
.hero{font-family:'Archivo';font-weight:900;font-size:92px;line-height:.94;letter-spacing:-.03em;margin-top:10px;white-space:nowrap}
.hero .b{color:#C2481F;font-size:120px;display:block}
.sub{margin-top:16px;font-family:'Fraunces';font-weight:900;font-size:34px}
.tamil{font-family:'Noto Sans Tamil',sans-serif;font-weight:800;font-size:24px;color:#C2481F;margin-top:6px}
.art{margin:14px auto 0;width:380px;height:250px;background:url(art/crowd-auto-ticket.png) center/contain no-repeat;mix-blend-mode:multiply}
.bottom{position:absolute;left:62px;right:62px;bottom:50px}
.strip{display:flex;justify-content:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.s{background:#2E1C10;color:#FFF6E8;font-weight:800;font-size:18px;padding:12px 22px;border-radius:10px}
.s.o{background:#C2481F}
.cta{display:inline-block;background:linear-gradient(90deg,#C2481F,#E5843A);color:#fff;font-weight:900;font-size:23px;letter-spacing:.14em;padding:21px 78px;border-radius:999px;box-shadow:0 10px 30px rgba(194,72,31,.35)}
.foot{margin-top:12px;font-weight:700;font-size:16px;color:#9A6A3A}
</style></head><body>
<div class="burst"></div>
<div class="wrap">
  <div class="chips">
    <div class="chip"><span>ORGANISED BY</span><img src="snapserve-logo-t.png"></div>
    <div class="chip"><span>POWERED BY</span><img src="vobiz-logo.png"></div>
    <div class="chip"><span>CO-SPONSOR</span><img src="zenxai-logo.png"></div>
  </div>
  <div class="k">CHENNAI · SAT, SEP 5 · FREE ENTRY</div>
  <div class="hero">INDIA'S<span class="b">BIGGEST</span>VOICE-A-THON</div>
  <div class="sub">AI Voice for Tamil Nadu</div>
  <div class="tamil">AI குரல் · ₹1,00,000 Prize Pool</div>
  <div class="art"></div>
</div>
<div class="bottom">
  <div class="strip">
    <div class="s o">₹1,00,000 Prize Pool</div>
    <div class="s">9:30 AM – 6 PM</div>
    <div class="s">Olive Public School, Chitlapakkam</div>
  </div>
  <div class="cta">REGISTER NOW</div>
  <div class="foot">300 Seats · Solo or Teams of 2–3 · Awards + Platform Credits</div>
</div>
</body></html>
