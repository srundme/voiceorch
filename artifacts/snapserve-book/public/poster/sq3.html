<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SQ3 — Sunrise</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1080px; overflow:hidden; }
  body { font-family:'Inter',sans-serif; color:#3a2408; position:relative;
    background: linear-gradient(180deg, #f7941d 0%, #f9a94a 45%, #fbc98a 80%, #fdf0dc 100%); }
  .sun { position:absolute; top:80px; left:50%; transform:translateX(-50%); width:640px; height:640px; border-radius:50%;
    background: radial-gradient(circle, rgba(253,251,247,0.55) 0%, rgba(253,251,247,0.18) 55%, rgba(253,251,247,0) 72%); }
  .content { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; padding:66px 80px 58px; }
  .flourish { margin-bottom:16px; }
  .eyebrow { font-size:22px; font-weight:700; letter-spacing:0.24em; text-transform:uppercase; color:#5c3a0e; margin-bottom:76px; }
  h1 { font-family:'Fraunces',serif; font-weight:500; text-align:center; font-size:100px; line-height:1.06; color:#2d1c06; margin-bottom:36px; }
  h1 .cream { color:#fdfbf7; }
  .sub { text-align:center; font-size:27px; line-height:1.55; color:#4a3010; max-width:740px; font-weight:500; margin-bottom:auto; }
  .card { background:#fdfbf7; border-radius:28px; padding:36px 54px; display:flex; align-items:center; gap:44px;
    box-shadow:0 24px 60px rgba(61,36,8,0.22); margin-bottom:42px; }
  .snap { display:flex; align-items:center; gap:16px; }
  .snap img { width:76px; height:76px; }
  .snap-name { font-size:42px; font-weight:800; color:#14183a; }
  .times { font-family:'Fraunces',serif; font-size:46px; color:rgba(20,24,58,0.4); }
  .sarvam-word { font-weight:700; font-size:54px; letter-spacing:-0.03em; color:#14183a; padding-bottom:6px; }
  .footer { width:100%; display:flex; justify-content:center; gap:16px; align-items:center;
    font-size:19px; color:#6a4a1c; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; }
  .dot { width:6px; height:6px; border-radius:50%; background:#6a4a1c; }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="content">
    <div class="flourish">
      <svg width="140" height="26" viewBox="0 0 150 28" fill="none">
        <path d="M4 14c24 0 38-10 70-10s44 14 72 10" stroke="#fdfbf7" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="24" cy="8" r="4.5" fill="#fdfbf7"/><circle cx="122" cy="19" r="4" fill="#fdfbf7"/>
      </svg>
    </div>
    <div class="eyebrow">A Sarvam Startup</div>
    <h1>SnapServe<br/><span class="cream">joins Sarvam</span></h1>
    <p class="sub">India&rsquo;s Sovereign AI Platform now speaks with SnapServe&rsquo;s voice — AI agents for every Indian language, at population scale.</p>
    <div class="card">
      <div class="snap"><img src="snap-icon.png" alt="" /><div class="snap-name">SnapServe</div></div>
      <div class="times">&times;</div><div class="sarvam-word">sarvam</div>
    </div>
    <div class="footer"><span>AI Voice Platform</span><div class="dot"></div><span>Sovereign Compute</span><div class="dot"></div><span>From India</span></div>
  </div>
</body>
</html>
