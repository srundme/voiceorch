<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@600;700;800&family=Noto+Sans+Tamil:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:'Inter',sans-serif;position:relative;color:#3A1E12;background:linear-gradient(180deg,#FF9A5C 0%,#FFB56B 30%,#FFD08A 55%,#FFE3B0 100%)}
.art{position:absolute;left:0;right:0;bottom:0;height:430px;background:url(art/sunset-crowd-stage.png) center bottom/cover no-repeat}
.scrim{position:absolute;left:0;right:0;top:0;height:650px;background:linear-gradient(180deg,rgba(255,240,220,.9) 0%,rgba(255,240,220,.5) 70%,rgba(255,240,220,0) 100%)}
.wrap{position:relative;padding:52px 64px;text-align:center}
.chips{display:flex;gap:36px;align-items:center;justify-content:center}
.chip{display:flex;align-items:center;gap:12px}
.chip span{font-size:12px;font-weight:800;letter-spacing:.13em;color:#7A4526;white-space:nowrap}
.chip img{height:40px}
.k{margin-top:34px;font-size:20px;font-weight:800;letter-spacing:.28em;color:#C2481F}
.hero{font-family:'Archivo';font-weight:900;font-size:112px;line-height:.94;letter-spacing:-.02em;margin-top:12px;color:#3A1E12}
.hero em{font-style:normal;color:#C2481F}
.sub{margin-top:18px;font-size:28px;font-weight:800}
.tamil{font-family:'Noto Sans Tamil',sans-serif;font-weight:800;font-size:24px;color:#8A5430;margin-top:6px}
.pills{margin-top:22px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.9);border-radius:999px;padding:12px 24px;font-weight:800;font-size:19px;color:#3A1E12}
.pill b{color:#C2481F}
.bottom{position:absolute;left:0;right:0;bottom:52px;text-align:center}
.cta{display:inline-block;background:#3A1E12;color:#FFE3B0;font-weight:900;font-size:22px;letter-spacing:.14em;padding:20px 72px;border-radius:999px}
.foot{margin-top:12px;font-weight:800;font-size:16px;color:#fff;text-shadow:0 1px 8px rgba(60,20,0,.5)}
</style></head><body>
<div class="art"></div><div class="scrim"></div>
<div class="wrap">
  <div class="chips">
    <div class="chip"><span>ORGANISED BY</span><img src="snapserve-logo-t.png"></div>
    <div class="chip"><span>POWERED BY</span><img src="vobiz-logo.png"></div>
    <div class="chip"><span>CO-SPONSOR</span><img src="zenxai-logo.png"></div>
  </div>
  <div class="k">CHENNAI · SAT, SEP 5</div>
  <div class="hero">INDIA'S <em>BIGGEST</em><br>VOICE-A-THON</div>
  <div class="sub">AI Voice for Tamil Nadu</div>
  <div class="tamil">AI குரல்</div>
  <div class="pills">
    <div class="pill"><b>₹1,00,000</b> Prize Pool</div>
    <div class="pill">9:30 AM – 6 PM</div>
    <div class="pill"><b>Free</b> · 300 Seats</div>
  </div>
</div>
<div class="bottom">
  <div class="cta">REGISTER NOW</div>
  <div class="foot">Olive Public School, Chitlapakkam, Chennai · Solo or Teams of 2–3</div>
</div>
</body></html>
