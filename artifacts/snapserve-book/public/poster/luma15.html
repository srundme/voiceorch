<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@600;700;800&family=Noto+Sans+Tamil:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:'Inter',sans-serif;position:relative;color:#fff;background:#2A0F0A}
.art{position:absolute;inset:0;background:url(art/crowd-auto-sunset.png) center/cover no-repeat}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,8,4,.82) 0%,rgba(30,8,4,.35) 34%,rgba(30,8,4,.15) 55%,rgba(30,8,4,.88) 100%)}
.wrap{position:relative;padding:52px 64px;text-align:center;height:100%}
.chips{display:flex;gap:36px;align-items:center;justify-content:center}
.chip{display:flex;align-items:center;gap:12px}
.chip span{font-size:12px;font-weight:800;letter-spacing:.13em;color:#FFD9B0;white-space:nowrap}
.chip img{height:40px;filter:brightness(0) invert(1)}
.hero{font-family:'Archivo';font-weight:900;font-size:104px;line-height:.94;letter-spacing:-.02em;margin-top:30px;text-shadow:0 4px 30px rgba(0,0,0,.45)}
.hero em{font-style:normal;color:#FFB054}
.sub{margin-top:16px;font-size:27px;font-weight:800;color:#FFE9CF}
.tamil{font-family:'Noto Sans Tamil',sans-serif;font-weight:800;font-size:24px;color:#FFB054;margin-top:4px}
.bottom{position:absolute;left:0;right:0;bottom:50px;text-align:center}
.pills{display:flex;justify-content:center;gap:12px;margin-bottom:18px}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px);border-radius:999px;padding:11px 22px;font-weight:800;font-size:18px}
.pill b{color:#FFB054}
.cta{display:inline-block;background:linear-gradient(90deg,#FF7A2F,#FFB054);color:#2A0F0A;font-weight:900;font-size:22px;letter-spacing:.14em;padding:20px 72px;border-radius:999px}
.foot{margin-top:12px;font-weight:700;font-size:16px;color:#FFD9B0}
</style></head><body>
<div class="art"></div><div class="scrim"></div>
<div class="wrap">
  <div class="chips">
    <div class="chip"><span>ORGANISED BY</span><img src="snapserve-logo-t.png"></div>
    <div class="chip"><span>POWERED BY</span><img src="vobiz-logo.png"></div>
    <div class="chip"><span>CO-SPONSOR</span><img src="zenxai-logo.png"></div>
  </div>
  <div class="hero">INDIA'S <em>BIGGEST</em><br>VOICE-A-THON</div>
  <div class="sub">AI Voice for Tamil Nadu · ₹1,00,000 Prize Pool</div>
  <div class="tamil">AI குரல்</div>
</div>
<div class="bottom">
  <div class="pills">
    <div class="pill"><b>Sat, Sep 5</b> · 9:30 AM – 6 PM</div>
    <div class="pill">Olive Public School, Chitlapakkam</div>
    <div class="pill"><b>Free</b> · 300 Seats</div>
  </div>
  <div class="cta">REGISTER NOW</div>
  <div class="foot">Solo or Teams of 2–3 · Awards + Platform Credits</div>
</div>
</body></html>
