<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@600;700;800&family=Noto+Sans+Tamil:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#F1E9D4;color:#3D2B1B;position:relative;text-align:center;padding:54px 64px}
.chips{display:flex;gap:36px;align-items:center;justify-content:center}
.chip{display:flex;align-items:center;gap:12px}
.chip span{font-size:12px;font-weight:800;letter-spacing:.13em;color:#9A7A45;white-space:nowrap}
.chip img{height:40px}
.hero{font-family:'Fraunces';font-weight:900;font-size:110px;line-height:.93;margin-top:36px}
.hero em{font-style:normal;color:#B4531F}
.sub{margin-top:14px;font-size:26px;font-weight:800}
.tamil{font-family:'Noto Sans Tamil',sans-serif;font-weight:800;font-size:23px;color:#B4531F;margin-top:4px}
.art{margin:16px auto 0;width:560px;height:400px;background:url(art/festive-auto-decals.png) center/contain no-repeat;mix-blend-mode:multiply}
.decals{display:flex;justify-content:center;gap:18px;margin-top:2px}
.decal{background:#fff;border:2px solid #C99A4B;border-radius:12px;padding:10px 22px;display:flex;align-items:center}
.decal img{height:34px}
.bottom{position:absolute;left:64px;right:64px;bottom:52px}
.line{font-weight:800;font-size:20px;margin-bottom:14px}
.line b{color:#B4531F}
.cta{display:inline-block;background:#B4531F;color:#F1E9D4;font-weight:900;font-size:22px;letter-spacing:.14em;padding:20px 70px;border-radius:999px}
.foot{margin-top:12px;font-weight:700;font-size:16px;color:#9A7A45}
</style></head><body>
<div class="chips">
  <div class="chip"><span>ORGANISED BY</span><img src="snapserve-logo-t.png"></div>
  <div class="chip"><span>POWERED BY</span><img src="vobiz-logo.png"></div>
  <div class="chip"><span>CO-SPONSOR</span><img src="zenxai-logo.png"></div>
</div>
<div class="hero">INDIA'S <em>BIGGEST</em><br>VOICE-A-THON</div>
<div class="sub">AI Voice for Tamil Nadu · ₹1,00,000 Prize Pool</div>
<div class="tamil">AI குரல்</div>
<div class="art"></div>
<div class="decals">
  <div class="decal"><img src="snapserve-logo-t.png"></div>
  <div class="decal"><img src="vobiz-logo.png"></div>
  <div class="decal"><img src="zenxai-logo.png"></div>
</div>
<div class="bottom">
  <div class="line"><b>Sat, Sep 5</b> · 9:30 AM – 6 PM · Olive Public School, Chitlapakkam, Chennai</div>
  <div class="cta">REGISTER NOW</div>
  <div class="foot">Free Entry · 300 Seats · Solo or Teams of 2–3</div>
</div>
</body></html>
