<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@500;600;700&family=Noto+Sans+Tamil:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#FFF4EA url(art/marina-sunrise.png) center top/cover no-repeat;color:#3A2118;position:relative}
.panel{position:absolute;left:70px;right:70px;bottom:64px;background:rgba(255,251,246,.95);border-radius:26px;padding:44px 56px;box-shadow:0 24px 60px rgba(120,50,20,.22);text-align:center}
.chips{position:absolute;top:44px;left:0;right:0;display:flex;justify-content:center;gap:14px}
.chip{display:flex;align-items:center;gap:9px;border-radius:999px;padding:9px 18px;}
.chip span{font-size:13px;font-weight:800;letter-spacing:.12em;color:#A06A4A}
.chip img{height:44px}
.kicker{font-family:'Poppins';font-size:16px;font-weight:800;letter-spacing:.32em;color:#E0592A}
h1{font-family:'Poppins';font-weight:900;font-size:66px;line-height:1.04;margin-top:8px}
.tamil{font-family:'Noto Sans Tamil',sans-serif;font-weight:800;font-size:38px;margin-top:6px;color:#E0592A}
.row{margin-top:20px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.pill{background:#FFE8D6;border-radius:999px;padding:12px 26px;font-weight:800;font-size:19px;color:#7A431F}
.pill b{color:#E0592A}
.cta{margin-top:24px;display:inline-block;background:linear-gradient(90deg,#E0592A,#F5A623);color:#fff;font-weight:800;font-size:23px;letter-spacing:.13em;padding:17px 70px;border-radius:999px;box-shadow:0 12px 26px rgba(224,89,42,.35)}
.foot{margin-top:16px;font-size:16px;font-weight:700;color:#A06A4A}
</style></head><body>
<div class="chips">
  <div class="chip"><span>ORGANISED BY</span><img src="snapserve-logo-t.png"></div>
  <div class="chip"><span>POWERED BY</span><img src="vobiz-logo.png"></div>
  <div class="chip"><span>CO-SPONSOR</span><img src="zenxai-logo.png"></div>
</div>
<div class="panel">
  <div class="kicker">INDIA'S BIGGEST VOICE-A-THON</div>
  <h1>AI Voice for Tamil Nadu</h1>
  <div class="tamil">AI குரல்</div>
  <div class="row">
    <div class="pill"><b>₹1,00,000</b> Prize Pool</div>
    <div class="pill">Sat, Sep 5 · <b>9:30 AM – 6 PM</b></div>
    <div class="pill"><b>Free Entry</b> · 300 Seats</div>
  </div>
  <div class="cta">REGISTER NOW</div>
  <div class="foot">Olive Public School, Chitlapakkam, Chennai • Solo or Teams of 2–3</div>
</div>
</body></html>
