<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SnapServe × Sarvam — Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; }
  body { font-family:'Inter',sans-serif; background:#fdfbf7; color:#1e2749; position:relative; }
  .frame {
    position:absolute; inset:44px; border:1.5px solid rgba(30,39,73,0.28); border-radius:8px;
  }
  .glow {
    position:absolute; top:46%; left:50%; transform:translate(-50%,-50%);
    width:900px; height:620px; border-radius:50%;
    background: radial-gradient(ellipse at center, rgba(249,169,74,0.35) 0%, rgba(186,192,255,0.28) 55%, rgba(186,192,255,0) 78%);
    filter: blur(8px);
  }
  .content { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; padding:120px 120px 110px; }
  .kicker {
    font-size:22px; font-weight:600; letter-spacing:0.3em; text-transform:uppercase; color:#3d47d8;
    margin-bottom:34px;
  }
  .rule { width:72px; border-top:2px solid #f7941d; margin-bottom:110px; }
  h1 {
    font-family:'Fraunces',serif; font-weight:400; text-align:center;
    font-size:96px; line-height:1.16; letter-spacing:-0.01em; color:#20264a; margin-bottom:56px;
  }
  h1 em { font-style:italic; color:#3d47d8; }
  .sub { text-align:center; font-size:29px; line-height:1.6; color:#565d85; max-width:700px; margin-bottom:auto; }
  .lockup { display:flex; align-items:center; gap:48px; margin-bottom:96px; }
  .snap { display:flex; align-items:center; gap:18px; }
  .snap img { width:84px; height:84px; }
  .snap-name { font-size:44px; font-weight:800; letter-spacing:-0.02em; color:#14183a; }
  .times { font-family:'Fraunces',serif; font-size:46px; color:rgba(20,24,58,0.4); }
  .sarvam-word { font-weight:700; font-size:56px; letter-spacing:-0.03em; color:#14183a; padding-bottom:8px; }
  .footer { font-size:21px; color:#7a809f; letter-spacing:0.16em; text-transform:uppercase; font-weight:500; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="content">
    <div class="kicker">Now a Sarvam Startup</div>
    <div class="rule"></div>
    <div class="lockup">
      <div class="snap">
        <img src="snap-icon.png" alt="SnapServe" />
        <div class="snap-name">SnapServe</div>
      </div>
      <div class="times">&times;</div>
      <div class="sarvam-word">sarvam</div>
    </div>
    <h1>Every Indian language.<br/><em>One voice platform.</em><br/>One home: Sarvam.</h1>
    <p class="sub">SnapServe is now part of the Sarvam startup, carrying India&rsquo;s Sovereign AI Platform into every conversation.</p>
    <div class="footer">SnapServe &middot; AI Voice Platform &nbsp;&mdash;&nbsp; sarvam.ai</div>
  </div>
</body>
</html>
