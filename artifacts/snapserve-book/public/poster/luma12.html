<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@600;700;800&family=Noto+Sans+Tamil:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#F4F1EA;color:#171410;position:relative;text-align:center;padding:56px 60px}
.chips{display:flex;gap:40px;align-items:center;justify-content:center}
.chip{display:flex;align-items:center;gap:12px}
.chip span{font-size:12px;font-weight:800;letter-spacing:.13em;color:#6B6455;white-space:nowrap}
.chip img{height:40px}
.hero{margin-top:40px}
.line1{font-family:'Archivo';font-weight:900;font-size:56px;letter-spacing:.02em}
.line2{font-family:'Archivo';font-weight:900;font-size:132px;line-height:.92;letter-spacing:-.02em;color:#B4531F}
.line3{font-family:'Archivo';font-weight:900;font-size:100px;line-height:1;letter-spacing:-.01em}
.sub{margin-top:20px;font-size:27px;font-weight:800}
.tamil{font-family:'Noto Sans Tamil',sans-serif;font-weight:800;font-size:24px;color:#8A8272;margin-top:6px}
.art{margin:24px auto 0;width:520px;height:330px;background:url(art/crowd-auto-engraved.png) center/contain no-repeat;mix-blend-mode:multiply}
.strip{position:absolute;left:60px;right:60px;bottom:150px;display:flex;justify-content:center;gap:14px;font-weight:800;font-size:19px}
.strip div{background:#171410;color:#F4F1EA;padding:12px 22px;border-radius:8px}
.strip div.o{background:#B4531F}
.bottom{position:absolute;left:60px;right:60px;bottom:56px}
.cta{display:inline-block;background:#B4531F;color:#fff;font-weight:800;font-size:22px;letter-spacing:.13em;padding:20px 70px;border-radius:999px}
.foot{margin-top:14px;font-size:16px;font-weight:700;color:#6B6455}
</style></head><body>
<div class="chips">
  <div class="chip"><span>ORGANISED BY</span><img src="snapserve-logo-t.png"></div>
  <div class="chip"><span>POWERED BY</span><img src="vobiz-logo.png"></div>
  <div class="chip"><span>CO-SPONSOR</span><img src="zenxai-logo.png"></div>
</div>
<div class="hero">
  <div class="line1">INDIA'S</div>
  <div class="line2">BIGGEST</div>
  <div class="line3">VOICE-A-THON</div>
  <div class="sub">AI Voice for Tamil Nadu · ₹1,00,000 Prize Pool</div>
  <div class="tamil">AI குரல்</div>
</div>
<div class="art"></div>
<div class="strip">
  <div class="o">Sat, Sep 5 · 9:30 AM – 6 PM</div>
  <div>Olive Public School, Chitlapakkam, Chennai</div>
</div>
<div class="bottom">
  <div class="cta">REGISTER NOW</div>
  <div class="foot">Free Entry · 300 Seats · Solo or Teams of 2–3</div>
</div>
</body></html>
