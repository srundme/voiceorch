kind = "slides"
previewPath = "/product-deck/"
title = "SnapServe Product Overview"
version = "1.0.0"
id = "artifacts/product-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/product-deck/" ]
localPort = 24493

[services.development]
run = "pnpm --filter @workspace/product-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/product-deck", "run", "build" ]
publicDir = "artifacts/product-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24493"
BASE_PATH = "/product-deck/"
