kind = "web"
previewPath = "/pendrive/"
title = "Pendrive — Caller Memory API"
version = "1.0.0"
id = "artifacts/pendrive"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pendrive/" ]
localPort = 20831

[services.development]
run = "pnpm --filter @workspace/pendrive run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pendrive", "run", "build" ]
publicDir = "artifacts/pendrive/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20831"
BASE_PATH = "/pendrive/"
