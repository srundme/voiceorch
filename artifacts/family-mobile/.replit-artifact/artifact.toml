kind = "mobile"
previewPath = "/family-mobile/"
title = "Family — Agent Mobile App"
version = "1.0.0"
id = "artifacts/family-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/family-mobile/" ]
localPort = 25820

[services.development]
run = "pnpm --filter @workspace/family-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/family-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/family-mobile", "run", "serve" ]

[services.env]
PORT = "25820"
BASE_PATH = "/family-mobile/"
