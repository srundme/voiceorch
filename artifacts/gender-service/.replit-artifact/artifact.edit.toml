kind = "api"
deploymentTarget = "vm"
previewPath = "/voice-analysis"
title = "Voice Analysis Service"
version = "1.0.0"

[[services]]
localPort = 5000
name = "Voice Analysis"
paths = ["/voice-analysis"]

[services.development]
run = "pnpm --filter @workspace/gender-service run dev"

[services.production]

[services.production.build]
args = ["echo", "no-build-step"]

[services.production.run]
args = ["python3", "artifacts/gender-service/main.py"]

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/voice-analysis/health"
