name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # api-server imports @snapserve/mcp from its dist/, as in the Dockerfile.
      - name: Build MCP packages
        run: pnpm --filter @snapserveai/sdk build && pnpm --filter @snapserve/mcp build

      # tsc on api-server needs more than Node's default ~2 GB heap.
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run typecheck

      - name: Run api-server unit tests
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm --filter @workspace/api-server test
