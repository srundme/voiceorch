name: Deploy

# Every push to main builds the image here and ships the changed layers to the Krutrim VM.
# The VM side (/home/ubuntu/snapserve/bin/ci-deploy.sh, the only command the
# deploy key may run) takes a pre-deploy DB dump when the change can touch the database, swaps the app container,
# waits for /api/healthz and rolls back on its own if the new image is unhealthy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VM: ubuntu@206.1.58.131
      VM_HOST_KEY: "206.1.58.131 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA0xLGYAkEnZJAidZiRUu79Woxg2knUVqXu1u33HSFq1"
      DEPLOY_KEY: ${{ secrets.SNAPSERVE_DEPLOY_KEY }}
    steps:
      - name: Check deploy key
        id: gate
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::SNAPSERVE_DEPLOY_KEY secret is not set; skipping deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          fetch-depth: 0   # to compare with the commit the VM is running

      - name: Connect to the VM
        id: vm
        if: steps.gate.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "$VM_HOST_KEY" > ~/.ssh/known_hosts
          running=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VM" status | sed -n 's/^running=//p')
          echo "VM is running: ${running:-unknown}"
          echo "running=$running" >> "$GITHUB_OUTPUT"

      # The pre-deploy dump only matters when the database can change. Skip it when nothing
      # under lib/db changed and no added line creates, alters or drops tables/columns/indexes.
      - name: Does this deploy change the database?
        id: db
        if: steps.gate.outputs.ready == 'true'
        env:
          RUNNING: ${{ steps.vm.outputs.running }}
        run: |
          backup=yes
          if [ -n "$RUNNING" ] && git cat-file -e "$RUNNING^{commit}" 2>/dev/null; then
            if git diff --quiet "$RUNNING" "$GITHUB_SHA" -- lib/db \
              && ! git diff "$RUNNING" "$GITHUB_SHA" -- '*.ts' '*.sql' \
                   | grep -qiE '^\+.*\b(create|alter|drop)[[:space:]]+(table|index|column|type|schema)\b'; then
              backup=no
            fi
          fi
          echo "pre-deploy backup: $backup"
          echo "backup=$backup" >> "$GITHUB_OUTPUT"

      # The image build needs more disk and memory than the runner has by default.
      - name: Free disk and add swap
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          df -h / && free -h

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.ready == 'true'

      - name: Build image
        if: steps.gate.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: snapserve:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push through an SSH tunnel into the VM's localhost-only image store. Layers the store
      # already has are skipped, so a normal deploy uploads tens of MB instead of the whole image.
      - name: Ship changed layers to the VM and deploy
        if: steps.gate.outputs.ready == 'true'
        env:
          BACKUP: ${{ steps.db.outputs.backup }}
        run: |
          sha=${GITHUB_SHA::7}
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 -N -L 5000:127.0.0.1:5000 "$VM" &
          tunnel=$!
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:5000/v2/ && break; sleep 1; done
          docker tag "snapserve:$GITHUB_SHA" "127.0.0.1:5000/snapserve:$sha"
          docker push "127.0.0.1:5000/snapserve:$sha"
          kill "$tunnel" || true
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ServerAliveInterval=30 "$VM" "pull $sha ${BACKUP:-yes}"

      - name: Public health check
        if: steps.gate.outputs.ready == 'true'
        run: curl -fsS --retry 5 --retry-delay 5 https://app.snapserve.ai/api/healthz

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
