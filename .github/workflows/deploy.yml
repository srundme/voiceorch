name: Deploy

# Every push to main builds the image here and ships the changed layers to the AWS server (EC2 Mumbai).
# The VM side (/home/ubuntu/snapserve/bin/ci-deploy.sh, the only command the
# deploy key may run) takes a pre-deploy DB dump when the change can touch the database, swaps the app container,
# waits for /api/healthz and rolls back on its own if the new image is unhealthy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VM: ubuntu@13.206.129.250
      VM_HOST_KEY: "13.206.129.250 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIy5Ydf3JAxHcuejZS3Lv1v/+hqlN21X7vjExM4nFRqU"
      DEPLOY_KEY: ${{ secrets.SNAPSERVE_DEPLOY_KEY }}
    steps:
      - name: Check deploy key
        id: gate
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::SNAPSERVE_DEPLOY_KEY secret is not set; skipping deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          fetch-depth: 0   # to compare with the commit the VM is running

      - name: Connect to the VM
        id: vm
        if: steps.gate.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "$VM_HOST_KEY" > ~/.ssh/known_hosts
          running=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VM" status | sed -n 's/^running=//p')
          echo "VM is running: ${running:-unknown}"
          echo "running=$running" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Tunnel to the VM's localhost-only image store; the build pushes straight into it.
      # The deploy key may forward only to 127.0.0.1:5000.
      - name: Open tunnel to the VM image store
        if: steps.gate.outputs.ready == 'true'
        run: |
          nohup ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 -N -L 5000:127.0.0.1:5000 "$VM" > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:5000/v2/ && exit 0; sleep 1; done
          cat /tmp/tunnel.log; exit 1

      # The pre-deploy dump only matters when the database can change. Skip it when nothing
      # under lib/db changed and no added line creates, alters or drops tables/columns/indexes.
      - name: Does this deploy change the database?
        id: db
        if: steps.gate.outputs.ready == 'true'
        env:
          RUNNING: ${{ steps.vm.outputs.running }}
        run: |
          backup=yes
          if [ -n "$RUNNING" ] && git cat-file -e "$RUNNING^{commit}" 2>/dev/null; then
            if git diff --quiet "$RUNNING" "$GITHUB_SHA" -- lib/db \
              && ! git diff "$RUNNING" "$GITHUB_SHA" -- '*.ts' '*.sql' \
                   | grep -qiE '^\+.*\b(create|alter|drop)[[:space:]]+(table|index|column|type|schema)\b'; then
              backup=no
            fi
          fi
          echo "pre-deploy backup: $backup"
          echo "backup=$backup" >> "$GITHUB_OUTPUT"

      # The image build needs more disk and memory than the runner has by default.
      - name: Free disk and add swap
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          df -h / && free -h

      # BuildKit on the host network so it reaches the tunnel, and plain HTTP for that registry.
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.ready == 'true'
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."127.0.0.1:5000"]
              http = true
              insecure = true

      - name: Build image
        if: steps.gate.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          # BuildKit checks each layer by digest and uploads only those the VM store lacks.
          push: true
          tags: 127.0.0.1:5000/snapserve:${{ steps.vm.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on the VM
        if: steps.gate.outputs.ready == 'true'
        env:
          BACKUP: ${{ steps.db.outputs.backup }}
          SHORT: ${{ steps.vm.outputs.short }}
        run: |
          kill "$(cat /tmp/tunnel.pid)" 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ServerAliveInterval=30 "$VM" "pull $SHORT ${BACKUP:-yes}"

      - name: Public health check
        if: steps.gate.outputs.ready == 'true'
        run: curl -fsS --retry 5 --retry-delay 5 https://app.snapserve.ai/api/healthz

      - name: Close tunnel and remove deploy key
        if: always()
        run: |
          kill "$(cat /tmp/tunnel.pid 2>/dev/null)" 2>/dev/null || true
          rm -f ~/.ssh/deploy_key
