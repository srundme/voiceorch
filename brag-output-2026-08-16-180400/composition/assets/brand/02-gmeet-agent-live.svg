<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" role="img" aria-label="SnapServe agent live in Google Meet">
  <title>SnapServe agent live in Google Meet</title>
  <defs>
    <style>
      .ui   { font-family: 'Inter', 'Google Sans', Helvetica, Arial, sans-serif; }
      .name { font-size: 20px; fill: #FFFFFF; font-weight: 500; }
      .agn  { font-size: 22px; fill: #FFFFFF; font-weight: 700; }
      .meta { font-size: 17px; fill: #9AA0A6; }
      .code { font-size: 18px; fill: #E8EAED; }
      .cap  { font-size: 19px; fill: #E8EAED; }
      .pill { font-size: 14px; fill: #202124; font-weight: 700; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#202124"/>

  <!-- top bar -->
  <text x="48" y="56" class="ui code">Product demo &#8212; SnapServe</text>
  <text x="48" y="84" class="ui meta">meet.google.com/abc-defg-hij</text>

  <!-- == participant tiles == -->
  <!-- Karthik -->
  <rect x="48" y="120" width="880" height="496" rx="16" fill="#3C4043"/>
  <circle cx="488" cy="352" r="92" fill="#5F6368"/>
  <text x="488" y="368" class="ui" font-size="72" fill="#E8EAED" text-anchor="middle" font-weight="500">K</text>
  <rect x="72" y="556" width="150" height="36" rx="8" fill="#000000" opacity="0.5"/>
  <text x="88" y="581" class="ui name">Karthik</text>

  <!-- SnapServe agent tile &#8212; ACTIVE SPEAKER -->
  <rect x="960" y="120" width="880" height="496" rx="16" fill="#1F2A37"/>
  <rect x="960" y="120" width="880" height="496" rx="16" fill="none" stroke="#8AB4F8" stroke-width="5"/>

  <!-- agent mark -->
  <g transform="translate(1290,238) scale(10)">
    <mask id="agM" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="black"/>
      <rect x="4.3" y="3.2" width="15.4" height="14" rx="6" fill="white"/>
      <circle cx="9.3" cy="9" r="1.9" fill="black"/>
      <circle cx="14.7" cy="9" r="1.9" fill="black"/>
      <path d="M9.9 12.8c.945 1.68 3.255 1.68 4.2 0" stroke="black" stroke-width="1.35" stroke-linecap="round" fill="none"/>
    </mask>
    <rect x="1.1" y="7.9" width="3" height="6.4" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="19.9" y="7.9" width="3" height="6.4" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
    <rect width="24" height="24" fill="#FFFFFF" mask="url(#agM)"/>
    <rect x="5.4" y="19.2" width="13.2" height="3" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- speaking waveform -->
  <g fill="#8AB4F8">
    <rect x="1268" y="512" width="9" height="26" rx="4.5" opacity="0.45"/>
    <rect x="1290" y="496" width="9" height="58" rx="4.5" opacity="0.7"/>
    <rect x="1312" y="478" width="9" height="94" rx="4.5"/>
    <rect x="1334" y="462" width="9" height="126" rx="4.5"/>
    <rect x="1356" y="480" width="9" height="90" rx="4.5"/>
    <rect x="1378" y="498" width="9" height="54" rx="4.5" opacity="0.7"/>
    <rect x="1400" y="514" width="9" height="22" rx="4.5" opacity="0.45"/>
  </g>

  <rect x="984" y="556" width="290" height="36" rx="8" fill="#000000" opacity="0.5"/>
  <text x="1000" y="581" class="ui agn">SnapServe Agent</text>

  <!-- live badge -->
  <rect x="1706" y="152" width="110" height="34" rx="17" fill="#8AB4F8"/>
  <circle cx="1728" cy="169" r="6" fill="#202124"/>
  <text x="1742" y="175" class="ui pill">LIVE</text>

  <!-- == caption bar == -->
  <rect x="360" y="656" width="1200" height="88" rx="14" fill="#000000" opacity="0.62"/>
  <text x="392" y="692" class="ui meta">SnapServe Agent</text>
  <text x="392" y="722" class="ui cap">Sure &#8212; I can walk you through pricing and book a follow-up right now.</text>

  <!-- == control bar == -->
  <g transform="translate(0,0)">
    <circle cx="740" cy="920" r="34" fill="#3C4043"/>
    <path d="M740 906a7 7 0 0 1 7 7v8a7 7 0 0 1-14 0v-8a7 7 0 0 1 7-7Z" fill="#E8EAED"/>
    <path d="M728 921a12 12 0 0 0 24 0M740 933v6" stroke="#E8EAED" stroke-width="3" fill="none" stroke-linecap="round"/>

    <circle cx="830" cy="920" r="34" fill="#3C4043"/>
    <rect x="815" y="909" width="22" height="17" rx="4" fill="#E8EAED"/>
    <path d="M837 914l9-5v18l-9-5z" fill="#E8EAED"/>

    <rect x="900" y="890" width="120" height="60" rx="30" fill="#EA4335"/>
    <path d="M938 924c8-7 26-7 34 0l6-7c-11-11-35-11-46 0z" fill="#FFFFFF" transform="rotate(135 960 920)"/>

    <circle cx="1090" cy="920" r="34" fill="#3C4043"/>
    <rect x="1076" y="908" width="28" height="20" rx="4" fill="none" stroke="#E8EAED" stroke-width="3"/>

    <circle cx="1180" cy="920" r="34" fill="#3C4043"/>
    <circle cx="1172" cy="915" r="6" fill="#E8EAED"/>
    <circle cx="1188" cy="915" r="6" fill="#E8EAED"/>
    <path d="M1166 930c0-6 5-9 14-9s14 3 14 9" fill="#E8EAED"/>
  </g>

  <text x="960" y="1012" class="ui meta" text-anchor="middle">3 participants &#183; SnapServe Agent joined via Meeting bots</text>
</svg>
