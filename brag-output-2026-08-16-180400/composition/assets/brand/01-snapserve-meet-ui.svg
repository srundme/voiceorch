      <circle cx="8" cy="12" r="2.1" fill="#64748B"/>
      <circle cx="12" cy="12" r="2.1" fill="#64748B"/>
      <circle cx="16" cy="12" r="2.1" fill="#64748B"/>
    </g>
    <text x="68" y="569" class="nav">Memory</text>

