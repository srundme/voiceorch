<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" role="img" aria-label="SnapServe Meeting bots UI">
  <title>SnapServe &#8212; Meeting bots</title>
  <defs>
    <style>
      .ui   { font-family: 'Inter', 'Tex Gyre Heros', Helvetica, Arial, sans-serif; }
      .nav  { font-size: 15px; fill: #64748B; }
      .navA { font-size: 15px; fill: #0F172A; font-weight: 600; }
      .grp  { font-size: 11px; fill: #94A3B8; font-weight: 700; letter-spacing: 1.4px; }
      .h1   { font-size: 32px; font-weight: 700; fill: #0F172A; letter-spacing: -0.5px; }
      .sub  { font-size: 15px; fill: #64748B; }
      .step { font-size: 17px; font-weight: 700; fill: #0F172A; }
      .body { font-size: 14px; fill: #64748B; }
      .strg { font-size: 14px; fill: #0F172A; font-weight: 600; }
      .val  { font-size: 16px; fill: #0F172A; }
      .lbl  { font-size: 13px; fill: #475569; font-weight: 500; }
      .btn  { font-size: 16px; font-weight: 600; fill: #FFFFFF; }
      .gh   { font-size: 13px; font-weight: 600; fill: #0F172A; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; fill: #0F172A; }
      .badg { font-size: 12px; font-weight: 700; fill: #166534; }
      .wm   { font-size: 20px; fill: #0F172A; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- PP SIDEBAR PP -->
  <rect x="0" y="0" width="280" height="1080" fill="#FAFAFA"/>
  <line x1="280" y1="0" x2="280" y2="1080" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- brand -->
  <g transform="translate(28,40) scale(0.26)">
    <rect x="6"  y="14" width="88" height="20" rx="10" fill="#0F172A"/>
    <rect x="14" y="42" width="72" height="20" rx="10" fill="#0F172A" opacity="0.60"/>
    <rect x="22" y="70" width="56" height="20" rx="10" fill="#0F172A" opacity="0.36"/>
  </g>
  <text x="62" y="63" class="ui wm"><tspan font-weight="700">Snap</tspan><tspan font-weight="400">Serve</tspan></text>

  <g class="ui">
    <!-- Home -->
    <g transform="translate(28,138)">
      <path d="M2.5 9.4 12 1.6l9.5 7.8" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="4.6" y="8.6" width="14.8" height="12" rx="2.8" fill="#64748B" opacity="0.55"/>
      <rect x="9.6" y="13.4" width="4.8" height="7.2" rx="1.5" fill="#64748B"/>
    </g>
    <text x="68" y="155" class="nav">Home</text>

    <!-- Campaigns -->
    <g transform="translate(28,184)">
      <path d="M3.5 8.2h4.4l8.6-4v13.6l-8.6-4H3.5A1.8 1.8 0 0 1 1.7 12v-2A1.8 1.8 0 0 1 3.5 8.2Z" fill="#64748B"/>
      <rect x="4" y="17" width="3.4" height="5" rx="1.3" fill="#64748B" opacity="0.55"/>
      <rect x="18.4" y="7.4" width="2.3" height="2.3" rx="1.1" fill="#64748B" opacity="0.36"/>
      <rect x="18.4" y="10.9" width="3" height="2.3" rx="1.1" fill="#64748B" opacity="0.55"/>
      <rect x="18.4" y="14.4" width="2.3" height="2.3" rx="1.1" fill="#64748B" opacity="0.36"/>
    </g>
    <text x="68" y="201" class="nav">Campaigns</text>

    <!-- Agents -->
    <g transform="translate(28,230)">
      <mask id="ag1" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
        <rect width="24" height="24" fill="black"/>
        <rect x="4.3" y="3.2" width="15.4" height="14" rx="6" fill="white"/>
        <circle cx="9.3" cy="9" r="1.9" fill="black"/>
        <circle cx="14.7" cy="9" r="1.9" fill="black"/>
        <path d="M9.9 12.8c.945 1.68 3.255 1.68 4.2 0" stroke="black" stroke-width="1.35" stroke-linecap="round" fill="none"/>
      </mask>
      <rect x="1.1" y="7.9" width="3" height="6.4" rx="1.5" fill="#64748B" opacity="0.55"/>
      <rect x="19.9" y="7.9" width="3" height="6.4" rx="1.5" fill="#64748B" opacity="0.55"/>
      <rect width="24" height="24" fill="#64748B" mask="url(#ag1)"/>
      <rect x="5.4" y="19.2" width="13.2" height="3" rx="1.5" fill="#64748B" opacity="0.55"/>
    </g>
    <text x="68" y="247" class="nav">Agents</text>

    <!-- Phone numbers -->
    <g transform="translate(28,276)">
      <rect x="7.2" y="2.8" width="9.6" height="18.4" rx="3.2" fill="#64748B"/>
      <rect x="9.4" y="5.2" width="5.2" height="1.8" rx="0.9" fill="#FAFAFA" opacity="0.6"/>
      <circle cx="12" cy="18.4" r="1.35" fill="#FAFAFA" opacity="0.7"/>
    </g>
    <text x="68" y="293" class="nav">Phone numbers</text>

    <!-- Connections (ACTIVE) -->
    <rect x="14" y="306" width="252" height="40" rx="9" fill="#0F172A" opacity="0.075"/>
    <g transform="translate(28,322)">
      <rect x="2.5" y="8.2" width="7.2" height="7.6" rx="2.2" fill="#0F172A"/>
      <rect x="14.3" y="8.2" width="7.2" height="7.6" rx="2.2" fill="#0F172A"/>
      <rect x="9" y="10.6" width="6" height="2.8" rx="1.4" fill="#0F172A" opacity="0.55"/>
    </g>
    <text x="68" y="339" class="navA">Connections</text>

    <!-- History -->
    <g transform="translate(28,368)">
      <circle cx="12" cy="12.2" r="8.2" fill="#64748B" opacity="0.55"/>
      <rect x="11.1" y="7.4" width="1.8" height="5.4" rx="0.9" fill="#64748B"/>
      <rect x="11.1" y="11.4" width="4.6" height="1.8" rx="0.9" fill="#64748B"/>
    </g>
    <text x="68" y="385" class="nav">History</text>

    <!-- Analytics -->
    <g transform="translate(28,414)">
      <rect x="2.5" y="14.2" width="4" height="6.2" rx="1.6" fill="#64748B" opacity="0.36"/>
      <rect x="9.5" y="9.6" width="4" height="10.8" rx="1.6" fill="#64748B" opacity="0.55"/>
      <rect x="16.5" y="4.8" width="4" height="15.6" rx="1.6" fill="#64748B"/>
    </g>
    <text x="68" y="431" class="nav">Analytics</text>

