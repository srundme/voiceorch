    <g transform="translate(28,506)">
      <path d="M3.2 6.2c0-1.1.9-2 2-2H11v13.6H5.2c-1.1 0-2-.9-2-2V6.2Z" fill="#64748B"/>
      <path d="M12.8 4.2h5.8c1.1 0 2 .9 2 2v9.6c0 1.1-.9 2-2 2h-5.8V4.2Z" fill="#64748B" opacity="0.55"/>
    </g>
    <text x="68" y="523" class="nav">Knowledge</text>

