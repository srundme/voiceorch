  <!-- PP MAIN PP -->
  <g class="ui">
    <text x="340" y="88" class="h1">Meeting bots</text>
    <text x="340" y="122" class="sub">Send an agent into a Meet / Zoom / Teams room that already exists.</text>

    <!-- Three ways -->
    <rect x="340" y="152" width="1000" height="132" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="368" y="186" class="strg">Three ways to join</text>
    <text x="368" y="216" class="body"><tspan class="strg">Join now</tspan> &#8212; paste a Meet/Zoom/Teams link (manual).</text>
    <text x="368" y="244" class="body"><tspan class="strg">Calendar Join</tspan> &#8212; connect Google, toggle Join on events (semi-auto).</text>
    <text x="368" y="272" class="body"><tspan class="strg">From bookings</tspan> &#8212; auto-join near the slot when the invite has a Meet link.</text>

    <!-- Step 1 -->
    <text x="340" y="336" class="step">1. Pick agent</text>
    <text x="1268" y="336" class="body" text-anchor="end">+ New agent</text>
    <rect x="340" y="354" width="700" height="54" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="364" y="388" class="val">Voiceathon &#8212; phone + meetings</text>
    <path d="M1000 375l7 8 7-8" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1056" y="354" width="200" height="54" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1090" y="388" class="gh">Meeting prompt</text>

    <!-- Step 2 (hero) -->
    <rect x="340" y="440" width="1000" height="268" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <text x="368" y="486" class="step">2. Join now (paste link)</text>
    <text x="368" y="516" class="body">Manual: paste a room URL and send the agent in immediately.</text>

    <text x="368" y="558" class="lbl">Meet / Zoom / Teams URL</text>
    <rect x="368" y="572" width="944" height="56" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <g transform="translate(388,589) scale(0.26)">
      <path fill="#00832d" d="M49.5 36l8.53 9.75 11.47 7.33 2-17.02-2-16.64-11.69 6.44z"/>
      <path fill="#0066da" d="M0 51.5V66c0 3.315 2.685 6 6 6h14.5l3-10.96-3-9.54-9.95-3z"/>
      <path fill="#e94235" d="M20.5 0L0 20.5l10.55 3 9.95-3 2.95-9.41z"/>
      <path fill="#2684fc" d="M20.5 20.5H0v31h20.5z"/>
      <path fill="#00ac47" d="M82.6 8.68L69.5 19.42v33.66l13.16 10.79c1.97 1.54 4.85.135 4.85-2.37V11c0-2.535-2.945-3.925-4.91-2.32zM49.5 36v15.5H20.5V72h43c3.315 0 6-2.685 6-6V53.08z"/>
      <path fill="#ffba00" d="M63.5 0h-43v20.5h29V36l20-16.57V6c0-3.315-2.685-6-6-6z"/>
    </g>
    <text x="418" y="607" class="mono">https://meet.google.com/abc-defg-hij</text>

    <!-- Join button -->
    <rect x="368" y="648" width="212" height="56" rx="10" fill="#0F172A"/>
    <g transform="translate(396,668)">
      <rect width="15" height="12" rx="2.4" fill="none" stroke="#FFFFFF" stroke-width="1.9"/>
      <path d="M15 4.6l5-2.9v10.6l-5-2.9z" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linejoin="round"/>
    </g>
    <text x="428" y="683" class="btn">Join meeting</text>
    <!-- cursor -->
    <g transform="translate(556,682)">
      <path d="M0 0l0 20 5.2-5.2 3.1 7.1 3.3-1.5-3.1-6.9 7.1-0.4z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
    </g>

    <!-- Step 3 -->
    <rect x="340" y="740" width="1000" height="196" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="368" y="786" class="step">3. Calendar Join (auto on events you choose)</text>
    <rect x="368" y="806" width="112" height="30" rx="15" fill="#DCFCE7"/>
    <text x="390" y="826" class="badg">Connected</text>
    <text x="500" y="826" class="body">karthik@snapserve.ai</text>

    <rect x="368" y="850" width="944" height="66" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="392" y="880" class="strg">Product demo &#8212; SnapServe</text>
    <text x="392" y="902" class="body">Thu, Sep 5 &#183; 4:00 PM &#183; meet.google.com/abc-defg-hij</text>
    <text x="1160" y="890" class="strg">Join</text>
    <rect x="1208" y="868" width="72" height="34" rx="17" fill="#0F172A"/>
    <circle cx="1263" cy="885" r="13" fill="#FFFFFF"/>
  </g>

  <!-- PP RIGHT PANEL PP -->
