      <rect x="15.4" y="3.8" width="6.4" height="6.4" rx="2.2" fill="#64748B" opacity="0.55"/>
      <rect x="8.8" y="13.8" width="6.4" height="6.4" rx="2.2" fill="#64748B"/>
