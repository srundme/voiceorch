<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Tex Gyre Heros";
        src: local("Tex Gyre Heros"), local("TeXGyreHeros"), local("Helvetica Neue"), local("Helvetica");
        font-weight: 400 700;
        font-style: normal;
      }

      :root {
        --bg: #0d0d0e;
        --slate: #1a1a1e;
        --metal: #8e8e93;
        --white: #ffffff;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--white);
      }

      body {
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .brand { font-family: "Tex Gyre Heros", "Inter", sans-serif; }

      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        isolation: isolate;
        background: var(--bg);
      }

      .spot {
        position: absolute;
        left: 140px;
        top: 80px;
        width: 800px;
        height: 800px;
        z-index: -5;
        pointer-events: none;
        background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 62%);
      }

      .grid {
        position: absolute;
        inset: 0;
        z-index: -4;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
        background-size: 48px 48px;
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: 70;
        pointer-events: none;
        opacity: 0.14;
        background-image: radial-gradient(circle, rgba(255,255,255,0.3) 0.55px, transparent 0.7px);
        background-size: 3px 3px;
      }

      .vignette {
        position: absolute;
        inset: 0;
        z-index: 80;
        box-shadow: inset 0 0 150px 40px #000;
        pointer-events: none;
      }

      section.clip, #world.clip { position: absolute; inset: 0; }
      .scene-inner, .stack { position: absolute; inset: 0; }

      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 230px 524px;
      }

      .glass {
        background: linear-gradient(180deg, #242428 0%, #1a1a1e 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
      }

      #win {
        position: absolute;
        left: 90px;
        top: 170px;
        width: 900px;
        height: 540px;
        border-radius: 28px;
      }

      .lights {
        position: absolute;
        left: 28px;
        top: 24px;
        display: flex;
        gap: 8px;
      }
      .lights i {
        display: block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .lights .r { background: #ff5f57; }
      .lights .y { background: #febc2e; }
      .lights .g { background: #28c840; }

      .who {
        position: absolute;
        left: 40px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--metal);
      }
      #host-who { top: 68px; }
      #ai-who { top: 268px; }

      .bubble {
        position: absolute;
        left: 40px;
        border-radius: 22px;
        display: flex;
        align-items: center;
      }
      #host-pill {
        top: 98px;
        width: 820px;
        height: 96px;
        padding: 0 32px;
        background: #2c2c31;
        border: 1px solid rgba(255,255,255,0.08);
      }
      #host-typed {
        overflow: hidden;
        white-space: nowrap;
        width: 0;
        font-size: 26px;
        font-weight: 650;
        color: var(--white);
      }
      #dots-pill {
        top: 306px;
        width: 196px;
        height: 76px;
        justify-content: center;
        gap: 14px;
        background: #141418;
        border: 1px solid rgba(255,255,255,0.1);
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
      }
      .dot.d2 { background: #c7c7cc; }
      .dot.d3 { background: #8e8e93; }

      #headset {
        position: absolute;
        left: 110px;
        top: 390px;
        width: 240px;
        height: 240px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #headset img { width: 200px; height: 200px; display: block; }

      .room {
        position: absolute;
        top: 430px;
        width: 120px;
        height: 120px;
        border-radius: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .room img { width: 72px; height: 72px; display: block; }
      #room-meet { left: 210px; }
      #room-zoom { left: 480px; }
      #room-teams { left: 750px; }

      #deck {
        position: absolute;
        left: 80px;
        top: 150px;
        width: 920px;
        height: 430px;
        border-radius: 32px;
        overflow: hidden;
      }
      .slide {
        position: absolute;
        left: 36px;
        top: 32px;
        width: 848px;
        height: 280px;
        border-radius: 22px;
        background: #121214;
        border: 1px solid rgba(255,255,255,0.08);
        padding: 28px 36px;
      }
      .slide .kicker {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: var(--metal);
      }
      .slide .num {
        margin-top: 10px;
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -3px;
        line-height: 1;
      }
      .bar {
        margin-top: 16px;
        height: 14px;
        border-radius: 7px;
        background: #3a3a40;
      }
      .bar.w2 { width: 72%; }
      .bar.w3 { width: 54%; }

      #deck-wave {
        position: absolute;
        left: 36px;
        top: 330px;
        width: 848px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      #deck-wave b, #end-wave b {
        display: block;
        width: 8px;
        height: 18px;
        border-radius: 4px;
        background: #ffffff;
        transform-origin: center center;
      }

      .card {
        position: absolute;
        left: 80px;
        top: 620px;
        width: 920px;
        height: 96px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: 750;
        letter-spacing: -0.6px;
        text-align: center;
      }
      .card b { color: #ffffff; }
      .card span { color: #c7c7cc; }

      #end-wave {
        position: absolute;
        left: 90px;
        top: 250px;
        width: 900px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .end-mark {
        position: absolute;
        left: 420px;
        top: 220px;
        width: 240px;
        height: 240px;
      }
      .end-mark img { width: 100%; height: 100%; display: block; }
      .end-word {
        position: absolute;
        left: 0;
        top: 490px;
        width: 1080px;
        text-align: center;
        font-size: 56px;
        letter-spacing: -1.4px;
      }
      .end-word b { font-weight: 700; }
      .end-word span { font-weight: 400; }
      .end-word i {
        font-style: normal;
        font-family: "Inter", sans-serif;
        font-weight: 650;
      }
      .end-tag {
        position: absolute;
        left: 80px;
        top: 580px;
        width: 920px;
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        color: #c7c7cc;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1080">
      <div class="spot" data-layout-allow-overflow></div>
      <div class="grid"></div>

      <audio id="music" class="clip" data-start="0" data-duration="14" data-track-index="0" data-volume="0.18" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>
      <audio id="sfx-in" class="clip" data-start="0.18" data-duration="0.4" data-track-index="8" data-volume="0.26" src="assets/sfx/card-slide-1.ogg"></audio>
      <audio id="sfx-zoom" class="clip" data-start="4.05" data-duration="0.18" data-track-index="9" data-volume="0.26" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-split" class="clip" data-start="5.55" data-duration="0.12" data-track-index="10" data-volume="0.28" src="assets/sfx/drop_001.ogg"></audio>
      <audio id="sfx-flip" class="clip" data-start="8.15" data-duration="0.5" data-track-index="11" data-volume="0.26" src="assets/sfx/switch_004.ogg"></audio>
      <audio id="sfx-end" class="clip" data-start="11.15" data-duration="1.48" data-track-index="12" data-volume="0.28" src="assets/sfx/impactBell_heavy_000.ogg"></audio>

      <div id="world" class="clip" data-start="0" data-duration="14" data-track-index="2"></div>

      <section id="film" class="clip" data-start="0" data-duration="14" data-track-index="1">
        <div id="stage" class="scene-inner">
          <div id="cam" class="stack">
            <div id="win" class="glass">
              <div class="lights" id="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
              <div id="host-who" class="who">HOST</div>
              <div id="host-pill" class="bubble">
                <div id="host-typed" data-layout-allow-overflow>Can SnapServe AI join my 3 PM meeting and present?</div>
              </div>
              <div id="ai-who" class="who">SNAPSERVE AI</div>
              <div id="dots-pill" class="bubble">
                <span class="dot d1"></span>
                <span class="dot d2"></span>
                <span class="dot d3"></span>
              </div>
            </div>

            <div id="headset"><img src="assets/brand/snapserve-agent-icon-morph.svg" alt="" /></div>
            <div id="room-meet" class="room glass"><img src="assets/brand/meet-mono.svg" alt="" /></div>
            <div id="room-zoom" class="room glass"><img src="assets/brand/zoom-mono.svg" alt="" /></div>
            <div id="room-teams" class="room glass"><img src="assets/brand/teams-mono.svg" alt="" /></div>
          </div>

          <div id="deck" class="glass">
            <div id="slide-a" class="slide" data-layout-allow-overlap>
              <div class="kicker">DECK</div>
              <div class="num">03</div>
              <div class="bar w2"></div>
              <div class="bar w3"></div>
            </div>
            <div id="slide-b" class="slide" data-layout-allow-overlap>
              <div class="kicker">DECK</div>
              <div class="num">04</div>
              <div class="bar w3"></div>
              <div class="bar w2"></div>
            </div>
            <div id="deck-wave" data-layout-allow-overlap>
              <b class="dw"></b><b class="dw"></b><b class="dw"></b><b class="dw"></b>
              <b class="dw"></b><b class="dw"></b><b class="dw"></b><b class="dw"></b>
              <b class="dw"></b><b class="dw"></b><b class="dw"></b><b class="dw"></b>
              <b class="dw"></b><b class="dw"></b><b class="dw"></b><b class="dw"></b>
              <b class="dw"></b><b class="dw"></b>
            </div>
          </div>
          <div id="card1" class="card glass"><b>Joins</b>&nbsp;<span>GMeet, Zoom &amp; Teams</span></div>
          <div id="card2" class="card glass"><b>Talks</b>&nbsp;<span>&amp; presents slides live</span></div>
          <div id="card3" class="card glass"><b>Zero</b>&nbsp;<span>human intervention</span></div>

          <div id="end-wave" data-layout-allow-overlap>
            <b class="ew"></b><b class="ew"></b><b class="ew"></b><b class="ew"></b><b class="ew"></b>
            <b class="ew"></b><b class="ew"></b><b class="ew"></b><b class="ew"></b><b class="ew"></b>
            <b class="ew"></b><b class="ew"></b><b class="ew"></b><b class="ew"></b><b class="ew"></b>
            <b class="ew"></b><b class="ew"></b><b class="ew"></b><b class="ew"></b><b class="ew"></b>
          </div>
          <div id="end-mark" class="end-mark" data-layout-allow-overlap><img src="assets/brand/snapserve-mark-end.svg" alt="" /></div>
          <div id="end-word" class="end-word brand"><b>Snap</b><span>Serve</span> <i>AI</i></div>
          <div id="end-tag" class="end-tag">Your Autonomous AI Teammate.</div>
        </div>
      </section>

      <div class="grain"></div>
      <div class="vignette"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#win", { opacity: 0, scale: 0.78, y: 36 });
      gsap.set(["#host-who", "#ai-who", "#dots-pill"], { opacity: 0 });
      gsap.set("#headset", { opacity: 0, scale: 0.35 });
      gsap.set(["#room-meet", "#room-zoom", "#room-teams"], { opacity: 0, scale: 0.2, x: 0, y: 0 });
      gsap.set("#deck", { opacity: 0, scale: 0.86, y: 22 });
      gsap.set("#slide-b", { opacity: 0, x: 40 });
      gsap.set(["#card1", "#card2", "#card3"], { opacity: 0, scale: 0.84, y: 12 });
      gsap.set(["#end-wave", "#end-mark", "#end-word", "#end-tag"], { opacity: 0 });

      tl.from(".spot", { opacity: 0, duration: 0.7, ease: "power2.out" }, 0);
      tl.from(".grid", { opacity: 0, duration: 0.55, ease: "power2.out" }, 0.05);

      tl.to("#win", { opacity: 1, scale: 1, y: 0, duration: 0.62, ease: "back.out(1.65)" }, 0.16);
      tl.to("#host-who", { opacity: 1, duration: 0.18 }, 0.62);
      tl.to("#host-typed", { width: 760, duration: 1.85, ease: "steps(46)" }, 0.72);
      tl.to("#ai-who", { opacity: 1, duration: 0.16 }, 2.55);
      tl.to("#dots-pill", { opacity: 1, duration: 0.22 }, 2.62);
      document.querySelectorAll(".dot").forEach((dot, i) => {
        tl.to(dot, { y: -8, duration: 0.18, yoyo: true, repeat: 8, ease: "sine.inOut" }, 2.68 + i * 0.08);
      });

      tl.to(["#host-who", "#host-pill", "#ai-who", "#lights"], { opacity: 0, duration: 0.28, ease: "power2.in" }, 4.0);
      tl.to("#cam", { scale: 2.35, duration: 0.72, ease: "power3.inOut" }, 4.02);
      tl.to("#dots-pill", { scale: 1.35, duration: 0.4, ease: "power2.out" }, 4.15);
      document.querySelectorAll(".dot").forEach((dot, i) => {
        tl.to(dot, { scaleX: 2.4, scaleY: 0.7, duration: 0.28, ease: "power2.inOut", overwrite: "auto" }, 4.42 + i * 0.04);
      });
      tl.to("#dots-pill", { opacity: 0, scale: 0.4, duration: 0.28, ease: "power2.in" }, 4.78);
      tl.set("#dots-pill", { opacity: 0 }, 5.08);
      tl.to("#headset", { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.5)" }, 4.88);

      tl.to("#cam", { scale: 1, duration: 0.7, ease: "power3.inOut" }, 5.52);
      tl.to("#headset", { opacity: 0, scale: 0.55, duration: 0.28, ease: "power2.in" }, 5.58);
      tl.set("#headset", { opacity: 0 }, 5.88);
      tl.fromTo("#room-meet", { opacity: 0, scale: 0.2, x: 270, y: 0 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.48, ease: "back.out(1.4)" }, 5.62);
      tl.fromTo("#room-zoom", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.48, ease: "back.out(1.4)" }, 5.7);
      tl.fromTo("#room-teams", { opacity: 0, scale: 0.2, x: -270, y: 0 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.48, ease: "back.out(1.4)" }, 5.62);

      tl.to("#cam", { opacity: 0, y: -24, duration: 0.26, ease: "power2.in" }, 6.78);
      tl.set("#cam", { opacity: 0 }, 7.06);

      tl.to("#deck", { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "power3.out" }, 7.02);
      tl.to("#card1", { opacity: 1, scale: 1, y: 0, duration: 0.28, ease: "back.out(1.6)" }, 7.18);
      document.querySelectorAll(".dw").forEach((bar, i) => {
        const h = 16 + ((i * 29) % 48);
        gsap.set(bar, { height: h });
        tl.to(bar, { scaleY: 0.4 + ((i * 17) % 55) / 100, duration: 0.18, yoyo: true, repeat: 16, ease: "sine.inOut" }, 7.08 + (i % 5) * 0.025);
      });
      tl.to("#slide-a", { x: -28, opacity: 0, duration: 0.24, ease: "power2.in" }, 8.12);
      tl.to("#slide-b", { x: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, 8.16);
      tl.to("#card1", { opacity: 0, scale: 0.92, y: -10, duration: 0.16, ease: "power2.in" }, 8.35);
      tl.set("#card1", { opacity: 0 }, 8.52);
      tl.to("#card2", { opacity: 1, scale: 1, y: 0, duration: 0.26, ease: "back.out(1.6)" }, 8.5);
      tl.to("#card2", { opacity: 0, scale: 0.92, y: -10, duration: 0.16, ease: "power2.in" }, 9.55);
      tl.set("#card2", { opacity: 0 }, 9.72);
      tl.to("#card3", { opacity: 1, scale: 1, y: 0, duration: 0.26, ease: "back.out(1.6)" }, 9.7);

      tl.to("#deck", { opacity: 0, scale: 0.92, y: -16, duration: 0.22, ease: "power2.in" }, 10.82);
      tl.to("#card3", { opacity: 0, y: -10, duration: 0.18, ease: "power2.in" }, 10.82);
      tl.set(["#deck", "#card3"], { opacity: 0 }, 11.06);

      tl.to("#end-wave", { opacity: 1, duration: 0.28 }, 11.08);
      document.querySelectorAll(".ew").forEach((bar, i) => {
        const h = 20 + ((i * 37) % 90);
        gsap.set(bar, { height: h });
        tl.to(bar, { scaleY: 0.35 + ((i * 13) % 60) / 100, duration: 0.2, yoyo: true, repeat: 12, ease: "sine.inOut" }, 11.1 + (i % 6) * 0.03);
      });
      tl.fromTo("#end-mark", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.4)" }, 11.22);
      tl.fromTo("#end-word", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, 11.48);
      tl.fromTo("#end-tag", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, 11.68);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
