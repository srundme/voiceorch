<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Tex Gyre Heros";
        src: local("Tex Gyre Heros"), local("TeXGyreHeros"), local("Helvetica Neue"), local("Helvetica");
        font-weight: 400 700;
        font-style: normal;
      }

      :root {
        --bg: #050505;
        --white: #ffffff;
        --mist: #c8c8c8;
        --ink: #111111;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--white);
      }

      body {
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .brand { font-family: "Tex Gyre Heros", "Inter", sans-serif; }

      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        isolation: isolate;
        background: var(--bg);
      }

      .pool-a, .pool-b {
        position: absolute;
        border-radius: 50%;
        z-index: -5;
        pointer-events: none;
      }
      .pool-a {
        left: -120px;
        top: -80px;
        width: 720px;
        height: 720px;
        background: radial-gradient(circle, rgba(90, 90, 90, 0.28) 0%, transparent 68%);
      }
      .pool-b {
        right: -160px;
        bottom: -40px;
        width: 640px;
        height: 640px;
        background: radial-gradient(circle, rgba(55, 55, 55, 0.32) 0%, transparent 70%);
      }

      .sculpture {
        position: absolute;
        left: 90px;
        top: 140px;
        width: 900px;
        height: 900px;
        z-index: -4;
        opacity: 0.11;
        transform-origin: 50% 42%;
      }
      .sculpture img { width: 100%; height: 100%; display: block; }

      .haze {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 420px;
        z-index: -3;
        background: linear-gradient(to top, #000 0%, rgba(0,0,0,0.55) 42%, transparent 100%);
      }

      .horizon {
        position: absolute;
        left: 80px; right: 80px; top: 718px;
        height: 1px;
        z-index: -2;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: 70;
        pointer-events: none;
        opacity: 0.18;
        background-image: radial-gradient(circle, rgba(255,255,255,0.35) 0.6px, transparent 0.7px);
        background-size: 3px 3px;
      }

      .vignette {
        position: absolute;
        inset: 0;
        z-index: 80;
        box-shadow: inset 0 0 180px 50px #000;
        pointer-events: none;
      }

      section.clip, #world.clip { position: absolute; inset: 0; }
      .scene-inner { position: absolute; inset: 0; }

      .hero-mark {
        position: absolute;
        left: 390px;
        top: 300px;
        width: 300px;
        height: 300px;
      }
      .hero-mark img { width: 100%; height: 100%; display: block; }

      .capsule {
        position: absolute;
        background: #ffffff;
        color: var(--ink);
        border-radius: 999px;
        box-shadow: 0 18px 50px rgba(0,0,0,0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        white-space: nowrap;
      }

      #ask {
        left: 130px;
        top: 470px;
        width: 820px;
        height: 88px;
        font-size: 26px;
        justify-content: flex-start;
        padding: 0 36px;
      }
      #ask-typed {
        overflow: hidden;
        white-space: nowrap;
        width: 0;
      }

      #dots {
        left: 430px;
        top: 590px;
        width: 220px;
        height: 72px;
        gap: 14px;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #111111;
      }
      .dot.d2 { background: #4b4b4b; }
      .dot.d3 { background: #8a8a8a; }

      #orb {
        left: 160px;
        top: 400px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 22px 50px rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #orb img { width: 112px; height: 112px; display: block; }

      #speak {
        left: 420px;
        top: 468px;
        width: 500px;
        height: 84px;
        font-size: 28px;
      }

      .claim {
        position: absolute;
        left: 64px;
        top: 460px;
        width: 952px;
        text-align: center;
        font-size: 48px;
        font-weight: 800;
        letter-spacing: -1.3px;
        line-height: 1.15;
      }
      .claim .hi { color: #ffffff; }
      .claim .lo { color: var(--mist); }

      #chip {
        left: 300px;
        top: 470px;
        width: 240px;
        height: 72px;
        font-size: 22px;
        font-family: "JetBrains Mono", monospace;
      }
      #num {
        left: 560px;
        top: 470px;
        width: 200px;
        height: 72px;
        font-size: 26px;
        overflow: hidden;
      }
      #num .flip { height: 72px; line-height: 72px; }

      .rooms {
        position: absolute;
        left: 360px;
        top: 620px;
        width: 360px;
        display: flex;
        justify-content: space-between;
      }
      .rooms img { width: 44px; height: 44px; display: block; }

      .wave {
        position: absolute;
        left: 200px;
        top: 250px;
        width: 680px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .wave b {
        display: block;
        width: 8px;
        height: 24px;
        border-radius: 4px;
        background: #d0d0d0;
        transform-origin: center center;
      }

      .end-mark {
        position: absolute;
        left: 420px;
        top: 220px;
        width: 240px;
        height: 240px;
      }
      .end-mark img { width: 100%; height: 100%; display: block; }
      .end-word {
        position: absolute;
        left: 0;
        top: 480px;
        width: 1080px;
        text-align: center;
        font-size: 58px;
        letter-spacing: -1.4px;
      }
      .end-word b { font-weight: 700; }
      .end-word span { font-weight: 400; color: #b8b8b8; }
      .end-tag {
        position: absolute;
        left: 0;
        top: 570px;
        width: 1080px;
        text-align: center;
        font-size: 28px;
        color: var(--mist);
      }
      .end-url {
        position: absolute;
        left: 0;
        top: 860px;
        width: 1080px;
        text-align: center;
        font-size: 20px;
        letter-spacing: 0.24em;
        font-weight: 600;
        color: #d6d6d6;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1080">
      <div class="pool-a" data-layout-allow-overflow></div>
      <div class="pool-b" data-layout-allow-overflow></div>
      <div id="sculpture" class="sculpture"><img src="assets/brand/snapserve-mark.svg" alt="" /></div>
      <div class="haze"></div>
      <div class="horizon"></div>

      <audio id="music" class="clip" data-start="0" data-duration="25" data-track-index="0" data-volume="0.18" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>
      <audio id="sfx-open" class="clip" data-start="0.18" data-duration="1.48" data-track-index="8" data-volume="0.28" src="assets/sfx/impactBell_heavy_000.ogg"></audio>
      <audio id="sfx-ask" class="clip" data-start="2.35" data-duration="0.4" data-track-index="9" data-volume="0.24" src="assets/sfx/card-slide-1.ogg"></audio>
      <audio id="sfx-sit" class="clip" data-start="7.85" data-duration="0.12" data-track-index="10" data-volume="0.28" src="assets/sfx/drop_001.ogg"></audio>
      <audio id="sfx-talk" class="clip" data-start="8.55" data-duration="0.18" data-track-index="11" data-volume="0.26" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-next" class="clip" data-start="17.85" data-duration="0.5" data-track-index="12" data-volume="0.28" src="assets/sfx/switch_004.ogg"></audio>
      <audio id="sfx-end" class="clip" data-start="20.35" data-duration="1.48" data-track-index="13" data-volume="0.30" src="assets/sfx/impactBell_heavy_000.ogg"></audio>

      <div id="world" class="clip" data-start="0" data-duration="25" data-track-index="2"></div>

      <section id="film" class="clip" data-start="0" data-duration="25" data-track-index="1">
        <div id="stage" class="scene-inner">
          <div id="hero-mark" class="hero-mark"><img src="assets/brand/snapserve-mark-hero.svg" alt="SnapServe" /></div>

          <div id="ask" class="capsule">
            <div id="ask-typed" data-layout-allow-overflow>Join this Google Meet and present.</div>
          </div>
          <div id="dots" class="capsule">
            <span class="dot d1"></span>
            <span class="dot d2"></span>
            <span class="dot d3"></span>
          </div>

          <div id="orb"><img src="assets/brand/snapserve-agent-icon-ink.svg" alt="" /></div>
          <div id="speak" class="capsule">I’m on camera.</div>

          <div id="claim" class="claim"><span class="hi">Join</span> <span class="lo">Google Meet and Zoom.</span></div>
          <div class="rooms" id="mini-rooms">
            <img src="assets/brand/google-meet-logo.svg" alt="" />
            <img src="assets/brand/zoom-logo.svg" alt="" />
            <img src="assets/brand/teams-logo.svg" alt="" />
          </div>

          <div id="chip" class="capsule">next_slide</div>
          <div id="num" class="capsule" data-layout-allow-overflow>
            <div id="n1" class="flip" data-layout-allow-overflow data-layout-allow-occlusion>3 / 12</div>
            <div id="n2" class="flip" data-layout-allow-overflow data-layout-allow-occlusion>4 / 12</div>
          </div>

          <div id="wave" class="wave" data-layout-allow-overlap>
            <b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b>
            <b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b>
            <b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b>
            <b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b>
          </div>
          <div id="end-mark" class="end-mark" data-layout-allow-overlap><img src="assets/brand/snapserve-mark-end.svg" alt="" /></div>
          <div id="end-word" class="end-word brand"><b>Snap</b><span>Serve</span></div>
          <div id="end-tag" class="end-tag">Meeting agents. Live now.</div>
          <div id="end-url" class="end-url">APP.SNAPSERVE.AI</div>
        </div>
      </section>

      <div class="grain"></div>
      <div class="vignette"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#ask", { opacity: 0, scale: 0.72, y: 18 });
      gsap.set("#dots", { opacity: 0, scale: 0.6, y: 12 });
      gsap.set("#orb", { opacity: 0, scale: 0.55 });
      gsap.set("#speak", { opacity: 0, x: -28, scale: 0.9 });
      gsap.set("#claim", { opacity: 0, scale: 0.88, y: 12 });
      gsap.set("#mini-rooms", { opacity: 0, y: 10 });
      gsap.set("#chip", { opacity: 0, scale: 0.6 });
      gsap.set("#num", { opacity: 0, scale: 0.6 });
      gsap.set("#n2", { yPercent: 110 });
      gsap.set(["#wave", "#end-mark", "#end-word", "#end-tag", "#end-url"], { opacity: 0 });

      tl.to("#sculpture", { rotation: 10, duration: 25, ease: "none" }, 0);
      tl.from(".pool-a", { opacity: 0, duration: 1.2, ease: "power2.out" }, 0);
      tl.from(".pool-b", { opacity: 0, duration: 1.3, ease: "power2.out" }, 0.1);
      tl.from("#hero-mark", { opacity: 0, scale: 0.72, duration: 0.9, ease: "power3.out" }, 0.16);

      tl.to("#hero-mark", { opacity: 0, scale: 0.62, y: -24, duration: 0.38, ease: "power2.in" }, 2.05);
      tl.set("#hero-mark", { opacity: 0 }, 2.44);

      tl.to("#ask", { opacity: 1, scale: 1, y: 0, duration: 0.48, ease: "back.out(1.5)" }, 2.28);
      tl.to("#ask-typed", { width: 620, duration: 2.2, ease: "steps(32)" }, 2.55);
      tl.to("#ask", { y: -6, duration: 1.9, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.0);

      tl.to("#dots", { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "back.out(1.8)" }, 5.15);
      document.querySelectorAll(".dot").forEach((dot, i) => {
        tl.to(dot, { y: -8, duration: 0.2, yoyo: true, repeat: 7, ease: "sine.inOut" }, 5.22 + i * 0.09);
      });

      tl.to("#ask", { opacity: 0, scale: 0.82, y: -16, duration: 0.28, ease: "power2.in", overwrite: "auto" }, 7.15);
      tl.to("#dots", { opacity: 0, scale: 0.7, y: -10, duration: 0.24, ease: "power2.in" }, 7.2);
      tl.set("#ask", { opacity: 0 }, 7.44);
      tl.set("#dots", { opacity: 0 }, 7.46);

      tl.to("#orb", { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 7.42);
      tl.to("#orb", { y: -8, duration: 2.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 8.0);
      tl.to("#speak", { opacity: 1, x: 0, scale: 1, duration: 0.42, ease: "power3.out" }, 8.05);

      tl.to("#orb", { opacity: 0, scale: 0.78, duration: 0.28, ease: "power2.in" }, 11.55);
      tl.to("#speak", { opacity: 0, x: 16, duration: 0.26, ease: "power2.in" }, 11.58);
      tl.set("#orb", { opacity: 0 }, 11.84);
      tl.set("#speak", { opacity: 0 }, 11.86);

      tl.to("#claim", { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, 11.78);
      tl.to("#mini-rooms", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 12.15);

      tl.to("#claim", { opacity: 0, y: -16, scale: 0.94, duration: 0.28, ease: "power2.in" }, 15.15);
      tl.to("#mini-rooms", { opacity: 0, y: -8, duration: 0.22 }, 15.18);
      tl.set("#claim", { opacity: 0 }, 15.44);
      tl.set("#mini-rooms", { opacity: 0 }, 15.42);

      tl.to("#chip", { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.7)" }, 15.36);
      tl.to("#num", { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.7)" }, 15.5);
      tl.to("#chip", { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.inOut" }, 17.82);
      tl.to("#n1", { yPercent: -110, duration: 0.24, ease: "power2.in" }, 17.88);
      tl.to("#n2", { yPercent: 0, duration: 0.28, ease: "power3.out" }, 17.92);

      tl.to("#chip", { opacity: 0, scale: 0.8, y: -12, duration: 0.26, ease: "power2.in" }, 19.85);
      tl.to("#num", { opacity: 0, scale: 0.8, y: -12, duration: 0.26, ease: "power2.in" }, 19.9);
      tl.set("#chip", { opacity: 0 }, 20.12);
      tl.set("#num", { opacity: 0 }, 20.16);

      tl.to("#wave", { opacity: 1, duration: 0.35 }, 20.2);
      tl.fromTo("#end-mark", { opacity: 0, scale: 0.78 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 20.28);
      tl.to("#end-word", { opacity: 1, duration: 0.36 }, 20.62);
      tl.to("#end-tag", { opacity: 1, duration: 0.32 }, 20.86);
      tl.to("#end-url", { opacity: 1, duration: 0.28 }, 21.1);
      document.querySelectorAll(".wb").forEach((bar, i) => {
        const h = 14 + ((i * 37) % 72);
        gsap.set(bar, { height: h });
        tl.to(bar, { scaleY: 0.4 + ((i * 13) % 55) / 100, duration: 0.26, yoyo: true, repeat: 12, ease: "sine.inOut" }, 20.25 + (i % 6) * 0.035);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
