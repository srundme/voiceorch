<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Tex Gyre Heros";
        src: local("Tex Gyre Heros"), local("TeXGyreHeros"), local("Helvetica Neue"), local("Helvetica");
        font-weight: 400 700;
        font-style: normal;
      }

      :root {
        --bg: #050505;
        --char: #18181b;
        --ti: #d4d4d8;
        --ink: #111111;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: #ffffff;
      }

      body {
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .brand { font-family: "Tex Gyre Heros", "Inter", sans-serif; }

      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        isolation: isolate;
        background: var(--bg);
      }

      .spot {
        position: absolute;
        left: 140px;
        top: 40px;
        width: 800px;
        height: 800px;
        z-index: -5;
        pointer-events: none;
        background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 64%);
      }

      .grid {
        position: absolute;
        inset: 0;
        z-index: -4;
        background-image:
          linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
        background-size: 48px 48px;
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: 70;
        pointer-events: none;
        opacity: 0.14;
        background-image: radial-gradient(circle, rgba(255,255,255,0.3) 0.55px, transparent 0.7px);
        background-size: 3px 3px;
      }

      .vignette {
        position: absolute;
        inset: 0;
        z-index: 80;
        box-shadow: inset 0 0 160px 48px #000;
        pointer-events: none;
      }

      section.clip, #world.clip { position: absolute; inset: 0; }
      .scene-inner, .stack { position: absolute; inset: 0; }

      .glass {
        background: linear-gradient(180deg, #2a2a2e 0%, #18181b 100%);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      }

      #win {
        position: absolute;
        left: 90px;
        top: 110px;
        width: 900px;
        height: 640px;
        border-radius: 32px;
      }

      .who {
        position: absolute;
        left: 36px;
        top: 22px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--ti);
      }

      #ask {
        position: absolute;
        left: 36px;
        top: 46px;
        width: 828px;
        height: 72px;
        border-radius: 20px;
        background: #2c2c31;
        border: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        padding: 0 28px;
      }
      #ask-typed {
        overflow: hidden;
        white-space: nowrap;
        width: 0;
        font-size: 26px;
        font-weight: 650;
      }

      .seat {
        position: absolute;
        width: 400px;
        height: 220px;
        border-radius: 24px;
        background: #101012;
        border: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .seat img { width: 88px; height: 88px; display: block; }
      #s1 { left: 36px; top: 140px; }
      #s2 { left: 464px; top: 140px; }
      #s3 { left: 36px; top: 380px; }
      #s4 { left: 464px; top: 380px; }

      #chair {
        position: absolute;
        left: 710px;
        top: 556px;
        width: 88px;
        height: 88px;
      }
      #chair img { width: 100%; height: 100%; display: block; }

      #dots {
        position: absolute;
        left: 674px;
        top: 568px;
        width: 160px;
        height: 64px;
        border-radius: 999px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #111111;
      }
      .dot.d2 { background: #4b4b4b; }
      .dot.d3 { background: #8a8a8a; }

      #orb {
        position: absolute;
        left: 658px;
        top: 504px;
        width: 192px;
        height: 192px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 22px 50px rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #orb img { width: 112px; height: 112px; display: block; }

      #speak {
        position: absolute;
        left: 90px;
        top: 780px;
        width: 900px;
        height: 80px;
        border-radius: 999px;
        background: #ffffff;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 750;
      }

      #chip {
        position: absolute;
        left: 200px;
        top: 470px;
        width: 300px;
        height: 88px;
        border-radius: 999px;
        background: #ffffff;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
      }
      #num {
        position: absolute;
        left: 540px;
        top: 470px;
        width: 340px;
        height: 88px;
        border-radius: 999px;
        background: #ffffff;
        color: var(--ink);
        overflow: hidden;
        font-size: 36px;
        font-weight: 800;
      }
      #num .flip { height: 88px; line-height: 88px; text-align: center; }

      .claim {
        position: absolute;
        left: 64px;
        width: 952px;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -1.4px;
      }
      #c1 { top: 280px; }
      #c2 { top: 380px; }
      #c3 { top: 480px; }
      .claim .hi { color: #ffffff; }
      .claim .lo { color: var(--ti); }

      .rooms {
        position: absolute;
        left: 64px;
        top: 620px;
        width: 260px;
        display: flex;
        justify-content: space-between;
      }
      .rooms img { width: 48px; height: 48px; display: block; }

      .end-mark {
        position: absolute;
        left: 420px;
        top: 220px;
        width: 240px;
        height: 240px;
      }
      .end-mark img { width: 100%; height: 100%; display: block; }
      .end-word {
        position: absolute;
        left: 0;
        top: 500px;
        width: 1080px;
        text-align: center;
        font-size: 58px;
        letter-spacing: -1.4px;
      }
      .end-word b { font-weight: 700; }
      .end-word span { font-weight: 400; color: #c8c8c8; }
      .end-tag {
        position: absolute;
        left: 80px;
        top: 590px;
        width: 920px;
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        color: var(--ti);
      }

      #wave {
        position: absolute;
        left: 180px;
        top: 230px;
        width: 720px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      #wave b {
        display: block;
        width: 8px;
        height: 20px;
        border-radius: 4px;
        background: #d4d4d8;
        transform-origin: center center;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1080" data-height="1080">
      <div class="spot" data-layout-allow-overflow></div>
      <div class="grid"></div>

      <audio id="music" class="clip" data-start="0" data-duration="24" data-track-index="0" data-volume="0.18" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>
      <audio id="sfx-in" class="clip" data-start="0.2" data-duration="0.4" data-track-index="8" data-volume="0.24" src="assets/sfx/card-slide-1.ogg"></audio>
      <audio id="sfx-sit" class="clip" data-start="7.7" data-duration="0.12" data-track-index="9" data-volume="0.28" src="assets/sfx/drop_001.ogg"></audio>
      <audio id="sfx-talk" class="clip" data-start="8.4" data-duration="0.18" data-track-index="10" data-volume="0.26" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-flip" class="clip" data-start="13.2" data-duration="0.5" data-track-index="11" data-volume="0.26" src="assets/sfx/switch_004.ogg"></audio>
      <audio id="sfx-end" class="clip" data-start="19.9" data-duration="1.48" data-track-index="12" data-volume="0.28" src="assets/sfx/impactBell_heavy_000.ogg"></audio>

      <div id="world" class="clip" data-start="0" data-duration="24" data-track-index="2"></div>

      <section id="film" class="clip" data-start="0" data-duration="24" data-track-index="1">
        <div id="stage" class="scene-inner">
          <div id="meet" class="stack">
            <div id="win" class="glass">
              <div class="who">HOST</div>
              <div id="ask">
                <div id="ask-typed" data-layout-allow-overflow>Who’s presenting?</div>
              </div>
              <div id="s1" class="seat"><img src="assets/brand/person-a.svg" alt="" /></div>
              <div id="s2" class="seat"><img src="assets/brand/person-b.svg" alt="" /></div>
              <div id="s3" class="seat"><img src="assets/brand/person-c.svg" alt="" /></div>
              <div id="s4" class="seat"></div>
            </div>
            <div id="chair"><img src="assets/brand/empty-chair.svg" alt="" /></div>
            <div id="dots">
              <span class="dot d1"></span>
              <span class="dot d2"></span>
              <span class="dot d3"></span>
            </div>
            <div id="orb"><img src="assets/brand/presenter-agent.svg" alt="" /></div>
            <div id="speak">I’m in.</div>
          </div>

          <div id="present" class="stack">
            <div id="chip">next_slide</div>
            <div id="num" data-layout-allow-overflow>
              <div id="n1" class="flip" data-layout-allow-overflow data-layout-allow-occlusion>3 / 12</div>
              <div id="n2" class="flip" data-layout-allow-overflow data-layout-allow-occlusion>4 / 12</div>
            </div>
          </div>

          <div id="claims" class="stack">
            <div id="c1" class="claim"><span class="hi">Joins</span> <span class="lo">the room.</span></div>
            <div id="c2" class="claim"><span class="hi">Talks</span> <span class="lo">on camera.</span></div>
            <div id="c3" class="claim"><span class="hi">Presents</span> <span class="lo">the deck.</span></div>
            <div class="rooms" id="rooms">
              <img src="assets/brand/meet-mono.svg" alt="" />
              <img src="assets/brand/zoom-mono.svg" alt="" />
              <img src="assets/brand/teams-mono.svg" alt="" />
            </div>
          </div>

          <div id="end" class="stack">
            <div id="wave" data-layout-allow-overlap>
              <b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b>
              <b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b>
              <b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b>
              <b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b><b class="wb"></b>
            </div>
            <div id="end-mark" class="end-mark" data-layout-allow-overlap><img src="assets/brand/snapserve-mark-end.svg" alt="" /></div>
            <div id="end-word" class="end-word brand"><b>Snap</b><span>Serve</span></div>
            <div id="end-tag" class="end-tag">The teammate who takes the empty seat.</div>
          </div>
        </div>
      </section>

      <div class="grain"></div>
      <div class="vignette"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#win", { opacity: 0, scale: 0.86, y: 28 });
      gsap.set(["#s1", "#s2", "#s3", "#s4", "#chair"], { opacity: 0, scale: 0.9 });
      gsap.set("#dots", { opacity: 0, scale: 0.6 });
      gsap.set("#orb", { opacity: 0, scale: 0.4 });
      gsap.set("#speak", { opacity: 0, y: 12 });
      gsap.set("#present", { opacity: 0 });
      gsap.set("#n2", { yPercent: 110 });
      gsap.set("#claims", { opacity: 0 });
      gsap.set(["#c1", "#c2", "#c3", "#rooms"], { opacity: 0, x: 0 });
      gsap.set("#end", { opacity: 0 });

      tl.from(".spot", { opacity: 0, duration: 0.8, ease: "power2.out" }, 0);
      tl.from(".grid", { opacity: 0, duration: 0.7, ease: "power2.out" }, 0.06);
      tl.to("#win", { opacity: 1, scale: 1, y: 0, duration: 0.62, ease: "back.out(1.5)" }, 0.18);
      tl.to("#s1", { opacity: 1, scale: 1, duration: 0.36, ease: "power3.out" }, 0.55);
      tl.to("#s2", { opacity: 1, scale: 1, duration: 0.36, ease: "power3.out" }, 0.66);
      tl.to("#s3", { opacity: 1, scale: 1, duration: 0.36, ease: "power3.out" }, 0.77);
      tl.to("#s4", { opacity: 1, scale: 1, duration: 0.36, ease: "power3.out" }, 0.88);
      tl.to("#chair", { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" }, 0.96);
      tl.to("#ask-typed", { width: 320, duration: 1.35, ease: "steps(18)" }, 1.15);

      tl.to("#dots", { opacity: 1, scale: 1, duration: 0.38, ease: "back.out(1.7)" }, 3.15);
      document.querySelectorAll(".dot").forEach((dot, i) => {
        tl.to(dot, { y: -8, duration: 0.18, yoyo: true, repeat: 10, ease: "sine.inOut" }, 3.22 + i * 0.08);
      });
      document.querySelectorAll(".dot").forEach((dot, i) => {
        tl.to(dot, { scaleX: 2.2, scaleY: 0.7, duration: 0.24, ease: "power2.inOut", overwrite: "auto" }, 6.55 + i * 0.05);
      });
      tl.to("#chair", { opacity: 0, scale: 0.8, duration: 0.22 }, 6.7);
      tl.to("#dots", { opacity: 0, scale: 0.45, duration: 0.24, ease: "power2.in" }, 7.05);
      tl.set("#dots", { opacity: 0 }, 7.32);
      tl.to("#orb", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.55)" }, 7.15);
      tl.to("#speak", { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 8.35);

      tl.to("#meet", { opacity: 0, y: -28, duration: 0.3, ease: "power2.in" }, 10.55);
      tl.set("#meet", { opacity: 0 }, 10.88);

      tl.set("#present", { opacity: 1 }, 10.9);
      tl.fromTo("#chip", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 10.92);
      tl.fromTo("#num", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 11.06);
      tl.to("#chip", { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.inOut" }, 13.14);
      tl.to("#n1", { yPercent: -110, duration: 0.24, ease: "power2.in" }, 13.2);
      tl.to("#n2", { yPercent: 0, duration: 0.28, ease: "power3.out" }, 13.24);

      tl.to("#present", { opacity: 0, y: -16, duration: 0.24, ease: "power2.in" }, 15.15);
      tl.set("#present", { opacity: 0 }, 15.42);

      tl.set("#claims", { opacity: 1 }, 15.44);
      tl.fromTo("#c1", { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 15.46);
      tl.fromTo("#c2", { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 16.35);
      tl.fromTo("#c3", { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 17.24);
      tl.fromTo("#rooms", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 17.7);

      tl.to("#claims", { opacity: 0, y: -20, duration: 0.24, ease: "power2.in" }, 19.55);
      tl.set("#claims", { opacity: 0 }, 19.82);

      tl.set("#end", { opacity: 1 }, 19.84);
      tl.to("#wave", { opacity: 1, duration: 0.28 }, 19.88);
      tl.fromTo("#end-mark", { opacity: 0, scale: 0.74 }, { opacity: 1, scale: 1, duration: 0.48, ease: "power3.out" }, 19.95);
      tl.fromTo("#end-word", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 20.28);
      tl.fromTo("#end-tag", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, 20.5);
      document.querySelectorAll(".wb").forEach((bar, i) => {
        const h = 16 + ((i * 37) % 72);
        gsap.set(bar, { height: h });
        tl.to(bar, { scaleY: 0.4 + ((i * 13) % 55) / 100, duration: 0.24, yoyo: true, repeat: 12, ease: "sine.inOut" }, 19.9 + (i % 6) * 0.03);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
