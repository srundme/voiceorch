<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Tex Gyre Heros";
        src: local("Tex Gyre Heros"), local("TeXGyreHeros"), local("Helvetica Neue"), local("Helvetica");
        font-weight: 400 700;
        font-style: normal;
      }

      :root {
        --bg: #0a0a0b;
        --char: #1c1c1e;
        --metal: #c7c7cc;
        --white: #ffffff;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--white);
      }

      body {
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .brand { font-family: "Tex Gyre Heros", "Inter", sans-serif; }

      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        isolation: isolate;
        background: var(--bg);
      }

      .pool-a, .pool-b {
        position: absolute;
        border-radius: 50%;
        z-index: -5;
        pointer-events: none;
      }
      .pool-a {
        left: -80px;
        top: -60px;
        width: 620px;
        height: 620px;
        background: radial-gradient(circle, rgba(58, 58, 60, 0.45) 0%, transparent 68%);
      }
      .pool-b {
        right: -120px;
        bottom: -20px;
        width: 560px;
        height: 560px;
        background: radial-gradient(circle, rgba(44, 44, 46, 0.5) 0%, transparent 70%);
      }

      .grid {
        position: absolute;
        inset: 0;
        z-index: -4;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 80px 80px;
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: 70;
        pointer-events: none;
        opacity: 0.14;
        background-image: radial-gradient(circle, rgba(255,255,255,0.32) 0.55px, transparent 0.7px);
        background-size: 3px 3px;
      }

      .vignette {
        position: absolute;
        inset: 0;
        z-index: 80;
        box-shadow: inset 0 0 160px 48px #000;
        pointer-events: none;
      }

      section.clip, #world.clip { position: absolute; inset: 0; }
      .scene-inner, .stack { position: absolute; inset: 0; }

      .glass {
        background: linear-gradient(180deg, #2a2a2c 0%, #1c1c1e 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
      }

      #browser {
        position: absolute;
        left: 80px;
        top: 360px;
        width: 920px;
        height: 248px;
        border-radius: 28px;
      }
      .chrome {
        position: absolute;
        left: 28px;
        top: 22px;
        height: 28px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .chrome img { width: 28px; height: 28px; display: block; }
      .chrome span {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--metal);
      }
      #typed-wrap {
        position: absolute;
        left: 36px;
        top: 88px;
        width: 848px;
        height: 120px;
        display: flex;
        align-items: center;
      }
      #typed {
        overflow: hidden;
        white-space: nowrap;
        width: 0;
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -0.4px;
        color: var(--white);
      }

      .logo-slot {
        position: absolute;
        top: 390px;
        width: 120px;
        height: 120px;
        border-radius: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-slot img { width: 72px; height: 72px; display: block; }
      #logo-meet { left: 210px; }
      #logo-zoom { left: 480px; }
      #logo-teams { left: 750px; }

      #node {
        position: absolute;
        left: 360px;
        top: 330px;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #node-wave {
        width: 220px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      #node-wave b, #deck-wave b {
        display: block;
        width: 8px;
        height: 20px;
        border-radius: 4px;
        background: #ffffff;
        transform-origin: center center;
      }

      .line {
        position: absolute;
        left: 64px;
        width: 952px;
        text-align: center;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.8px;
      }
      #line-join { top: 760px; }
      #line-talk { top: 860px; }

      #deck {
        position: absolute;
        left: 90px;
        top: 220px;
        width: 900px;
        height: 560px;
        border-radius: 32px;
        overflow: hidden;
      }
      .slide {
        position: absolute;
        left: 40px;
        top: 40px;
        width: 520px;
        height: 480px;
        border-radius: 24px;
        background: #141416;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 36px 40px;
      }
      .slide .kicker {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: var(--metal);
      }
      .slide .num {
        margin-top: 18px;
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -3px;
        line-height: 1;
      }
      .bar {
        margin-top: 22px;
        height: 16px;
        border-radius: 8px;
        background: #3a3a3c;
      }
      .bar.w2 { width: 78%; }
      .bar.w3 { width: 64%; }
      .bar.w4 { width: 86%; }

      #deck-wave {
        position: absolute;
        left: 600px;
        top: 170px;
        width: 250px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .pop {
        position: absolute;
        left: 64px;
        width: 952px;
        text-align: center;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -2px;
      }
      #p1 { top: 300px; }
      #p2 { top: 400px; }
      #p3 { top: 500px; }

      .end-mark {
        position: absolute;
        left: 420px;
        top: 250px;
        width: 240px;
        height: 240px;
      }
      .end-mark img { width: 100%; height: 100%; display: block; }
      .end-word {
        position: absolute;
        left: 0;
        top: 520px;
        width: 1080px;
        text-align: center;
        font-size: 58px;
        letter-spacing: -1.4px;
      }
      .end-word b { font-weight: 700; }
      .end-word span { font-weight: 400; }
      .end-word i {
        font-style: normal;
        font-family: "Inter", sans-serif;
        font-weight: 650;
        color: var(--metal);
      }
      .end-tag {
        position: absolute;
        left: 80px;
        top: 610px;
        width: 920px;
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        color: var(--metal);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1080">
      <div class="pool-a" data-layout-allow-overflow></div>
      <div class="pool-b" data-layout-allow-overflow></div>
      <div class="grid"></div>

      <audio id="music" class="clip" data-start="0" data-duration="12" data-track-index="0" data-volume="0.18" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>
      <audio id="sfx-in" class="clip" data-start="0.16" data-duration="0.4" data-track-index="8" data-volume="0.26" src="assets/sfx/card-slide-1.ogg"></audio>
      <audio id="sfx-merge" class="clip" data-start="3.85" data-duration="0.12" data-track-index="9" data-volume="0.28" src="assets/sfx/drop_001.ogg"></audio>
      <audio id="sfx-talk" class="clip" data-start="6.2" data-duration="0.18" data-track-index="10" data-volume="0.26" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-flip" class="clip" data-start="7.55" data-duration="0.5" data-track-index="11" data-volume="0.26" src="assets/sfx/switch_004.ogg"></audio>
      <audio id="sfx-end" class="clip" data-start="10.15" data-duration="1.48" data-track-index="12" data-volume="0.28" src="assets/sfx/impactBell_heavy_000.ogg"></audio>

      <div id="world" class="clip" data-start="0" data-duration="12" data-track-index="2"></div>

      <section id="film" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div id="stage" class="scene-inner">
          <div id="browser" class="glass">
            <div class="chrome">
              <img src="assets/brand/snapserve-mark-chrome.svg" alt="" />
              <span>APP.SNAPSERVE.AI</span>
            </div>
            <div id="typed-wrap">
              <div id="typed" data-layout-allow-overflow>SnapServe AI: Join meeting &amp; present deck.</div>
            </div>
          </div>

          <div id="logo-meet" class="logo-slot glass"><img src="assets/brand/meet-mono.svg" alt="" /></div>
          <div id="logo-zoom" class="logo-slot glass"><img src="assets/brand/zoom-mono.svg" alt="" /></div>
          <div id="logo-teams" class="logo-slot glass"><img src="assets/brand/teams-mono.svg" alt="" /></div>

          <div id="node" class="glass">
            <div id="node-wave" data-layout-allow-overlap>
              <b class="nw"></b><b class="nw"></b><b class="nw"></b><b class="nw"></b>
              <b class="nw"></b><b class="nw"></b><b class="nw"></b><b class="nw"></b>
              <b class="nw"></b><b class="nw"></b><b class="nw"></b><b class="nw"></b>
            </div>
          </div>
          <div id="line-join" class="line">Joins GMeet, Zoom &amp; Teams.</div>

          <div id="deck" class="glass">
            <div id="slide-a" class="slide" data-layout-allow-overlap>
              <div class="kicker">DECK</div>
              <div class="num">03</div>
              <div class="bar w2"></div>
              <div class="bar w3"></div>
              <div class="bar w4"></div>
            </div>
            <div id="slide-b" class="slide" data-layout-allow-overlap>
              <div class="kicker">DECK</div>
              <div class="num">04</div>
              <div class="bar w4"></div>
              <div class="bar w2"></div>
              <div class="bar w3"></div>
            </div>
            <div id="deck-wave" data-layout-allow-overlap>
              <b class="dw"></b><b class="dw"></b><b class="dw"></b><b class="dw"></b>
              <b class="dw"></b><b class="dw"></b><b class="dw"></b><b class="dw"></b>
              <b class="dw"></b><b class="dw"></b>
            </div>
          </div>
          <div id="line-talk" class="line">Talks &amp; presents in real-time.</div>

          <div id="p1" class="pop">JOINS.</div>
          <div id="p2" class="pop">TALKS.</div>
          <div id="p3" class="pop">PRESENTS.</div>

          <div id="end-mark" class="end-mark"><img src="assets/brand/snapserve-mark-end.svg" alt="" /></div>
          <div id="end-word" class="end-word brand"><b>Snap</b><span>Serve</span> <i>AI</i></div>
          <div id="end-tag" class="end-tag">Your AI Teammate in Every Call.</div>
        </div>
      </section>

      <div class="grain"></div>
      <div class="vignette"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#browser", { opacity: 0, scale: 0.72, y: 46 });
      gsap.set(["#logo-meet", "#logo-zoom", "#logo-teams"], { opacity: 0, scale: 0.7, y: 18 });
      gsap.set("#node", { opacity: 0, scale: 0.28 });
      gsap.set("#line-join", { opacity: 0, y: 12 });
      gsap.set("#deck", { opacity: 0, scale: 0.78 });
      gsap.set("#slide-b", { opacity: 0, x: 48 });
      gsap.set("#line-talk", { opacity: 0, y: 10 });
      gsap.set(["#p1", "#p2", "#p3"], { opacity: 0, scale: 0.62 });
      gsap.set(["#end-mark", "#end-word", "#end-tag"], { opacity: 0 });

      tl.from(".pool-a", { opacity: 0, duration: 0.7, ease: "power2.out" }, 0);
      tl.from(".pool-b", { opacity: 0, duration: 0.8, ease: "power2.out" }, 0.06);
      tl.from(".grid", { opacity: 0, duration: 0.6, ease: "power2.out" }, 0.04);

      tl.to("#browser", { opacity: 1, scale: 1, y: 0, duration: 0.72, ease: "back.out(1.7)" }, 0.16);
      tl.to("#typed", { width: 820, duration: 1.7, ease: "steps(42)" }, 0.78);

      tl.to("#browser", { opacity: 0, scale: 0.9, y: -28, duration: 0.28, ease: "power2.in" }, 2.78);
      tl.set("#browser", { opacity: 0 }, 3.08);

      tl.to("#logo-meet", { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "back.out(1.6)" }, 3.02);
      tl.to("#logo-zoom", { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "back.out(1.6)" }, 3.12);
      tl.to("#logo-teams", { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "back.out(1.6)" }, 3.22);

      tl.to("#logo-meet", { x: 270, y: 0, scale: 0.35, opacity: 0, duration: 0.55, ease: "power3.in" }, 3.85);
      tl.to("#logo-zoom", { scale: 0.28, opacity: 0, duration: 0.5, ease: "power3.in" }, 3.88);
      tl.to("#logo-teams", { x: -270, y: 0, scale: 0.35, opacity: 0, duration: 0.55, ease: "power3.in" }, 3.85);
      tl.set(["#logo-meet", "#logo-zoom", "#logo-teams"], { opacity: 0 }, 4.42);

      tl.to("#node", { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, 4.05);
      tl.to("#node", { scale: 1.06, duration: 0.42, yoyo: true, repeat: 2, ease: "sine.inOut" }, 4.62);
      tl.to("#line-join", { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 4.55);
      document.querySelectorAll(".nw").forEach((bar, i) => {
        const h = 16 + ((i * 31) % 64);
        gsap.set(bar, { height: h });
        tl.to(bar, { scaleY: 0.35 + ((i * 17) % 60) / 100, duration: 0.2, yoyo: true, repeat: 8, ease: "sine.inOut" }, 4.1 + (i % 5) * 0.03);
      });

      tl.to("#line-join", { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" }, 5.88);
      tl.to("#node", { scale: 1.55, opacity: 0, duration: 0.32, ease: "power2.in", overwrite: "auto" }, 5.9);
      tl.set("#node", { opacity: 0 }, 6.24);
      tl.set("#line-join", { opacity: 0 }, 6.1);

      tl.to("#deck", { opacity: 1, scale: 1, duration: 0.48, ease: "power3.out" }, 6.12);
      tl.to("#line-talk", { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 6.4);
      document.querySelectorAll(".dw").forEach((bar, i) => {
        const h = 22 + ((i * 37) % 90);
        gsap.set(bar, { height: h });
        tl.to(bar, { scaleY: 0.4 + ((i * 13) % 55) / 100, duration: 0.18, yoyo: true, repeat: 12, ease: "sine.inOut" }, 6.2 + (i % 4) * 0.03);
      });
      tl.to("#slide-a", { x: -36, opacity: 0, duration: 0.28, ease: "power2.in" }, 7.52);
      tl.to("#slide-b", { x: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 7.56);

      tl.to("#deck", { opacity: 0, scale: 0.92, y: -20, duration: 0.24, ease: "power2.in" }, 8.78);
      tl.to("#line-talk", { opacity: 0, y: -8, duration: 0.2, ease: "power2.in" }, 8.78);
      tl.set("#deck", { opacity: 0 }, 9.04);
      tl.set("#line-talk", { opacity: 0 }, 9.0);

      tl.to("#p1", { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.8)" }, 9.02);
      tl.to("#p2", { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.8)" }, 9.22);
      tl.to("#p3", { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.8)" }, 9.42);
      tl.to(["#p1", "#p2", "#p3"], { opacity: 0, scale: 0.9, y: -16, duration: 0.22, ease: "power2.in" }, 10.12);
      tl.set(["#p1", "#p2", "#p3"], { opacity: 0 }, 10.36);

      tl.fromTo("#end-mark", { opacity: 0, scale: 0.74 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, 10.18);
      tl.fromTo("#end-word", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 10.4);
      tl.fromTo("#end-tag", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, 10.58);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
