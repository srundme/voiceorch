<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" role="img" aria-label="SnapServe agent presenting slides in Google Meet">
  <title>SnapServe agent presenting slides in Google Meet</title>
  <defs>
    <style>
      .ui    { font-family: 'Inter', 'Google Sans', Helvetica, Arial, sans-serif; }
      .code  { font-size: 18px; fill: #E8EAED; }
      .meta  { font-size: 16px; fill: #9AA0A6; }
      .name  { font-size: 17px; fill: #FFFFFF; font-weight: 500; }
      .agn   { font-size: 17px; fill: #FFFFFF; font-weight: 700; }
      .pill  { font-size: 14px; fill: #202124; font-weight: 700; }
      .cap   { font-size: 19px; fill: #E8EAED; }
      .sTtl  { font-size: 58px; fill: #0F172A; font-weight: 700; letter-spacing: -1.2px; }
      .sBul  { font-size: 30px; fill: #334155; }
      .sFoot { font-size: 20px; fill: #94A3B8; }
      .sKick { font-size: 20px; fill: #64748B; font-weight: 700; letter-spacing: 2.2px; }
      .rail  { font-size: 15px; fill: #9AA0A6; }
      .railS { font-size: 16px; fill: #E8EAED; font-weight: 600; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#202124"/>

  <!-- top bar -->
  <text x="48" y="52" class="ui code">Product demo &#8212; SnapServe</text>
  <text x="48" y="80" class="ui meta">meet.google.com/abc-defg-hij</text>

  <!-- presenting banner -->
  <rect x="640" y="28" width="470" height="40" rx="20" fill="#8AB4F8"/>
  <g transform="translate(666,38)">
    <rect width="20" height="15" rx="3" fill="none" stroke="#202124" stroke-width="2.2"/>
    <path d="M7 19h6" stroke="#202124" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="700" y="54" class="ui pill">SnapServe Agent is presenting</text>

  <!-- ===== shared screen: the deck ===== -->
  <rect x="48" y="120" width="1400" height="780" rx="14" fill="#FFFFFF"/>

  <!-- slide brand -->
  <g transform="translate(120,180) scale(0.30)">
    <rect x="6"  y="14" width="88" height="20" rx="10" fill="#0F172A"/>
    <rect x="14" y="42" width="72" height="20" rx="10" fill="#0F172A" opacity="0.60"/>
    <rect x="22" y="70" width="56" height="20" rx="10" fill="#0F172A" opacity="0.36"/>
  </g>
  <text x="152" y="208" class="ui" font-size="22" fill="#0F172A"><tspan font-weight="700">Snap</tspan><tspan font-weight="400">Serve</tspan></text>

  <text x="120" y="286" class="ui sKick">WHY VOICE AGENTS</text>

  <text x="120" y="372" class="ui sTtl">AI agents that join</text>
  <text x="120" y="440" class="ui sTtl">your meetings.</text>

  <g>
    <circle cx="132" cy="530" r="7" fill="#0F172A"/>
    <text x="164" y="539" class="ui sBul">Joins Google Meet, Zoom and Teams</text>

    <circle cx="132" cy="600" r="7" fill="#0F172A" opacity="0.6"/>
    <text x="164" y="609" class="ui sBul">Speaks, listens and answers live</text>

    <circle cx="132" cy="670" r="7" fill="#0F172A" opacity="0.36"/>
    <text x="164" y="679" class="ui sBul">Books the follow-up before the call ends</text>
  </g>

  <!-- slide chart accent -->
  <g transform="translate(1000,470)">
    <rect x="0"   y="120" width="46" height="90"  rx="10" fill="#0F172A" opacity="0.20"/>
    <rect x="70"  y="72"  width="46" height="138" rx="10" fill="#0F172A" opacity="0.42"/>
    <rect x="140" y="30"  width="46" height="180" rx="10" fill="#0F172A" opacity="0.68"/>
    <rect x="210" y="0"   width="46" height="210" rx="10" fill="#0F172A"/>
  </g>

  <line x1="120" y1="800" x2="1376" y2="800" stroke="#E2E8F0" stroke-width="2"/>
  <text x="120" y="842" class="ui sFoot">app.snapserve.ai</text>
  <text x="1376" y="842" class="ui sFoot" text-anchor="end">3 / 12</text>

  <!-- ===== right rail: participants ===== -->
  <!-- Karthik -->
  <rect x="1480" y="120" width="392" height="240" rx="12" fill="#3C4043"/>
  <circle cx="1676" cy="228" r="52" fill="#5F6368"/>
  <text x="1676" y="246" class="ui" font-size="42" fill="#E8EAED" text-anchor="middle" font-weight="500">K</text>
  <rect x="1498" y="316" width="120" height="30" rx="7" fill="#000000" opacity="0.5"/>
  <text x="1512" y="337" class="ui name">Karthik</text>

  <!-- SnapServe agent (active speaker) -->
  <rect x="1480" y="380" width="392" height="240" rx="12" fill="#1F2A37"/>
  <rect x="1480" y="380" width="392" height="240" rx="12" fill="none" stroke="#8AB4F8" stroke-width="4"/>
  <g transform="translate(1640,404) scale(3.0)">
    <mask id="agP" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="black"/>
      <rect x="4.3" y="3.2" width="15.4" height="14" rx="6" fill="white"/>
      <circle cx="9.3" cy="9" r="1.9" fill="black"/>
      <circle cx="14.7" cy="9" r="1.9" fill="black"/>
      <path d="M9.9 12.8c.945 1.68 3.255 1.68 4.2 0" stroke="black" stroke-width="1.35" stroke-linecap="round" fill="none"/>
    </mask>
    <rect x="1.1" y="7.9" width="3" height="6.4" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="19.9" y="7.9" width="3" height="6.4" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
    <rect width="24" height="24" fill="#FFFFFF" mask="url(#agP)"/>
    <rect x="5.4" y="19.2" width="13.2" height="3" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
  </g>
  <g fill="#8AB4F8">
    <rect x="1625" y="514" width="6" height="16" rx="3" opacity="0.45"/>
    <rect x="1641" y="504" width="6" height="36" rx="3" opacity="0.7"/>
    <rect x="1657" y="492" width="6" height="60" rx="3"/>
    <rect x="1673" y="486" width="6" height="72" rx="3"/>
    <rect x="1689" y="494" width="6" height="56" rx="3"/>
    <rect x="1705" y="506" width="6" height="32" rx="3" opacity="0.7"/>
    <rect x="1721" y="515" width="6" height="14" rx="3" opacity="0.45"/>
  </g>
  <rect x="1498" y="570" width="212" height="32" rx="7" fill="#000000" opacity="0.5"/>
  <text x="1512" y="592" class="ui agn">SnapServe Agent</text>

  <!-- slide control card -->
  <rect x="1480" y="640" width="392" height="140" rx="12" fill="#2A2D31"/>
  <text x="1504" y="676" class="ui railS">Agent slide control</text>
  <text x="1504" y="706" class="ui rail">next_slide &#183; goto_slide</text>
  <rect x="1504" y="722" width="150" height="34" rx="8" fill="#3C4043"/>
  <text x="1524" y="745" class="ui rail" fill="#E8EAED">Slide 3 of 12</text>
  <rect x="1668" y="722" width="180" height="34" rx="8" fill="#1F2A37"/>
  <circle cx="1690" cy="739" r="5" fill="#8AB4F8"/>
  <text x="1704" y="745" class="ui rail" fill="#8AB4F8">Screenshare on</text>

  <!-- caption -->
  <rect x="48" y="924" width="1136" height="72" rx="12" fill="#000000" opacity="0.62"/>
  <text x="76" y="954" class="ui meta">SnapServe Agent</text>
  <text x="76" y="982" class="ui cap">On this slide you can see how the agent joins and books the follow-up.</text>

  <!-- controls -->
  <g>
    <circle cx="1268" cy="960" r="30" fill="#3C4043"/>
    <path d="M1268 948a6 6 0 0 1 6 6v7a6 6 0 0 1-12 0v-7a6 6 0 0 1 6-6Z" fill="#E8EAED"/>
    <path d="M1258 961a10 10 0 0 0 20 0" stroke="#E8EAED" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <circle cx="1348" cy="960" r="30" fill="#3C4043"/>
    <rect x="1335" y="950" width="20" height="15" rx="3.5" fill="#E8EAED"/>
    <path d="M1355 954l8-4.5v16l-8-4.5z" fill="#E8EAED"/>

    <rect x="1400" y="936" width="196" height="48" rx="24" fill="#8AB4F8"/>
    <text x="1498" y="966" class="ui pill" text-anchor="middle">Stop presenting</text>

    <rect x="1620" y="936" width="106" height="48" rx="24" fill="#EA4335"/>
    <rect x="1652" y="954" width="42" height="12" rx="6" fill="#FFFFFF" transform="rotate(-38 1673 960)"/>
  </g>
</svg>
